# Example 10 (docs/02-algorithms.md §20 and §21, D55, D56): a LAN and two IS-IS levels.
# LAN1 is an Ethernet segment joining R2, R3 and R4 (metric 10 each way into the LAN).
# Area 49.0001: R1 (Level-1 only), R2, R3. Area 49.0002: R4, R5 (Level-1 only).
# R2 → R4 over LAN1: R2's interface to the LAN fails as a whole, so R3 across the LAN
# is no alternate (RFC 5286 §3.6). LFA = R3 over the point-to-point link R2–R3 (cost 25).
# TI-LFA: R2→R3 (15) → R4 (LAN, 10): [Prefix-SID(R4)] = 16004 out via R2–R3.
# Pick "IS-IS level" in the sidebar: Level-2 is R2, R3, R4; Level-1 49.0001 is R1, R2, R3.
name: LAN and IS-IS levels
srgb_base: 16000
nodes:
  - { id: R1, sid: 1, level: 1, area: "49.0001", pos: { x: 0, y: 0 } }
  - { id: R2, sid: 2, area: "49.0001", pos: { x: 200, y: -120 } }
  - { id: R3, sid: 3, area: "49.0001", pos: { x: 200, y: 120 } }
  - { id: R4, sid: 4, area: "49.0002", pos: { x: 500, y: 0 } }
  - { id: R5, sid: 5, level: 1, area: "49.0002", pos: { x: 700, y: 0 } }
links:
  - { a: R1, b: R2, metric: 10, level: 1 }
  - { a: R1, b: R3, metric: 10, level: 1 }
  - { a: R2, b: R3, metric: 15 }
  - { a: R3, b: R4, metric: 30, level: 2 }
  - { a: R4, b: R5, metric: 10, level: 1 }
lans:
  - { id: LAN1, metric: 10, members: [R2, R3, R4] }
