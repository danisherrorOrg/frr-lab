<rect x="-30" y="-30" width="1700" height="1274" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A19 · SRLG: links that fail together</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§18 of docs/02-algorithms.md  ·  RFC 4202 §2.3, RFC 9855 §1, RFC 7916 §6.2.4.1  ·  code: src/engine/srlg.ts, lfa.ts, tilfa.ts</tspan></text>
<rect x="0" y="110" width="600" height="634" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 9: one duct, two links</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">All metrics 1, except S–C and C–D = 3. S–E and A–B run in</tspan><tspan x="18" y="611.2">duct-1: one backhoe cuts both.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Blue: S’s normal path S→E→D (2). Red dashed: duct-1.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Orange: link protection, LFA A: S→A→B→D (3), straight into the</tspan><tspan x="18" y="691.2">duct.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="721.2">Green: SRLG protection, LFA C and TI-LFA: S→C→D (6).</tspan></text>
<rect x="620" y="110" width="1020" height="634" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: the protected link brings its shared links along</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">A link lists its groups (srlg: [duct-1]). For S–E, the shared links are the other links with a group in</tspan><tspan x="638" y="203.4">common: here A–B. Both directions fail.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="234.2">avoids shared link u→v:  dist(X,Y) &lt; dist(X,u) + c(u,v) + dist(v,Y)</tspan><tspan x="638" y="254.2">(a tie counts as &quot;may use it&quot;, as in B1)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="285.15">•  TI-LFA (RFC 9855 §1): the post-convergence SPF also removes A–B; every segment must avoid it too.</tspan><tspan x="638" y="306.4">•  LFA (RFC 7916 §6.2.4.1): SRLG-disjoint candidates rank first (S→N is not shared, and N’s path avoids</tspan><tspan x="638" y="327.65">   every shared link), then the usual order (B7). A candidate in the SRLG is still an LFA for the link</tspan><tspan x="638" y="348.9">   alone.</tspan><tspan x="638" y="370.15">•  Remote LFA: the PQ node is picked as usual (RFC 7490 has no SRLG rule), then checked. If the tunnel</tspan><tspan x="638" y="391.4">   and the PQ node’s path avoid A–B, it also counts as SRLG protection.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="425.05">S → D: the two candidates</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="454.3">N  Loop-free         Node-protecting        SRLG-disjoint                                  Cost</tspan><tspan x="638" y="471.8">-  ----------------  ---------------------  ---------------------------------------------  ----</tspan><tspan x="638" y="489.3">A  2 &lt; 1+2  ✓        2 &lt; 2+1  ✓             A’s path A-B-D uses A–B  ✗                     3</tspan><tspan x="638" y="506.8">C  3 &lt; 3+2  ✓        3 &lt; 4+1  ✓             3 &lt; dist(C,A)+1+dist(B,D) = 4+1+1 = 6  ✓       6</tspan><tspan x="638" y="524.3">                                            3 &lt; dist(C,B)+1+dist(A,D) = 4+1+2 = 7  ✓</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="553.25">protection: link   LFA A   TI-LFA S-A-B-D  [Prefix B, Prefix D] = 16004 16006</tspan><tspan x="638" y="572">protection: srlg   LFA C   TI-LFA S-C-D    [Prefix D]           = 16006</tspan></text>
