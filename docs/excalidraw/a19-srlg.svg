<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="208" y="373.8">A</tspan></text>
<ellipse cx="408" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="408" y="373.8">B</tspan></text>
<ellipse cx="318" cy="516" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="318" y="523.8">C</tspan></text>
<ellipse cx="548" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="548" y="373.8">D</tspan></text>
<polyline points="89,348 287,234" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="164.5" y="258">1  duct-1</tspan></text>
<polyline points="244,366 372,366" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="350">1  duct-1</tspan></text>
<polyline points="348,236 518,347" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="446" y="278">1</tspan></text>
<polyline points="94,366 172,366" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="133" y="350">1</tspan></text>
<polyline points="444,366 512,366" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="478" y="350">1</tspan></text>
<polyline points="89,384 287,498" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="176" y="468">3</tspan></text>
<polyline points="348,496 518,385" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="446" y="467">3</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="542.5" y="423.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="62" y="319.2">source</tspan></text>
<rect x="0" y="764" width="533" height="279" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="802.9">Fail the whole duct</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="836.15">Failing an SRLG is the multi-failure of A9 with</tspan><tspan x="18" y="857.4">every link of the group down: &quot;Fail SRLG duct-1 (2</tspan><tspan x="18" y="878.65">links)&quot;.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="908.25">link: S → A, A hits A–B,</tspan><tspan x="18" y="927">      A repairs again → loops</tspan><tspan x="18" y="945.75">srlg: S → C → D (6), delivered,</tspan><tspan x="18" y="964.5">      repaired by S alone</tspan></text>
<rect x="553" y="764" width="533" height="279" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="802.9">Fallback, one step at a time</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="834.25">srlg:       SRLG → link</tspan><tspan x="571" y="853">node-srlg:  node + SRLG → node</tspan><tspan x="571" y="871.75">            → SRLG → link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="903.15">The first that reaches D is installed; protects says</tspan><tspan x="571" y="924.4">which, fallback says why.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="953.3">S → E, node-srlg: D = E, so SRLG only</tspan><tspan x="571" y="970.8">S-C-D-E (7), dest-is-next-hop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1000.2">With C–D also in duct-1, D can’t be reached: link</tspan><tspan x="571" y="1020.2">protection, fallback none.</tspan></text>
<rect x="1107" y="764" width="533" height="279" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="1125" y="802.9">Coverage from S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="836.15">Coverage adds srlg: pairs whose link has shared</tspan><tspan x="1125" y="857.4">links, and how many backups avoid them all.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="887.25">SRLG pairs                 2  (D, E over S–E)</tspan><tspan x="1125" y="906">SRLG-safe LFA or RLFA      1  (D: LFA C)</tspan><tspan x="1125" y="924.75">SRLG-safe TI-LFA           2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="955.2">E’s PQ node B is reached over S-A-B, through the duct.</tspan><tspan x="1125" y="975.2">A link with no SRLG: SRLG protection = link protection.</tspan></text>
<rect x="0" y="1063" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1101.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1135.15">Links in the same SRLG fail together, so a backup for one of them must avoid all of them. With protection: srlg, TI-LFA removes the whole group and LFA prefers a</tspan><tspan x="18" y="1156.4">neighbor whose path stays out of it. In Example 9 that moves the repair from S-A-B-D, which runs into the duct, to S-C-D.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1209.2">Sources: docs/02-algorithms.md §18  ·  docs/learn/09-router-and-multiple-failures.md  ·  examples/09-srlg.yaml  ·  checked with the engine (results, coverage, simulation)</tspan></text>
</svg>
