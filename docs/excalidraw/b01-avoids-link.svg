<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1174" width="1700" height="1174">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1174" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B1 · Path avoids link S→E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§1.5 of docs/02-algorithms.md  ·  the test behind every inequality in RFC 5286, RFC 7490 and RFC 9855  ·  code: src/engine/spf.ts (avoidsLink, linkPathCost)</tspan></text>
<rect x="0" y="110" width="600" height="584" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 1: does N’s path to D use S→E?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Green: N’s shortest path to D, N→D (10).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">Red dashed: the cheapest path from N to D forced through S→E:</tspan><tspan x="18" y="641.2">N→S→E→D (15 + 10 + 10 = 35).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">10 &lt; 35, so no shortest path from N to D uses S→E.</tspan></text>
<rect x="620" y="110" width="1020" height="584" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: compare with the cheapest path forced over the link</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">all shortest paths X → Y avoid S→E   ⇔   dist(X,Y) &lt; dist(X,S) + c(S,E) + dist(E,Y)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="214.15">•  The right side is the cheapest X → … → S → E → … → Y. It needs only the distance table: no path has</tspan><tspan x="638" y="235.4">   to be listed.</tspan><tspan x="638" y="256.65">•  Strictly less: then even the cheapest path over the link is more expensive, so no shortest path uses</tspan><tspan x="638" y="277.9">   it.</tspan><tspan x="638" y="299.15">•  Equal (a tie): some equal-cost path may use the link. That counts as &quot;uses the link&quot;, the safe</tspan><tspan x="638" y="320.4">   choice.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="354.05">Worked checks</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="383.3">Example  X → Y    Link     Left       Right                          Result</tspan><tspan x="638" y="400.8">-------  -------  -------  ---------  -----------------------------  ------------------------</tspan><tspan x="638" y="418.3">1        N → D    S→E      10         15 + 10 + 10 = 35              10 &lt; 35  ✓  avoids</tspan><tspan x="638" y="435.8">1        S → D    S→E      20          0 + 10 + 10 = 20              20 = 20  ✗  uses (primary)</tspan><tspan x="638" y="453.3">1        E → S    S→E      10         10 + 10 + 10 = 30              10 &lt; 30  ✓  avoids S→E</tspan><tspan x="638" y="470.8">5        L1 → L2  L1→SP1   20          0 + 10 + 10 = 20              tie      ✗  uses</tspan><tspan x="638" y="488.3">5        SP2 → L2 L1→SP1   10         10 + 10 + 10 = 30              10 &lt; 30  ✓  avoids</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="518.2">Row 3: E → S goes over E→S, the other direction. The test is per direction, like the metrics: c(S,E) may</tspan><tspan x="638" y="538.2">differ from c(E,S).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="568.2">Row 4: L1 reaches L2 over SP1 and over SP2 (both 20). One of the two uses L1→SP1, so the answer is &quot;uses&quot;.</tspan></text>
<ellipse cx="128" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="128" y="253.8">S</tspan></text>
<ellipse cx="438" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="438" y="253.8">E</tspan></text>
<ellipse cx="128" cy="506" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="128" y="513.8">N</tspan></text>
<ellipse cx="438" cy="506" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="438" y="513.8">D</tspan></text>
<polyline points="128,470 128,282" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="149.5" y="383">15</tspan></text>
<polyline points="164,246 402,246" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="283" y="230">c(S,E) = 10</tspan></text>
<polyline points="438,282 438,470" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="416.5" y="383">10</tspan></text>
<polyline points="164,506 402,506" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="283.5" y="535">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="128.5" y="563.2">X = N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="563.2">Y = D</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="283.5" y="371.25">dist(N,D)=10 &lt; 35</tspan></text>
<rect x="0" y="714" width="533" height="229" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="752.9">Where it is used</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="783.3">B2   ECMP: X = other next hop, Y = D</tspan><tspan x="18" y="800.8">B8   P-space: X = S, Y = each router</tspan><tspan x="18" y="818.3">B10  Q-space: X = each router, Y = E</tspan><tspan x="18" y="835.8">B15  TI-LFA walk, check (b): every</tspan><tspan x="18" y="853.3">     Prefix-SID segment X → Y</tspan><tspan x="18" y="870.8">A19  SRLG: once per shared link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="900.2">LFA’s loop-free test (B3) is the same idea with the</tspan><tspan x="18" y="920.2">path forced through router S.</tspan></text>
<rect x="553" y="714" width="533" height="229" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="752.9">Why a tie counts as &quot;uses&quot;</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="786.15">With equal cost paths, routers share traffic over</tspan><tspan x="571" y="807.4">all of them (ECMP). If one of them crosses S→E, some</tspan><tspan x="571" y="828.65">traffic does too, so it can’t be counted on as a</tspan><tspan x="571" y="849.9">backup.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="880.2">The per-link view (A12) asks the opposite question and</tspan><tspan x="571" y="900.2">uses &quot;=&quot; on purpose: does some shortest path use it?</tspan></text>
<rect x="1107" y="714" width="533" height="229" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="752.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="786.15">•  Parallel links (A10): c(S,E) is the metric of the</tspan><tspan x="1125" y="807.4">   one link meant, not the bundle’s.</tspan><tspan x="1125" y="828.65">•  Overload bit (A17): if S or E would be transit</tspan><tspan x="1125" y="849.9">   and is overloaded, the right side is ∞.</tspan><tspan x="1125" y="871.15">•  LAN (A21): S’s other LAN links are checked too,</tspan><tspan x="1125" y="892.4">   as for an SRLG.</tspan></text>
<rect x="0" y="963" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1001.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1035.15">To know whether X’s traffic to Y crosses the link S→E, compare dist(X,Y) with the cheapest path forced over that link. Strictly smaller means no shortest path uses it;</tspan><tspan x="18" y="1056.4">a tie counts as &quot;uses&quot;, because ECMP may send some traffic over it.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1109.2">Sources: docs/02-algorithms.md §1.4–1.5  ·  docs/learn/02-shortest-paths.md (&quot;Does this path use that link?&quot;)  ·  examples/01-square.yaml, 05-leaf-spine.yaml</tspan></text>
</svg>
