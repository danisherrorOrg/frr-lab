<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1379" width="1700" height="1379">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1379" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A4 · Remote LFA: node protection</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3.1 of docs/02-algorithms.md  ·  RFC 8102  ·  pick a PQ node whose whole repair also survives router E failing  ·  code: src/engine/rlfa.ts</tspan></text>
<rect x="0" y="110" width="600" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 8: protect against router E, S → D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="611.2">S’s normal path to D is S → E → D (cost 2 + 2 = 4).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Red dashed: router E fails, with all its links. Link-mode PQ</tspan><tspan x="18" y="661.2">node B reaches D over B → E → D, so it breaks.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Green arrows: the node-protecting repair, tunnel to C out via</tspan><tspan x="18" y="711.2">N, then C → D. Cost 2 + 3 + 3 + 3 = 11.</tspan></text>
<rect x="620" y="110" width="1020" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: Remote LFA, then two extra checks per PQ candidate</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">1. No LFA</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.2">N:  dist(N,D) &lt; dist(N,S) + dist(S,D)   →   6 &lt; 2 + 4 = 6   fails (tie)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="248.05">2. Link-protecting Remote LFA (A3) picks B, which goes through E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="279.2">P(S) = {N}   extended via N = {N, B, C}   Q(E) = {B, C, D}   PQ = {B, C}</tspan><tspan x="638" y="299.2">best = B via N: c(S,N) + dist(N,B) = 2 + 3 = 5     (C via N: 2 + 6 = 8)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="332.05">3. Node checks for every Y in Q(E) (B12)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="363.2">Y   a) tunnel avoids E  (via N)         b) Y’s path to D avoids E           node PQ?</tspan><tspan x="638" y="383.2">    dist(N,Y) &lt; dist(N,E) + dist(E,Y)   dist(Y,D) &lt; dist(Y,E) + dist(E,D)</tspan><tspan x="638" y="403.2">--  ----------------------------------  ----------------------------------  --------</tspan><tspan x="638" y="423.2">B   3 &lt; 4 + 1 = 5   ✓                   3 &lt; 1 + 2 = 3   ✗ (B → E → D)      no</tspan><tspan x="638" y="443.2">C   6 &lt; 4 + 4 = 8   ✓                   3 &lt; 4 + 2 = 6   ✓                  yes</tspan><tspan x="638" y="463.2">D   own 4 &lt; 2+2 ✗,  via N 6 &lt; 4+2 ✗      –                                  no</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="493.2">c) Y must also not have the overload bit set (RFC 7490 §5.4). Ties count as &quot;may use E&quot;.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="526.05">4. Result</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="558.15">Node-protecting PQ = {C}. Best = C, out via N, cost c(S,N) + dist(N,C) = 2 + 6 = 8. The repair S → N →</tspan><tspan x="638" y="579.4">B → C → D costs 11. If router E fails, it still gets through, where the tunnel to B breaks at B. The</tspan><tspan x="638" y="600.65">row shows rlfa.protects = node.</tspan></text>
<ellipse cx="108" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="108" y="273.8">N</tspan></text>
<ellipse cx="318" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="318" y="273.8">B</tspan></text>
<ellipse cx="508" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="508" y="273.8">C</tspan></text>
<ellipse cx="108" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="108" y="493.8">S</tspan></text>
<ellipse cx="318" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="318" y="493.8">E</tspan></text>
<ellipse cx="508" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="508" y="493.8">D</tspan></text>
<polyline points="144,486 282,486" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="213" y="515">2</tspan></text>
<polyline points="354,486 472,486" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413" y="515">2</tspan></text>
<polyline points="318,450 318,302" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="334" y="383">1</tspan></text>
<polyline points="108,450 108,302" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="92" y="383">2</tspan></text>
<polyline points="144,266 282,266" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="213" y="250">3</tspan></text>
<polyline points="354,266 472,266" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413" y="250">3</tspan></text>
<polyline points="508,302 508,450" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="524" y="383">3</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="108.5" y="211.15">exit</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="318" y="211.15">link PQ: B → E → D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="508.5" y="211.15">node PQ</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="108" y="551.15">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="318" y="551.15">router E fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="508.5" y="551.15">destination</tspan></text>
<rect x="0" y="754" width="533" height="394" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="792.9">The node checks in full (B12)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="826.15">a) The tunnel to Y avoids E. Either S’s own path:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="856.25">dist(S,Y) &lt; dist(S,E) + dist(E,Y)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="887.15">or through a neighbor N ≠ E (same exits as A3):</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="917.25">dist(N,Y) &lt; dist(N,E) + dist(E,Y)</tspan><tspan x="18" y="936">and dist(N,Y) &lt; dist(N,S) + dist(S,Y)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="967.15">b) Y’s own path to D avoids E:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="997.25">dist(Y,D) &lt; dist(Y,E) + dist(E,D)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1028.15">c) Y is not overloaded.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1059.2">The second test in a) is the link rule of A3. RFC 8102</tspan><tspan x="18" y="1079.2">§2.2.6.2 only states the first; keeping both is</tspan><tspan x="18" y="1099.2">stricter, never looser.</tspan></text>
<rect x="553" y="754" width="533" height="394" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="792.9">Choosing and falling back</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="828.05">Best node PQ (RFC 8102 §2.3.4)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="860.15">Lowest cost from S (the cheapest way in from step</tspan><tspan x="571" y="881.4">a), then lowest router id.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="915.05">Which one is installed</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="947.15">•  There is an LFA: LFA, Remote LFA doesn’t run</tspan><tspan x="571" y="968.4">   (B13).</tspan><tspan x="571" y="989.65">•  A node PQ exists: use it, protects = node.</tspan><tspan x="571" y="1010.9">•  None passes: the link PQ of A3, protects = link,</tspan><tspan x="571" y="1032.15">   fallback = none.</tspan><tspan x="571" y="1053.4">•  D = E: node protection can’t apply, fallback =</tspan><tspan x="571" y="1074.65">   dest-is-next-hop.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1105.2">RFC 8102 gives no fallback rule; this one keeps the</tspan><tspan x="571" y="1125.2">link protected (D51).</tspan></text>
<rect x="1107" y="754" width="533" height="394" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="1125" y="792.9">How it differs from link mode</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="826.15">•  It depends on D: worked out per (D, link S–E),</tspan><tspan x="1125" y="847.4">   not once per link. Check b) looks at D.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="879.15">•  It aims at D through a router that avoids E, not</tspan><tspan x="1125" y="900.4">   just at E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="932.15">•  LFAs are not changed. To prefer or require</tspan><tspan x="1125" y="953.4">   node-protecting LFAs, use the LFA policy (A16).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="984.2">Not modelled: RFC 8102’s preference for a PQ node that</tspan><tspan x="1125" y="1004.2">covers more ECMP next hops. LFA Lab protects each</tspan><tspan x="1125" y="1024.2">primary link on its own.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1054.2">Turn it on with protection: node (Topology settings →</tspan><tspan x="1125" y="1074.2">Node failure).</tspan></text>
<rect x="0" y="1168" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1206.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1240.15">A link-protecting PQ node can still route through router E. Node protection adds two checks (the tunnel avoids E, and the PQ node’s own path to D avoids E), so the</tspan><tspan x="18" y="1261.4">repair survives the whole router failing. Here B fails, C passes.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1314.2">Sources: docs/02-algorithms.md §3.1  ·  docs/learn/05-remote-lfa.md (Node protection)  ·  examples/08-node-protection.yaml</tspan></text>
</svg>
