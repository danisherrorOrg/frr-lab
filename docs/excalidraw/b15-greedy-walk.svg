<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1234" width="1700" height="1234">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1234" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B15 · Greedy segment walk: jump as far as a Prefix-SID safely goes</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4.2 of docs/02-algorithms.md  ·  RFC 9855 §5, §6  ·  RFC 8402 (Prefix-SID, Adj-SID)  ·  code: src/engine/tilfa.ts (segment walk)</tspan></text>
<rect x="0" y="110" width="600" height="644" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 4: PE1 → P1, link PE1–P1 fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Red dashed: the failed link PE1–P1. PE2 (off P3 and P4) is not</tspan><tspan x="18" y="611.2">drawn.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Green: the post-convergence path PE1 → P2 → P1 (10 + 30 = 40,</tspan><tspan x="18" y="661.2">B14).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Orange: P2’s own (old) path to P1 is P2 → PE1 → P1 (20). It</tspan><tspan x="18" y="711.2">crosses the failed link, so PrefixSID(P1) from P2 would loop</tspan><tspan x="18" y="731.2">back. The walk forces the link P2 → P1 instead.</tspan></text>
<rect x="620" y="110" width="1020" height="644" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: from where you are, take the furthest safe Prefix-SID</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="180.25">current = S</tspan><tspan x="638" y="199">while current ≠ D:</tspan><tspan x="638" y="217.75">  Y = furthest router on the path after current with</tspan><tspan x="638" y="236.5">      (a) dist(current,Y) = path cost current → Y</tspan><tspan x="638" y="255.25">      (b) every old shortest path current → Y avoids S–E  (B1)</tspan><tspan x="638" y="274">  found?  PrefixSID(Y),               current = Y</tspan><tspan x="638" y="292.75">  none?   AdjSID(current → next hop), current = next hop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="324.15">•  Only S has switched to the repair. Every other router still uses its old table, and a Prefix-SID</tspan><tspan x="638" y="345.4">   follows that table. So a segment is safe only if all old paths to its end avoid the failed link.</tspan><tspan x="638" y="366.65">•  Furthest first: fewer segments, fewer labels. An Adj-SID moves one hop, so the walk always ends.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="400.05">Example 4, step by step (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="429.3">From  Try Y  (a) dist = path?    (b) dist &lt; dist(X,S) + c(S,E) + dist(E,Y)   Segment</tspan><tspan x="638" y="446.8">----  -----  ------------------  ------------------------------------------  ----------------</tspan><tspan x="638" y="464.3">PE1   P1     10 vs 40   ✗        10 &lt; 0 + 10 + 0  = 10   ✗</tspan><tspan x="638" y="481.8">PE1   P2     10 = 10    ✓        10 &lt; 0 + 10 + 20 = 30   ✓                   PrefixSID(P2)</tspan><tspan x="638" y="499.3">P2    P1     20 vs 30   ✗        20 &lt; 10 + 10 + 0 = 20   ✗                   AdjSID(P2→P1)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="638" y="527.3">walk      [PrefixSID(P2), AdjSID(P2→P1)]</tspan><tspan x="638" y="544.8">clean-up  drop PrefixSID(P2): it only reaches the first hop  (B16)</tspan><tspan x="638" y="562.3">end       add PrefixSID(P1), the destination’s own label       (B17)</tspan><tspan x="638" y="579.8">result    [AdjSID(P2→P1), PrefixSID(P1)] = 24000, 16001, out via P2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="612.05">Example 3, S → C (ring, B–C = 10): a jump, then a forced link</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="641.3">S    C   2 vs 12  ✗   2 &lt; 0 + 1 + 1 = 2   ✗</tspan><tspan x="638" y="658.8">S    B   2 = 2    ✓   2 &lt; 0 + 1 + 3 = 4   ✓   PrefixSID(B)</tspan><tspan x="638" y="676.3">B    C   4 vs 10  ✗   4 &lt; 2 + 1 + 1 = 4   ✗   AdjSID(B→C)   (B’s old path B → A → S → E → C)</tspan><tspan x="638" y="693.8">→  [PrefixSID(B), AdjSID(B→C), PrefixSID(C)] = 16004, 24005, 16005</tspan></text>
<ellipse cx="68" cy="361" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="68.5" y="368.8">PE1</tspan></text>
<ellipse cx="238" cy="226" rx="30" ry="30" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="238.5" y="233.8">P1</tspan></text>
<ellipse cx="238" cy="496" rx="30" ry="30" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="238.5" y="503.8">P2</tspan></text>
<ellipse cx="448" cy="226" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="448.5" y="233.8">P3</tspan></text>
<ellipse cx="448" cy="496" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="448.5" y="503.8">P4</tspan></text>
<polyline points="95,340 212,247" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="136.5" y="279">10</tspan></text>
<polyline points="95,382 212,475" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="136.5" y="456">10</tspan></text>
<polyline points="238,462 238,260" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="259.5" y="368">30</tspan></text>
<polyline points="272,226 414,226" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="343.5" y="210">10</tspan></text>
<polyline points="272,496 414,496" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="343.5" y="525">10</tspan></text>
<polyline points="448,260 448,462" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="469.5" y="368">30</tspan></text>
<polyline points="259,253 427,469" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="356.5" y="312.15">20 / 40</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="68.5" y="316.25">S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="238.5" y="183.25">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="238" y="549.25">PrefixSID(P2): reach P2 first</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="313.5" y="439.25">AdjSID(P2→P1)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="78" y="185.3">P2’s old path:</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="78" y="205.3">P2 → PE1 → P1</tspan></text>
<rect x="0" y="774" width="533" height="229" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="812.9">Why check (b), and why (a)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="846.15">(b) is what keeps the repair loop-free: the routers</tspan><tspan x="18" y="867.4">along a segment haven’t switched, so the segment</tspan><tspan x="18" y="888.65">must work on their old tables. It is B1 with X =</tspan><tspan x="18" y="909.9">current (node mode: B19).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="940.2">(a) always holds when (b) does. It is kept because it</tspan><tspan x="18" y="960.2">makes the Explain steps easier to follow.</tspan></text>
<rect x="553" y="774" width="533" height="229" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="812.9">How many labels</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="843.3">0  first hop is an LFA (Ex. 1)</tspan><tspan x="571" y="860.8">1  a PQ node on the path (Ex. 2),</tspan><tspan x="571" y="878.3">   or one Adj-SID (Ex. 4)</tspan><tspan x="571" y="895.8">2  P and Q adjacent: Prefix + Adj</tspan><tspan x="571" y="913.3">   (Ex. 3)</tspan><tspan x="571" y="930.8">3+ rare, long detours</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="960.2">Extra labels = segments − 1 (B17). MSD limits the total</tspan><tspan x="571" y="980.2">(A15).</tspan></text>
<rect x="1107" y="774" width="533" height="229" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="812.9">Guarantees</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="846.15">•  Ends: every step moves at least one hop.</tspan><tspan x="1125" y="867.4">•  Loop-free and costs exactly the post-convergence</tspan><tspan x="1125" y="888.65">   cost: each Prefix segment follows old paths that</tspan><tspan x="1125" y="909.9">   avoid S–E and cost the same. A property test</tspan><tspan x="1125" y="931.15">   checks it on random networks.</tspan><tspan x="1125" y="952.4">•  Adj-SID labels: B18.</tspan></text>
<rect x="0" y="1023" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1061.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1095.15">Walk along the post-convergence path and, from where you are, jump to the furthest router whose old shortest paths all avoid the failed link (a Prefix-SID). If not even</tspan><tspan x="18" y="1116.4">the next router qualifies, force that one link with an Adj-SID. In Example 4 that gives PrefixSID(P2), then AdjSID(P2→P1).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1169.2">Sources: docs/02-algorithms.md §4.2, §6 (Example 3)  ·  docs/learn/07-ti-lfa.md (Step 2)  ·  examples/04-isp-core.yaml, 03-ring5-highmetric.yaml  ·  checked with computeForSource()</tspan></text>
</svg>
