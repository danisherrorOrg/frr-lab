<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1286" width="1700" height="1286">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1286" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B16 · Clean-up: drop a first segment that only reaches the first hop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4.2 of docs/02-algorithms.md  ·  RFC 9855 §5 (outgoing interface + repair list), §5.1  ·  DECISIONS.md D11  ·  code: src/engine/tilfa.ts</tspan></text>
<rect x="0" y="110" width="600" height="674" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 3 from B: B → A, link B–A fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Ring, every link 1 except B–C = 10. Here the source (S in the</tspan><tspan x="18" y="611.2">rule) is router B.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Red dashed: the failed link B–A.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Green: the post-convergence path B → C → E → S → A (13). Its</tspan><tspan x="18" y="691.2">first hop is C.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="721.2">Orange: the walk starts with AdjSID(B→C), since B’s old path</tspan><tspan x="18" y="741.2">to C is B → A → S → E → C (4). But the repair leaves B on the</tspan><tspan x="18" y="761.2">link B–C anyway, so that label adds nothing: it is dropped.</tspan></text>
<rect x="620" y="110" width="1020" height="674" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: the outgoing link already gets you to the first hop</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="181.2">first hop N = the router after S on the post-convergence path</tspan><tspan x="638" y="201.2">first segment = PrefixSID(N) or AdjSID(S→N)   →  drop it</tspan><tspan x="638" y="221.2">exception: N is D itself  →  keep PrefixSID(D) (the destination’s label, B17)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="252.15">•  RFC 9855 §5: a repair is an outgoing interface plus a repair list. The interface is always the</tspan><tspan x="638" y="273.4">   path’s first link, so the packet arrives at N with no help.</tspan><tspan x="638" y="294.65">•  A label for N would only be popped by N straight away. Dropping it saves a label, and labels are</tspan><tspan x="638" y="315.9">   limited (MSD, A15).</tspan><tspan x="638" y="337.15">•  The greedy walk (B15) can’t know this: from S, N is often the furthest safe Prefix-SID, or the next</tspan><tspan x="638" y="358.4">   hop needs an Adj-SID.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="392.05">Example 3 from B, step by step (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="421.3">From  Try Y  (a)          (b)                          Segment</tspan><tspan x="638" y="438.8">----  -----  -----------  ---------------------------  -------------</tspan><tspan x="638" y="456.3">B     C      4 vs 10  ✗   4 &lt; 0 + 1 + 3 = 4   ✗        AdjSID(B→C)</tspan><tspan x="638" y="473.8">C     A      3 = 3    ✓   3 &lt; 4 + 1 + 0 = 5   ✓        PrefixSID(A)</tspan><tspan x="638" y="491.3">clean-up: AdjSID(B→C) only reaches the first hop C  →  dropped</tspan><tspan x="638" y="508.8">result:   [PrefixSID(A)] = 16003, out via C, 0 extra labels</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="541.05">Every kind of clean-up in the examples</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="570.3">Example        Row         Walk                             Dropped          Final</tspan><tspan x="638" y="587.8">-------------  ----------  -------------------------------  ---------------  ------------------------</tspan><tspan x="638" y="605.3">1  square      S → D       [P(N), P(D)]                     P(N)             [P(D)] = 16004</tspan><tspan x="638" y="622.8">3  ring, B–C   B → A       [Adj(B→C), P(A)]                 Adj(B→C)         [P(A)] = 16003</tspan><tspan x="638" y="640.3">4  ISP core    PE1 → P1    [P(P2), Adj(P2→P1)]              P(P2)            [Adj(P2→P1), P(P1)]</tspan><tspan x="638" y="657.8">5  leaf-spine  SP1 → L1    [P(L2), P(SP2), P(L1)]           P(L2)            [P(SP2), P(L1)]</tspan><tspan x="638" y="675.3">7  parallel    S → E       [Adj(S→E over S-E#2)]  (N = D)   Adj(S→E)         [P(E)] = 16002</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="705.2">P = PrefixSID, Adj = AdjSID. In rows 4 and 7 the destination’s label is added back afterwards (B17).</tspan></text>
<ellipse cx="148" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="148" y="243.8">S</tspan></text>
<ellipse cx="448" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="448" y="243.8">E</tspan></text>
<ellipse cx="518" cy="446" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="518" y="453.8">C</tspan></text>
<ellipse cx="298" cy="491" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="498.8">B</tspan></text>
<ellipse cx="78" cy="446" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="78" y="453.8">A</tspan></text>
<polyline points="263,484 114,453" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="193" y="452">1</tspan></text>
<polyline points="333,484 482,453" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="412.5" y="499">10</tspan></text>
<polyline points="507,412 460,270" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="502" y="341">1</tspan></text>
<polyline points="412,236 184,236" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298" y="220">1</tspan></text>
<polyline points="137,270 90,412" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="94" y="341">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="298" y="548.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="78.5" y="503.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="518.5" y="503.2">first hop N</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="308" y="346.25">AdjSID(B→C): dropped</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="308" y="376.25">PrefixSID(A): kept</tspan></text>
<rect x="0" y="804" width="533" height="231" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="842.9">Why the exception never bites</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="876.15">If N is D, could the walk start with PrefixSID(D)?</tspan><tspan x="18" y="897.4">No: S–E is a primary link for D, so S’s old path to</tspan><tspan x="18" y="918.65">D uses it and check (b) fails. The walk gives</tspan><tspan x="18" y="939.9">AdjSID(S→D) instead, which is dropped, and B17 adds</tspan><tspan x="18" y="961.15">PrefixSID(D) back.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="992.2">Example 7, S → E over the second link S-E#2 shows</tspan><tspan x="18" y="1012.2">exactly that.</tspan></text>
<rect x="553" y="804" width="533" height="231" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="842.9">Without it</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="876.15">Example 1 would need [16003, 16004]: 1 extra label</tspan><tspan x="571" y="897.4">for what is really a plain LFA (S → N → D). With the</tspan><tspan x="571" y="918.65">clean-up it is [16004], 0 extra labels, the same as</tspan><tspan x="571" y="939.9">the LFA.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="970.2">Found when the worked examples were first checked with</tspan><tspan x="571" y="990.2">a script (D11).</tspan></text>
<rect x="1107" y="804" width="533" height="231" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="842.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="876.15">•  Only the first segment is checked. Later Adj-SIDs</tspan><tspan x="1125" y="897.4">   stay: they force a link the old tables wouldn’t</tspan><tspan x="1125" y="918.65">   use.</tspan><tspan x="1125" y="939.9">•  Parallel links (A10): &quot;out via E over S-E#2&quot;</tspan><tspan x="1125" y="961.15">   names the exact link, so its Adj-SID can go too.</tspan><tspan x="1125" y="982.4">•  Node mode (B19): the same rule.</tspan></text>
<rect x="0" y="1055" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1093.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1127.15">A TI-LFA repair always leaves S on the first link of the post-convergence path, so a first segment that only gets to that first hop (a PrefixSID or an AdjSID) is wasted</tspan><tspan x="18" y="1148.4">and dropped. That is why a repair whose first hop is already an LFA needs 0 extra labels.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1201.2">Sources: docs/02-algorithms.md §4.2, §6 (Example 1)  ·  docs/learn/07-ti-lfa.md (clean-up rules)  ·  examples/03-ring5-highmetric.yaml, 01-square.yaml, 04-isp-core.yaml,</tspan><tspan x="0" y="1221.2">05-leaf-spine.yaml, 07-parallel.yaml  ·  checked with computeForSource()</tspan></text>
</svg>
