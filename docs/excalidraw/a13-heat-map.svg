<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1332" width="1700" height="1332">
<defs>
</defs>
<rect x="-30" y="-30" width="1700" height="1332" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A13 · Coverage heat map: where are the gaps?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§12 of docs/02-algorithms.md  ·  the §5 coverage numbers grouped by router and by link; nothing new is decided  ·  code: src/engine/heat-map.ts</tspan></text>
<rect x="0" y="110" width="600" height="694" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 3, heat map in LFA mode</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="631.2">All metrics 1, except C–B = 10. Each router and link shows its</tspan><tspan x="18" y="651.2">LFA share.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Green: 100%. Amber: 75–99%. Red: under 50%.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="711.2">Gray dashed &quot;–&quot;: 0 pairs. No shortest path uses C–B; it is</tspan><tspan x="18" y="731.2">only a backup.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="761.2">The % is written on each one, so colour is never the only</tspan><tspan x="18" y="781.2">signal.</tspan></text>
<rect x="620" y="110" width="1020" height="694" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: run every router once, count each pair twice</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">A pair = (destination D, primary link S–E), as in A8. coverageMap() runs computeForSource() for every</tspan><tspan x="638" y="203.4">router, then adds each pair to:</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="235.15">•  the router R that repairs it (the PLR, R = S): R’s own coverage row</tspan><tspan x="638" y="256.4">•  the link it protects, S–E, with both directions added up</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="287.2">share in a mode = pairs protected in that mode / pairs</tspan><tspan x="638" y="307.2">modes: LFA (ECMP counts as LFA) · LFA + Remote LFA · TI-LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="340.05">Example 3, every router as the source</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="369.3">Router  Pairs  LFA        LFA + RLFA  TI-LFA      Link  Pairs  LFA        LFA + RLFA  TI-LFA</tspan><tspan x="638" y="386.8">------  -----  ---------  ----------  ----------  ----  -----  ---------  ----------  ----------</tspan><tspan x="638" y="404.3">S       4      0    0%    0    0%     4   100%    S–E   5      0    0%    0    0%     5   100%</tspan><tspan x="638" y="421.8">E       4      0    0%    0    0%     4   100%    A–S   5      0    0%    0    0%     5   100%</tspan><tspan x="638" y="439.3">A       4      0    0%    0    0%     4   100%    B–A   5      4   80%    4   80%     5   100%</tspan><tspan x="638" y="456.8">B       4      4  100%    4  100%     4   100%    E–C   5      4   80%    4   80%     5   100%</tspan><tspan x="638" y="474.3">C       4      4  100%    4  100%     4   100%    C–B   0      –          –           –</tspan><tspan x="638" y="491.8">------  -----                                     ----  -----</tspan><tspan x="638" y="509.3">total   20     8   40%    8   40%    20   100%    total 20     8   40%    8   40%    20   100%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="542.05">Where a link’s 5 pairs come from (FRR is local repair)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="572.25">S–E:  S over S→E: E, C (2)     +  E over E→S: S, A, B (3)     = 5, no LFA</tspan><tspan x="638" y="591">B–A:  B over B→A: A, S, E, C (4, LFA C)  +  A over A→B: B (1, TI-LFA only)  = 4/5 LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="621.2">Every pair has exactly one router and one link, so both columns add up to the all-sources total (20).</tspan></text>
<ellipse cx="88" cy="316" rx="32" ry="32" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="88" y="323.8">S</tspan></text>
<ellipse cx="288" cy="226" rx="32" ry="32" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="288" y="233.8">E</tspan></text>
<ellipse cx="498" cy="316" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="498" y="323.8">C</tspan></text>
<ellipse cx="408" cy="526" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="408" y="533.8">B</tspan></text>
<ellipse cx="168" cy="526" rx="32" ry="32" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="168" y="533.8">A</tspan></text>
<polyline points="121,301 255,241" fill="none" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="201.5" y="307.15">0/5  0%</tspan></text>
<polyline points="321,240 465,302" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f08c00" text-anchor="middle" xml:space="preserve"><tspan x="379.5" y="308.15">4/5  80%</tspan></text>
<polyline points="484,349 422,493" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="411.5" y="408.15">–  (10)</tspan></text>
<polyline points="372,526 204,526" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f08c00" text-anchor="middle" xml:space="preserve"><tspan x="288.5" y="510.15">4/5  80%</tspan></text>
<polyline points="155,492 101,349" fill="none" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="170.5" y="410.15">0/5  0%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="88.5" y="267.15">0/4  0%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="288.5" y="177.15">0/4  0%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="498" y="267.15">4/4  100%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="408" y="585.15">4/4  100%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="585.15">0/4  0%</tspan></text>
<rect x="0" y="824" width="533" height="277" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="862.9">Buckets on the canvas</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="895.2">100%      ✓   green</tspan><tspan x="18" y="915.2">75–99%        amber</tspan><tspan x="18" y="935.2">50–74%        orange</tspan><tspan x="18" y="955.2">under 50%     red</tspan><tspan x="18" y="975.2">0 pairs   –   gray</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1006.15">Same Example 3 in TI-LFA mode: every router and link</tspan><tspan x="18" y="1027.4">100% (C–B still &quot;–&quot;).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1058.2">Example 2 (C–B = 1): every router and every link 2/4 =</tspan><tspan x="18" y="1078.2">50% LFA, 4/4 with Remote LFA.</tspan></text>
<rect x="553" y="824" width="533" height="277" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="862.9">A router’s % is not &quot;what if R fails&quot;</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="896.15">Router R’s number is link protection: &quot;if one of R’s</tspan><tspan x="571" y="917.4">own links fails, how much of R’s traffic has a</tspan><tspan x="571" y="938.65">backup?&quot;</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="970.15">Router B at 100% says nothing about what happens</tspan><tspan x="571" y="991.4">when B itself fails. For that, fail the router:</tspan><tspan x="571" y="1012.65">Weakest spots (A18) or the simulation (A9).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1043.2">In node mode (A6) the counted backups are the</tspan><tspan x="571" y="1063.2">node-protecting ones where they exist.</tspan></text>
<rect x="1107" y="824" width="533" height="277" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="862.9">A &quot;–&quot; link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="896.15">A link on no shortest path is no pair’s primary</tspan><tspan x="1125" y="917.4">link, so it has 0 pairs. It is never &quot;unprotected&quot;;</tspan><tspan x="1125" y="938.65">it can only carry backup traffic.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="968.25">Ex. 3, C–B (metric 10): 0 pairs</tspan><tspan x="1125" y="987">Ex. 7, S-E#2 (20 &gt; 10): 0 pairs</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1017.2">A link’s pairs are the per-link view’s rows (A12)</tspan><tspan x="1125" y="1037.2">counted.</tspan></text>
<rect x="0" y="1121" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1159.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1193.15">The heat map shows where the gaps are: each router and link gets the share of its pairs that have a backup in the chosen repair mode. In Example 3 with LFA only, S, E,</tspan><tspan x="18" y="1214.4">A and the links S–E and A–S are at 0%; only TI-LFA covers them.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1267.2">Sources: docs/02-algorithms.md §12  ·  docs/learn/10-design-checks.md (Heat map)  ·  examples/03-ring5-highmetric.yaml, 02-ring5.yaml  ·  checked with coverageMap()</tspan></text>
</svg>
