<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1206" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A21 · LAN links: one interface, several neighbors</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§20 of docs/02-algorithms.md  ·  ISO 10589 §7.2.3 (pseudonode), RFC 5286 §3.6, RFC 8667 §2.2.2  ·  code: src/engine/lan.ts</tspan></text>
<rect x="0" y="110" width="600" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 10: LAN1 = {R2, R3, R4}, R2 → R4</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Square: the pseudonode of LAN1. Each member reaches it at 10,</tspan><tspan x="18" y="611.2">and it reaches each member at 0.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Blue: R2’s normal path to R4, over the LAN (10).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Red dashed: R2’s interface to the LAN. It fails as a whole.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="701.2">Green: LFA and TI-LFA, R2 →(15)→ R3 →(LAN, 10)→ R4 = 25.</tspan></text>
<rect x="620" y="110" width="1020" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: point-to-point maths, with a fate group</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">Model</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="216.15">Each pair of members gets a link LAN1:A-B. A → pseudonode → B costs m_A + 0, so:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="247.2">c(A,B) = m_A      c(B,A) = m_B</tspan><tspan x="638" y="267.2">LAN1:R2-R3, LAN1:R2-R4, LAN1:R3-R4, each 10 both ways</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="298.15">Distances, first hops and ECMP are the pseudonode’s exactly, and no fake router enters any space, path</tspan><tspan x="638" y="319.4">or label stack. Adj-SIDs are per neighbor on the LAN (LAN-Adj-SIDs).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="353.05">What fails: S’s whole interface to the LAN</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="385.15">Protecting LAN1:R2-R4 means R2’s interface fails, so its other LAN links fail too: the fate group is</tspan><tspan x="638" y="406.4">{LAN1:R2-R3}.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="438.15">•  LFA: a candidate over the same LAN is skipped (reason same-lan, RFC 5286 §3.6). A candidate’s own</tspan><tspan x="638" y="459.4">   path may cross the LAN between other members.</tspan><tspan x="638" y="480.65">•  ECMP: another next hop on the same LAN is no protector.</tspan><tspan x="638" y="501.9">•  Remote LFA: P(S) also needs S’s path to avoid its other LAN links, which are never a tunnel exit.</tspan><tspan x="638" y="523.15">   Q-space is unchanged.</tspan><tspan x="638" y="544.4">•  TI-LFA: the post-convergence SPF removes the whole interface, and every segment must avoid it, as</tspan><tspan x="638" y="565.65">   for an SRLG (A19).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="599.05">R2 → R4: the candidates</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="628.3">R3 over LAN1:R2-R3   skipped: same LAN as the protected link (as plain links it would win: 20)</tspan><tspan x="638" y="645.8">R1 over R1–R2        dist(R1,R4)=20 &lt; dist(R1,R2)+dist(R2,R4) = 10+10 = 20 ✗  (tie)</tspan><tspan x="638" y="663.3">R3 over R2–R3        dist(R3,R4)=10 &lt; dist(R3,R2)+dist(R2,R4) = 10+10 = 20 ✓  cost 15+10 = 25</tspan></text>
<ellipse cx="58" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="58.5" y="373.8">R1</tspan></text>
<ellipse cx="208" cy="216" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="223.8">R2</tspan></text>
<ellipse cx="208" cy="516" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="523.8">R3</tspan></text>
<ellipse cx="478" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="478.5" y="373.8">R4</tspan></text>
<ellipse cx="478" cy="516" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="478.5" y="523.8">R5</tspan></text>
<rect x="333" y="351" width="30" height="30" rx="0" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="348" y="405.2">LAN1</tspan></text>
<polyline points="83,341 182,242" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="113.5" y="278">10</tspan></text>
<polyline points="83,391 182,490" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="113.5" y="467">10</tspan></text>
<polyline points="208,252 208,480" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="186.5" y="373">15</tspan></text>
<polyline points="239,499 446,384" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="355.5" y="471">30</tspan></text>
<polyline points="478,402 478,480" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="499.5" y="448">10</tspan></text>
<polyline points="233,242 334,350" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="297.5" y="279">10</tspan></text>
<polyline points="233,490 334,382" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="258.5" y="429">10</tspan></text>
<polyline points="369,366 442,366" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413.5" y="350">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="288" y="221.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="478.5" y="319.2">destination</tspan></text>
<rect x="0" y="744" width="533" height="231" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="782.9">TI-LFA for R2 → R4</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="816.15">Post-convergence path with LAN1:R2-R4 and LAN1:R2-R3</tspan><tspan x="18" y="837.4">removed: R2 → R3 → R4 (25).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="866.3">From R2, R3: 10 over the LAN ≠ path 15 ✗</tspan><tspan x="18" y="883.8">  → Adj-SID(R2→R3 over R2-R3)</tspan><tspan x="18" y="901.3">From R3, R4: 10 &lt; 10+10+0 ✓ → Prefix R4</tspan><tspan x="18" y="918.8">Adj-SID dropped: R3 is the first hop</tspan><tspan x="18" y="936.3">[PrefixSID(R4)] = 16004, out on R2–R3</tspan></text>
<rect x="553" y="744" width="533" height="231" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="782.9">In the simulation</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="816.15">The fail-link tool on a spoke fails the member’s</tspan><tspan x="571" y="837.4">whole interface (all its LAN links). Failing one LAN</tspan><tspan x="571" y="858.65">link by id fails only that adjacency.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="888.25">Fail R2’s interface:</tspan><tspan x="571" y="907">LFA and TI-LFA deliver on</tspan><tspan x="571" y="925.75">R2-R3-R4 (25) in one repair</tspan></text>
<rect x="1107" y="744" width="533" height="231" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="782.9">What the plan covers</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="816.15">Every router plans for its own interface failing. If</tspan><tspan x="1125" y="837.4">another member’s interface fails (only its</tspan><tspan x="1125" y="858.65">adjacencies go), that is a different failure: the</tspan><tspan x="1125" y="879.9">plan doesn’t cover it, and the simulation shows what</tspan><tspan x="1125" y="901.15">happens.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="932.2">In node mode (A6) the failure is router E, so S’s</tspan><tspan x="1125" y="952.2">interface stays up.</tspan></text>
<rect x="0" y="995" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1033.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1067.15">A LAN is one interface with several neighbors behind it. LFA Lab models it as point-to-point links through a pseudonode, but when S protects one LAN neighbor, S’s whole</tspan><tspan x="18" y="1088.4">interface counts as failed. So R3 across the same LAN is no backup for R2; R3 over the separate R2–R3 link is.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1141.2">Sources: docs/02-algorithms.md §20  ·  docs/learn/11-advanced-topics.md  ·  examples/10-lan-levels.yaml  ·  checked with computeForSource()</tspan></text>
</svg>
