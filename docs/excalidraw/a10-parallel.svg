<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1291" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A10 · Parallel links (bundles)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§9 of docs/02-algorithms.md  ·  RFC 5286 §3.4–3.6  ·  each link of a bundle has its own id, metric, Adj-SID and backup  ·  code: src/engine/graph.ts</tspan></text>
<rect x="0" y="110" width="600" height="644" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 7: protect S-E for S → E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">S–E is a bundle of 10 and 20; E–D a bundle of two 10s.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="651.2">Red dashed: the failed link S-E (metric 10).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Green arrow: the other link S-E#2 is the best LFA (cost 20).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="711.2">Blue: E-D and E-D#2 are equal, so each is the other’s ECMP</tspan><tspan x="18" y="731.2">backup.</tspan></text>
<rect x="620" y="110" width="1020" height="644" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: a candidate is a (link, neighbor) pair</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">SPF uses the cheapest link of a bundle: dist(S,E) = 10. A link is a primary next-hop link only if it</tspan><tspan x="638" y="203.4">costs dist(S,E), so S-E is primary and S-E#2 is not. Each primary link gets its own protection.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="237.05">S → E, protect S-E: every other link out of S is a candidate (B3–B7)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="268.2">Candidate        Loop-free              Downstream   Node-prot.  Cost</tspan><tspan x="638" y="288.2">---------------  ---------------------  -----------  ----------  ------------</tspan><tspan x="638" y="308.2">A over S-A       20 &lt; 15 + 10 = 25  ✓   20 &lt; 10  ✗   –           15 + 20 = 35</tspan><tspan x="638" y="328.2">E over S-E#2      0 &lt; 10 + 10 = 20  ✓    0 &lt; 10  ✓   never ✗     20 +  0 = 20</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="359.15">Best LFA: E over S-E#2 (both link-only, and it is downstream). It protects the link, not the router.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="393.05">S → D, protect S-E: node protection still wins</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="424.2">A over S-A      10 &lt; 15 + 20 ✓   10 &lt; 20 ✓      10 &lt; 20 + 10 ✓   cost 25  ← best</tspan><tspan x="638" y="444.2">E over S-E#2    loop-free ✓      downstream ✓   never ✗          cost 30</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="477.05">TI-LFA keeps the other link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="509.15">Only the failed link is removed, so S → E over S-E#2 (20) is the post-convergence path (S-A-D-E costs</tspan><tspan x="638" y="530.4">35). The walk forces AdjSID(S→E over S-E#2) = 24002, the clean-up drops it (first hop): [PrefixSID(E)],</tspan><tspan x="638" y="551.65">sent out on S-E#2.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="582.2">Adj-SIDs of S:  A 24000   S-E 24001   S-E#2 24002</tspan><tspan x="638" y="602.2">Adj-SIDs of E:  E-D 24000   E-D#2 24001   S-E 24002   S-E#2 24003</tspan></text>
<ellipse cx="128" cy="276" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="128" y="283.8">S</tspan></text>
<ellipse cx="458" cy="276" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="458" y="283.8">E</tspan></text>
<ellipse cx="128" cy="516" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="128" y="523.8">A</tspan></text>
<ellipse cx="458" cy="516" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="458" y="523.8">D</tspan></text>
<polyline points="161,262 425,262" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="293.5" y="247.15">S-E · 10</tspan></text>
<polyline points="161,290 425,290" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="293" y="315.15">S-E#2 · 20</tspan></text>
<polyline points="444,309 444,483" fill="none" stroke="#1971c2" stroke-width="3" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="394.5" y="401.15">E-D · 10</tspan></text>
<polyline points="472,309 472,483" fill="none" stroke="#1971c2" stroke-width="3" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="528" y="401.15">E-D#2 · 10</tspan></text>
<polyline points="128,312 128,480" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="106.5" y="403">15</tspan></text>
<polyline points="164,516 422,516" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="293.5" y="545">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="128" y="205.15">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="458.5" y="205.15">destination</tspan></text>
<rect x="0" y="774" width="533" height="286" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="812.9">Why it is never node-protecting</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="846.15">For another link L2 to E itself, N = E:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="875.3">loop-free   dist(E,D) &lt; dist(E,S)+dist(S,D)</tspan><tspan x="18" y="892.8">            always ✓ (E is on S’s path)</tspan><tspan x="18" y="910.3">downstream  dist(E,D) &lt; dist(S,D)       ✓</tspan><tspan x="18" y="927.8">node-prot.  dist(E,D) &lt; 0 + dist(E,D)   ✗</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="958.15">So it protects the link only (RFC 5286 §3.6). A</tspan><tspan x="18" y="979.4">node-protecting LFA through another router wins</tspan><tspan x="18" y="1000.65">(B7).</tspan></text>
<rect x="553" y="774" width="533" height="286" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="571" y="812.9">ECMP, Remote LFA, labels</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="846.15">•  Two equal links to E are two primary next hops:</tspan><tspan x="571" y="867.4">   ECMP-protected (E → D here).</tspan><tspan x="571" y="888.65">•  Remote LFA uses the protected link’s own metric.</tspan><tspan x="571" y="909.9">   Another link to E is never a tunnel exit (E would</tspan><tspan x="571" y="931.15">   be an LFA).</tspan><tspan x="571" y="952.4">•  Every link direction has its own Adj-SID, so an</tspan><tspan x="571" y="973.65">   Adj-SID names one link.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1002.3">Ex. 3 with B–C as a bundle 12 / 10:</tspan><tspan x="571" y="1019.8">[16004, 24002, 16002]</tspan><tspan x="571" y="1037.3">= B, AdjSID(B→C over B-C#2), E</tspan></text>
<rect x="1107" y="774" width="533" height="286" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="1125" y="812.9">Failure checks (A9)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="843.3">fail S-E, LFA only:</tspan><tspan x="1125" y="860.8">  E  S→E over S-E#2   20</tspan><tspan x="1125" y="878.3">  D  S→A→D            25</tspan><tspan x="1125" y="895.8">source E, fail E-D:   ECMP E-D#2</tspan><tspan x="1125" y="913.3">fail E-D#2 only:      not affected</tspan><tspan x="1125" y="930.8">fail both:            dropped at E</tspan><tspan x="1125" y="948.3">  then converge E→S→A→D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="978.2">One flow per destination: with two equal links it uses</tspan><tspan x="1125" y="998.2">the lowest id (E-D).</tspan></text>
<rect x="0" y="1080" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1118.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1152.15">A bundle is protected link by link. The other link to the same router is a cheap, always loop-free LFA, but it can never protect against that router failing. Not</tspan><tspan x="18" y="1173.4">modelled: an Adj-SID for the whole bundle, LAG members under one adjacency, hashing over equal links.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1226.2">Sources: docs/02-algorithms.md §9  ·  docs/learn/11-advanced-topics.md (Parallel links)  ·  examples/07-parallel.yaml</tspan></text>
</svg>
