<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1278" width="1700" height="1278">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#e8590c"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1278" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A16 · LFA policy: which LFA does S pick?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§15 of docs/02-algorithms.md  ·  RFC 7916 §6.2 (policy-based alternate selection)  ·  code: src/engine/lfa-policy.ts, lfa.ts</tspan></text>
<rect x="0" y="110" width="600" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">The policy network: S → D, two LFAs</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Blue: S’s normal path S→E→D, dist(S,D) = 11.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">Red dashed: the protected link S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="651.2">Green: LFA B, S→B→D (13): node-protecting, not downstream.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Orange: LFA A, S→A→E→D (12): downstream, not node-protecting</tspan><tspan x="18" y="701.2">(it goes through E).</tspan></text>
<rect x="620" y="110" width="1020" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: three knobs on top of the B7 order</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="179.3">Knob                       YAML                         Values                       RFC 7916</tspan><tspan x="638" y="196.8">-------------------------  ---------------------------  ---------------------------  --------</tspan><tspan x="638" y="214.3">Node-protecting (Ineq. 3)  lfa_policy.node_protecting   prefer · require · ignore    §6.2.2</tspan><tspan x="638" y="231.8">Downstream (Ineq. 2)       lfa_policy.downstream        prefer · require · ignore    §6.2.3</tspan><tspan x="638" y="249.3">Exclude a neighbor         lfa_exclude: [B] on S        router ids                   §6.2.4.4</tspan><tspan x="638" y="266.8"> </tspan><tspan x="638" y="284.3">prefer is the default. The two preferences are per network; the exclude list is per router.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="315.15">•  exclude: S’s links to that neighbor are skipped before any check (reason excluded), like a</tspan><tspan x="638" y="336.4">   max-metric link (B6).</tspan><tspan x="638" y="357.65">•  require: a loop-free neighbor that fails the inequality is shown with its numbers, marked</tspan><tspan x="638" y="378.9">   policyRejected, never chosen.</tspan><tspan x="638" y="400.15">•  ignore: that step of the order is skipped; the rest keep their order.</tspan><tspan x="638" y="421.4">•  prefer: the default order (B7): node-protecting → downstream → lowest cost → router ID → link id.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="455.05">The two candidates for S → D</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="485.25">N  dist(N,D)  Loop-free        Downstream (&lt; 11)  Node-protecting          Cost</tspan><tspan x="638" y="504">-  ---------  ---------------  -----------------  -----------------------  ------------</tspan><tspan x="638" y="522.75">A  2 (A-E-D)  2 &lt; 10+11  ✓     2 &lt; 11  ✓          2 &lt; 1+1  ✗  (via E)      10 + 2 = 12</tspan><tspan x="638" y="541.5">B  11 (B-D)   11 &lt; 2+11  ✓     11 &lt; 11 ✗          11 &lt; 12+1  ✓             2 + 11 = 13</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="571.2">If require leaves no LFA, the destination has no LFA, so Remote LFA is used (B13). Here: PQ node A, the</tspan><tspan x="638" y="591.2">cheapest (dist(S,A) = 10).</tspan></text>
<ellipse cx="68" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="68" y="253.8">A</tspan></text>
<ellipse cx="298" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="253.8">E</tspan></text>
<ellipse cx="528" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="528" y="253.8">D</tspan></text>
<ellipse cx="183" cy="496" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="183" y="503.8">S</tspan></text>
<ellipse cx="528" cy="496" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="528" y="503.8">B</tspan></text>
<polyline points="198,463 283,278" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="217.5" y="367">10</tspan></text>
<polyline points="334,246 492,246" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413" y="230">1</tspan></text>
<polyline points="168,463 83,278" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="148.5" y="367">10</tspan></text>
<polyline points="104,246 262,246" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="183" y="230">1</tspan></text>
<polyline points="219,496 492,496" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="356" y="525">2</tspan></text>
<polyline points="528,460 528,282" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="506.5" y="378">11</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="183" y="553.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="528.5" y="199.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="199.2">primary next hop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="528" y="553.2">default pick</tspan></text>
<rect x="0" y="744" width="900" height="303" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="782.9">Best LFA for S → D under each policy</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="814.25">Policy                                   Best LFA  Why</tspan><tspan x="18" y="833">---------------------------------------  --------  ----------------------------------------</tspan><tspan x="18" y="851.75">default (both prefer)                    B         node-protecting comes first</tspan><tspan x="18" y="870.5">node_protecting: ignore                  A         downstream is next</tspan><tspan x="18" y="889.25">both ignore                              A         lowest cost: 12 &lt; 13</tspan><tspan x="18" y="908">downstream: require                      A         B ruled out: not downstream</tspan><tspan x="18" y="926.75">node_protecting: require                 B         A ruled out: not node-protecting</tspan><tspan x="18" y="945.5">both require                             none      → Remote LFA via PQ node A</tspan><tspan x="18" y="964.25">S lfa_exclude: [B]                       A         B skipped</tspan><tspan x="18" y="983">S lfa_exclude: [A, B]                    none      → Remote LFA</tspan><tspan x="18" y="1001.75">node_protecting: require, S → E (D = E)  A         node protection can’t apply to E itself</tspan></text>
<rect x="920" y="744" width="720" height="303" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="938" y="782.9">What the policy doesn’t change</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="938" y="816.15">•  ECMP (B2): another primary next hop is normal forwarding, not an</tspan><tspan x="938" y="837.4">   alternate. An excluded neighbor still counts as ECMP.</tspan><tspan x="938" y="858.65">•  Remote LFA and TI-LFA: the tunnel exit and the post-convergence path</tspan><tspan x="938" y="879.9">   ignore the policy. Remote LFA is only used more often.</tspan><tspan x="938" y="901.15">•  SRLG, link colour and bandwidth criteria of RFC 7916 aren’t</tspan><tspan x="938" y="922.4">   modelled.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="938" y="956.05">Effect line</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="938" y="986.25">Example 6, node_protecting: require:</tspan><tspan x="938" y="1005">Changes S’s LFA for 2 destinations:</tspan><tspan x="938" y="1023.75">D (N → none), M (E → none).</tspan></text>
<rect x="0" y="1067" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1105.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1139.15">When S has more than one LFA, which one it picks is a policy. The knobs change the order (prefer / ignore), rule candidates out (require) or skip a neighbor (exclude).</tspan><tspan x="18" y="1160.4">The LFA picked is always loop-free; if the policy leaves none, Remote LFA takes over.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1213.2">Sources: docs/02-algorithms.md §15  ·  docs/learn/10-design-checks.md (LFA policy)  ·  examples/06-link-protecting.yaml  ·  checked with computeForSource(), lfaPolicyEffect()</tspan></text>
</svg>
