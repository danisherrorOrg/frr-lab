<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#7048e8"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1174" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B11 · PQ node: in both spaces, and the cheapest one wins</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3 of docs/02-algorithms.md  ·  RFC 7490 §5.2.1, §5.2.2, §5.4  ·  DECISIONS.md D11, D17  ·  code: src/engine/rlfa.ts (computeRlfa → pq, best, exitVia)</tspan></text>
<rect x="0" y="110" width="600" height="612" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 4: link PE1–P1, the PQ node is PE2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Red dashed: the protected link PE1–P1.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">Teal arrows: the tunnel PE1 → P2 → P4 → PE2, sent out through</tspan><tspan x="18" y="641.2">P2 (cost 30). One label: PE2’s Prefix-SID 16012.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Purple arrows: PE2 takes the label off and forwards normally,</tspan><tspan x="18" y="691.2">PE2 → P3 → P1 (20), then on to D.</tspan></text>
<rect x="620" y="110" width="1020" height="612" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: PQ = (extended) P ∩ Q, then lowest cost from S</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="181.2">PQ  =  extended P-space (B9)  ∩  Q-space (B10)</tspan><tspan x="638" y="201.2"> </tspan><tspan x="638" y="221.2">best PQ  =  lowest cost from S:   dist(S,Y)          if Y ∈ P(S)</tspan><tspan x="638" y="241.2">                                   c(S,N) + dist(N,Y) if Y only in P(N)</tspan><tspan x="638" y="261.2">            then lowest router id</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="292.15">•  A PQ node is reached from S without S–E (P) and reaches E without S–E (Q). S tunnels the packet</tspan><tspan x="638" y="313.4">   there; the PQ node forwards it normally.</tspan><tspan x="638" y="334.65">•  The cost is how S gets in: its own path for a plain-P node, or out through the exit neighbor N (B9).</tspan><tspan x="638" y="355.9">•  RFC 7490 §5.2.2 RECOMMENDS lowest cost S → P, then lowest node id (D17 replaced D11’s older rule).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="389.05">Example 4 in full (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="419.25">Extended P(PE1) = {P2, P4} ∪ {PE2 via P2}   (B8, B9)</tspan><tspan x="638" y="438">Q(P1)           = {P3, PE2}                  (B10)</tspan><tspan x="638" y="456.75">PQ              = {PE2}</tspan><tspan x="638" y="475.5">Cost            = c(PE1,P2) + dist(P2,PE2) = 10 + 20 = 30, sent out through P2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="508.05">Choosing when there are several</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="538.25">Example        PQ nodes       Cost from S                     Best</tspan><tspan x="638" y="557">-------------  -------------  ------------------------------  -------------</tspan><tspan x="638" y="575.75">2  ring        {B, C}         B: dist(S,B) = 2                B</tspan><tspan x="638" y="594.5">                              C: via A, 1 + 2 = 3</tspan><tspan x="638" y="613.25">8  S–E         {B, C}         B: via N, 2 + 3 = 5             B  (link mode)</tspan><tspan x="638" y="632">                              C: via N, 2 + 6 = 8</tspan><tspan x="638" y="650.75">4  PE1–P1      {PE2}          PE2: via P2, 10 + 20 = 30       PE2</tspan><tspan x="638" y="669.5">3  ring, B–C   {}             P {A, B} and Q {C} don’t meet   none → TI-LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="699.2">Step 2 (lowest router id) needs two PQ nodes at the same cost. None of the examples has that.</tspan></text>
