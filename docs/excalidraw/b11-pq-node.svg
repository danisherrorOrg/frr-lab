<ellipse cx="208" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="243.8">P1</tspan></text>
<ellipse cx="208" cy="486" rx="30" ry="30" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="493.8">P2</tspan></text>
<ellipse cx="408" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="243.8">P3</tspan></text>
<ellipse cx="408" cy="486" rx="30" ry="30" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="493.8">P4</tspan></text>
<ellipse cx="548" cy="361" rx="30" ry="30" fill="#ffffff" stroke="#2f9e44" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="548.5" y="368.8">PE2</tspan></text>
<polyline points="84,339 182,258" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="115.5" y="284">10</tspan></text>
<polyline points="84,383 182,464" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="115.5" y="451">10</tspan></text>
<polyline points="242,486 374,486" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="515">10</tspan></text>
<polyline points="433,463 522,383" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="495.5" y="450">10</tspan></text>
<polyline points="208,270 208,452" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="186.5" y="368">30</tspan></text>
<polyline points="374,236 242,236" fill="none" stroke="#7048e8" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="220">10</tspan></text>
<polyline points="408,270 408,452" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="429.5" y="368">30</tspan></text>
<polyline points="229,263 387,460" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="325.5" y="319.15">20 / 40</tspan></text>
<polyline points="523,338 434,258" fill="none" stroke="#7048e8" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="495.5" y="285">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="58.5" y="316.2">S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="191.2">E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="541.2">exit neighbor</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="408" y="191.2">Q only</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="408" y="541.2">P only</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="548.5" y="316.2">PQ node</tspan></text>
<rect x="0" y="742" width="533" height="181" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="780.9">One PQ node per link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="814.15">P and Q don’t mention D, so the choice doesn’t</tspan><tspan x="18" y="835.4">either. PE2 serves PE1 → P1 and PE1 → P3 alike.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="866.2">Node protection (B12) is the exception: it is chosen</tspan><tspan x="18" y="886.2">per D.</tspan></text>
<rect x="553" y="742" width="533" height="181" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="780.9">Never a tunnel end</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="814.15">•  A router with the overload bit, even in both</tspan><tspan x="571" y="835.4">   spaces (RFC 7490 §5.4, listed as overloadedPq).</tspan><tspan x="571" y="856.65">•  S and E: never in any space (D17).</tspan><tspan x="571" y="877.9">•  A PQ node reached only through a max-metric or</tspan><tspan x="571" y="899.15">   overloaded neighbor (B6, B9).</tspan></text>
<rect x="1107" y="742" width="533" height="181" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="780.9">Used only without an LFA (B13)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="814.15">PQ nodes are worked out and shown on every row, for</tspan><tspan x="1125" y="835.4">teaching. The tunnel is installed only when there is</tspan><tspan x="1125" y="856.65">no LFA. With no PQ node at all, TI-LFA (A5) still</tspan><tspan x="1125" y="877.9">repairs.</tspan></text>
<rect x="0" y="943" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="981.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1015.15">A PQ node is a router S can reach without the failed link that also reaches E without it. S tunnels to the cheapest one (lowest cost from S, then lowest id), going out</tspan><tspan x="18" y="1036.4">through the exit neighbor if it is only in extended P-space. In Example 4 that is PE2, through P2.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1089.2">Sources: docs/02-algorithms.md §3, §6  ·  docs/learn/05-remote-lfa.md (PQ nodes, Which PQ node?)  ·  examples/04-isp-core.yaml, 02-ring5.yaml, 03-ring5-highmetric.yaml,</tspan><tspan x="0" y="1109.2">08-node-protection.yaml  ·  checked with computeForSource()</tspan></text>
</svg>
