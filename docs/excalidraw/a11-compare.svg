<rect x="-30" y="-30" width="1700" height="1544" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A11 · Compare view: LFA vs Remote LFA vs TI-LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§10 of docs/02-algorithms.md  ·  the three methods for one (S, D, link) side by side; nothing new is decided  ·  code: src/engine/compare.ts</tspan></text>
<rect x="0" y="110" width="600" height="674" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 4: small ISP core, PE1 → P1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="631.2">PE1’s normal path is the direct link (cost 10). P1→P4 costs</tspan><tspan x="18" y="651.2">20, P4→P1 costs 40.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Red dashed: the failed link PE1–P1.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="711.2">Green: TI-LFA, PE1 → P2 → P1 (40), the final path.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="741.2">Orange: Remote LFA, after PE1 → P2: P2 → P4 → PE2 → P3 → P1</tspan><tspan x="18" y="761.2">(50).</tspan></text>
<rect x="620" y="110" width="1020" height="674" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: one card per method, the same five fields</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="181.2">            LFA     Remote LFA                       TI-LFA</tspan><tspan x="638" y="201.2">----------  ------  -------------------------------  ----------------------</tspan><tspan x="638" y="221.2">found/used  none    used: PQ node PE2, exit via P2   found, not used</tspan><tspan x="638" y="241.2">path        –       PE1→P2→P4→PE2→P3→P1              PE1→P2→P1</tspan><tspan x="638" y="261.2">cost        –       10 + 10 + 10 + 10 + 10 = 50      10 + 30 = 40</tspan><tspan x="638" y="281.2">labels      –       16012 16001  (PE2, then P1)      24000 16001</tspan><tspan x="638" y="301.2">vs final    –       longer (final is 40)             same</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="334.05">What each field means</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="366.15">•  found / used: does the method have a backup, and is it the one the results table names (the</tspan><tspan x="638" y="387.4">   simplest, ECMP → LFA → Remote LFA → TI-LFA)?</tspan><tspan x="638" y="408.65">•  path: LFA = S → N, then N’s normal path. Remote LFA = the tunnel to the PQ node, then its normal</tspan><tspan x="638" y="429.9">   path. TI-LFA = the post-convergence path.</tspan><tspan x="638" y="451.15">•  cost: the metrics walked. LFA = c(S,N) + dist(N,D); Remote LFA = cost to the PQ node + dist(PQ,D).</tspan><tspan x="638" y="472.4">•  labels S pushes, top first, before PHP: LFA 0 extra, Remote LFA the PQ node’s Prefix-SID, TI-LFA its</tspan><tspan x="638" y="493.65">   segment list.</tspan><tspan x="638" y="514.9">•  vs final: against S’s path after reconvergence: same, same-cost or longer. Never cheaper.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="548.05">Why Example 4 is the best lesson</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="580.15">Remote LFA’s only PQ node is PE2, so traffic takes the long way (50), then moves again to the 40 path</tspan><tspan x="638" y="601.4">after reconvergence. TI-LFA uses the 40 path at once. A Prefix-SID for P1 sent to P2 would come back:</tspan><tspan x="638" y="622.65">P2’s old path to P1 is P2 → PE1 → P1 (20 &lt; 30), over the failed link. So TI-LFA forces P2 → P1 with</tspan><tspan x="638" y="643.9">P2’s Adj-SID 24000, then P1’s label 16001.</tspan></text>
