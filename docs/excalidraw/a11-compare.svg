<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="538.5" y="393.8">PE2</tspan></text>
<polyline points="94,362 181,281" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
