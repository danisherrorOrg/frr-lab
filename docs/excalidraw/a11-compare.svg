<polyline points="208,480 208,292" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="186.5" y="393">30</tspan></text>
<polyline points="244,516 382,516" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="313.5" y="545">10</tspan></text>
<polyline points="442,490 513,413" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="497.5" y="476">10</tspan></text>
<polyline points="514,360 443,283" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="497.5" y="309">10</tspan></text>
<polyline points="382,256 244,256" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="313.5" y="240">10</tspan></text>
<polyline points="231,284 396,488" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="258.5" y="402">20 / 40</tspan></text>
<polyline points="418,292 418,480" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="439.5" y="393">30</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="68" y="331.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="201.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="538.5" y="449.2">PQ node</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="579.2">Adj-SID 24000 to P1</tspan></text>
<rect x="0" y="804" width="533" height="268" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="842.9">More worked checks</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="873.3">Ex. 1, S→D:  LFA used: N, S-N-D, 25</tspan><tspan x="18" y="890.8">             TI-LFA S-N-D, 25, same</tspan><tspan x="18" y="908.3">Ex. 2, S→E:  no LFA</tspan><tspan x="18" y="925.8">             RLFA used: PQ B, 4, same</tspan><tspan x="18" y="943.3">             TI-LFA 16004 16002, same</tspan><tspan x="18" y="960.8">Ex. 3, S→E:  no LFA, no PQ node</tspan><tspan x="18" y="978.3">             TI-LFA used: 13,</tspan><tspan x="18" y="995.8">             16004 24005 16002, same</tspan></text>
<rect x="553" y="804" width="533" height="268" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="842.9">An LFA can be longer too</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="876.15">S–E 1, E–D 1, S–N 5, N–D 1, S–M 1, M–N 1. For S → D,</tspan><tspan x="571" y="897.4">M and N are both node-protecting LFAs.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="929.15">N is downstream (1 &lt; 2), M is not (2 &lt; 2 fails), so</tspan><tspan x="571" y="950.4">N wins (B7):</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="980.25">LFA     S-N-D     6</tspan><tspan x="571" y="999">final   S-M-N-D   3   → longer</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1029.2">TI-LFA with link protection is always &quot;same&quot; (RFC 9855</tspan><tspan x="571" y="1049.2">§3).</tspan></text>
<rect x="1107" y="804" width="533" height="268" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="842.9">Remote LFA &quot;not run here&quot;</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="876.15">A router runs Remote LFA only when there is no LFA</tspan><tspan x="1125" y="897.4">(B13). The compare view still works out the tunnel</tspan><tspan x="1125" y="918.65">from the same P- and Q-spaces, marked &quot;not run</tspan><tspan x="1125" y="939.9">here&quot;, because seeing both is the point.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="969.25">Ex. 1: PQ = N, S-N-D, 25,</tspan><tspan x="1125" y="988">       16003 16004</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1018.2">With ECMP, none of the three is used.</tspan></text>
<rect x="0" y="1092" width="1640" height="221" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="1130.9">With links or routers down (§10.1): the cards show what the traffic really does</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1164.15">The view runs the failure simulation (A9) once per repair mode and lines up the flow to D. Each card: delivered / dropped / loops, the path, which routers repair, the</tspan><tspan x="18" y="1185.4">cost against normal, the labels, and the repair against the final path.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1215.25">Failure                          LFA only                   LFA + Remote LFA        TI-LFA</tspan><tspan x="18" y="1234">-------------------------------  -------------------------  ----------------------  ----------------------------------------</tspan><tspan x="18" y="1252.75">Ex. 3, S→E, link S–E             dropped at S (no backup)   dropped at S            delivered S-A-B-C-E, 13, 16004 24005 16002</tspan><tspan x="18" y="1271.5">Ex. 6, S→D, router E             delivered S-N-M-D, 21      same as LFA only        loops S→N→S: [Prefix D] via N meets E</tspan><tspan x="18" y="1290.25">Ex. 4, PE1→P3, PE1–P1 + P2–P4    dropped at PE1             delivered, 70 (&gt; 50)    delivered, 100 (&gt; 50): PE1, P2, PE1 repair</tspan></text>
<rect x="0" y="1333" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1371.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1405.15">The compare view lines up what each method would do for the same failure: path, cost, labels and how it compares with the final path. LFA and Remote LFA can take a</tspan><tspan x="18" y="1426.4">detour and move traffic twice; TI-LFA with link protection always uses the final path.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1479.2">Sources: docs/02-algorithms.md §10–10.1  ·  docs/learn/08-comparison.md  ·  examples/04-isp-core.yaml  ·  checked with compareBackups()</tspan></text>
</svg>
