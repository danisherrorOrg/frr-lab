</defs>
<rect x="-30" y="-30" width="1700" height="1261" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A12 · Per-link view: if this link fails, who repairs?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§11 of docs/02-algorithms.md  ·  the results table regrouped by link; nothing new is decided  ·  code: src/engine/link-view.ts</tspan></text>
<rect x="0" y="110" width="600" height="664" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 2: what uses link S–E?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">Every metric is 1. Right-click a link → &quot;What uses this</tspan><tspan x="18" y="641.2">link?&quot;.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Orange: the link being asked about, S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="701.2">Tags above S and E: the destinations each end repairs if S–E</tspan><tspan x="18" y="721.2">fails, and how.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="751.2">Each direction: 2 destinations, 3 flows.</tspan></text>
<rect x="620" y="110" width="1020" height="664" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: two questions for each direction X→Y</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">1. Who repairs, and how?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="216.15">FRR is local repair: whoever sent the packet, X repairs it with its own backup for (D, X–Y). So the</tspan><tspan x="638" y="237.4">destinations are the rows of X’s results table whose primary link is X→Y, and &quot;how&quot; is that row’s</tspan><tspan x="638" y="258.65">simplest method (ECMP → LFA → Remote LFA → TI-LFA).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="292.05">2. Whose traffic crosses it?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="324.15">Router W ≠ D sends traffic to D over X→Y when some shortest path uses it (a tie counts as &quot;uses&quot;, like</tspan><tspan x="638" y="345.4">B1):</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="376.2">dist(W,X) + c(X→Y) + dist(Y,D) = dist(W,D)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="406.2">W = A, D = E, over S→E:   1 + 1 + 0 = 2 = dist(A,E)   ✓   A sends to E over S–E</tspan><tspan x="638" y="426.2">W = B, D = E, over S→E:   2 + 1 + 0 = 3 ≠ 2           ✗   B goes B→C→E</tspan><tspan x="638" y="446.2">W = A, D = C, over S→E:   1 + 1 + 1 = 3 ≠ 2           ✗   A goes A→B→C</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="479.05">Result for link S–E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="510.2">Direction  Destination  Repaired by        Traffic from</tspan><tspan x="638" y="530.2">---------  -----------  -----------------  ------------</tspan><tspan x="638" y="550.2">S→E        C            S: LFA A           S</tspan><tspan x="638" y="570.2">           E            S: Remote LFA, B   A, S</tspan><tspan x="638" y="590.2">E→S        A            E: LFA C           E</tspan><tspan x="638" y="610.2">           S            E: Remote LFA, B   C, E</tspan><tspan x="638" y="630.2"> </tspan><tspan x="638" y="650.2">each way:  1 LFA, 1 Remote LFA, 3 flows (a flow = one (W, D) pair)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="680.2">Every W found in step 2 has a row in step 1: shortest sub-paths are shortest, so X’s own path to D starts on</tspan><tspan x="638" y="700.2">this link. X itself is always listed.</tspan></text>
<ellipse cx="168" cy="296" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="168" y="303.8">S</tspan></text>
<ellipse cx="438" cy="296" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="438" y="303.8">E</tspan></text>
<ellipse cx="508" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="508" y="493.8">C</tspan></text>
<ellipse cx="308" cy="536" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="308" y="543.8">B</tspan></text>
<ellipse cx="98" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="98" y="493.8">A</tspan></text>
<polyline points="204,296 402,296" fill="none" stroke="#e8590c" stroke-width="6" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="303" y="325">1</tspan></text>
<polyline points="450,330 495,452" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="492" y="391">1</tspan></text>
<polyline points="473,495 343,528" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="414" y="540">1</tspan></text>
<polyline points="273,528 133,495" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="198" y="540">1</tspan></text>
<polyline points="110,452 155,330" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="114" y="391">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="199.25">S→E fails, S repairs:</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="222.25">C by LFA A</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="245.25">E by Remote LFA B</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="199.25">E→S fails, E repairs:</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="222.25">A by LFA C</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="245.25">S by Remote LFA B</tspan></text>
<rect x="0" y="794" width="1087" height="236" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="832.9">Example 4, link PE1–P1</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="864.25">Direction  Destination  Repaired by               Traffic from</tspan><tspan x="18" y="883">---------  -----------  ------------------------  -----------------------------------</tspan><tspan x="18" y="901.75">PE1→P1     P1           Remote LFA PE2 via P2     P2, P4, PE1  (P4-P2-PE1-P1 = 30 &lt; 40)</tspan><tspan x="18" y="920.5">           P3           Remote LFA                P2, PE1</tspan><tspan x="18" y="939.25">           PE2          ECMP                      PE1</tspan><tspan x="18" y="958">P1→PE1     P2           LFA P2                    P1, P3</tspan><tspan x="18" y="976.75">           PE1          LFA P2                    P1, P3, PE2  (PE2’s two paths tie at 30)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1007.2">P4 sends to P1 the long way round through PE1, because P4→P1 costs 40 while P4-P2-PE1-P1 costs 10 + 10 + 10 = 30.</tspan></text>
<rect x="1107" y="794" width="533" height="236" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="832.9">A link that carries nothing</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="866.15">A link on no shortest path carries no traffic either</tspan><tspan x="1125" y="887.4">way. It can only ever be a backup.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="919.15">•  Example 7, S-E#2: 20 &gt; 10</tspan><tspan x="1125" y="940.4">•  Example 4, P1–P2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="971.2">The heat map (A13) shows &quot;–&quot; on such a link.</tspan></text>
<rect x="0" y="1050" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1088.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1122.15">The per-link view turns the results table around: for one link, which destinations need a repair, which router repairs them and how, and whose traffic is on it. A</tspan><tspan x="18" y="1143.4">property test checks that the rows match each repairing router’s own rows and the &quot;uses the link&quot; test.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1196.2">Sources: docs/02-algorithms.md §11  ·  docs/learn/10-design-checks.md (Per-link view)  ·  examples/02-ring5.yaml, 04-isp-core.yaml  ·  checked with linkView()</tspan></text>
</svg>
