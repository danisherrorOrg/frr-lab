<rect x="0" y="657" width="1060" height="247" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="695.9">The walk in node mode, check by check (S → D)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="726.3">From  Try      (a) dist = path cost?        (b) dist(X,Y) &lt; dist(X,E) + dist(E,Y)   Result</tspan><tspan x="18" y="743.8">----  -------  ---------------------------  -------------------------------------   ---------------</tspan><tspan x="18" y="761.3">S     D, C, B  ✗  e.g. dist(S,B)=3, path 5                                           –</tspan><tspan x="18" y="778.8">S     N        ✓  2 = 2                     2 &lt; 2 + 4  ✓                             P(N), dropped</tspan><tspan x="18" y="796.3">N     D        ✗  dist(N,D)=6, path 9                                                –</tspan><tspan x="18" y="813.8">N     C        ✓  6 = 6                     6 &lt; 4 + 4  ✓                             P(C)</tspan><tspan x="18" y="831.3">C     D        ✓  3 = 3                     3 &lt; 4 + 2  ✓                             P(D)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="861.2">P = PrefixSID. dist() is the normal (pre-failure) distance: the other routers still use their old tables. P(N)</tspan><tspan x="18" y="881.2">only reaches the first hop, so the clean-up drops it (B16). Result: [P(C), P(D)] = 16005, 16006.</tspan></text>
<rect x="1080" y="657" width="560" height="247" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="1098" y="695.9">Can’t avoid E? Fall back to link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1098" y="729.15">•  D = E. S → E can’t avoid E. The engine installs the</tspan><tspan x="1098" y="750.4">   link repair [P(B), P(E)] = 16004, 16002, marked</tspan><tspan x="1098" y="771.65">   fallback: dest-is-next-hop.</tspan><tspan x="1098" y="792.9">•  E is the only way to D. Example 10 in node mode, R3</tspan><tspan x="1098" y="814.15">   → R5: R5 hangs off R4, so the repair is the link</tspan><tspan x="1098" y="835.4">   one, fallback: none. RFC 9855 has no rule here;</tspan><tspan x="1098" y="856.65">   falling back still covers the link failure (D51).</tspan></text>
<rect x="0" y="924" width="533" height="202" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="18" y="962.9">It can cost more</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="996.15">Node mode also avoids E, so the repair can cost more</tspan><tspan x="18" y="1017.4">than S’s final path after a link failure: 11 instead</tspan><tspan x="18" y="1038.65">of 8 here. In node mode &quot;TI-LFA is always the same</tspan><tspan x="18" y="1059.9">as the final path&quot; no longer holds (§8, §10).</tspan></text>
<rect x="553" y="924" width="533" height="202" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="962.9">Coverage (A8)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="996.15">Example 8, every router as source: 33 pairs, 19 with</tspan><tspan x="571" y="1017.4">D ≠ E. Against E failing, TI-LFA protects all 19 and</tspan><tspan x="571" y="1038.65">Remote LFA 16. From S alone: 3 pairs (B, C, D via</tspan><tspan x="571" y="1059.9">E), 3 and 3.</tspan></text>
<rect x="1107" y="924" width="533" height="202" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="962.9">Related</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="996.15">•  Same idea for LFA (B5) and Remote LFA (B12): the</tspan><tspan x="1125" y="1017.4">   backup must avoid router E.</tspan><tspan x="1125" y="1038.65">•  Router failure simulation (A9) shows what really</tspan><tspan x="1125" y="1059.9">   happens when E dies.</tspan><tspan x="1125" y="1081.15">•  With SRLGs the engine falls back one step at a</tspan><tspan x="1125" y="1102.4">   time (A19).</tspan></text>
<rect x="0" y="1146" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1184.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1218.15">Node mode plans for the whole next-hop router failing: remove router E, then run the same walk with the check dist(X,Y) &lt; dist(X,E) + dist(E,Y). In Example 8 the link</tspan><tspan x="18" y="1239.4">repair 16004, 16006 goes through E; the node repair 16005, 16006 goes around it, at cost 11 instead of 8.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1292.2">Sources: docs/02-algorithms.md §4.4, §5, §16  ·  docs/learn/07-ti-lfa.md (Node protection)  ·  DECISIONS.md D51  ·  examples/08-node-protection.yaml, 10-lan-levels.yaml</tspan></text>
</svg>
