<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1357" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B19 · TI-LFA node mode: plan for router E failing, not just the link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4.4 of docs/02-algorithms.md  ·  RFC 9855 §2.1 (node protection), Appendix A  ·  DECISIONS.md D51  ·  code: src/engine/tilfa.ts</tspan></text>
<rect x="0" y="110" width="520" height="527" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Link mode: only S–E fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="492.15">Remove link S–E. Post-convergence path S → N → B →</tspan><tspan x="18" y="513.4">E → D, cost 2 + 3 + 1 + 2 = 8.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="544.2">[PrefixSID(B), PrefixSID(D)]</tspan><tspan x="18" y="564.2">= 16004, 16006   out via N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="594.2">The repair still goes through E. If router E dies,</tspan><tspan x="18" y="614.2">this repair dies with it.</tspan></text>
<rect x="540" y="110" width="520" height="527" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="558" y="148.9">Node mode: router E fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="558" y="492.15">Remove router E and all 4 of its links. Path S → N</tspan><tspan x="558" y="513.4">→ B → C → D, cost 2 + 3 + 3 + 3 = 11.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="558" y="544.2">[PrefixSID(C), PrefixSID(D)]</tspan><tspan x="558" y="564.2">= 16005, 16006   out via N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="558" y="594.2">E is on no segment, so the repair survives E failing.</tspan></text>
<rect x="1080" y="110" width="560" height="527" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="1098" y="148.9">The rule: remove the router, not the link</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1098" y="180.25">link mode   remove link S–E</tspan><tspan x="1098" y="199">  (b): dist(X,Y) &lt; dist(X,S) + c(S,E) + dist(E,Y)</tspan><tspan x="1098" y="217.75"> </tspan><tspan x="1098" y="236.5">node mode   remove router E (all its links)</tspan><tspan x="1098" y="255.25">  (b): dist(X,Y) &lt; dist(X,E) + dist(E,Y)</tspan><tspan x="1098" y="274">       (dist through E is ∞ if E is overloaded)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1098" y="305.15">•  Turned on by protection: node in the file (one</tspan><tspan x="1098" y="326.4">   setting for the whole network, like Remote LFA in</tspan><tspan x="1098" y="347.65">   A4).</tspan><tspan x="1098" y="368.9">•  The rest of the walk is the same: furthest valid</tspan><tspan x="1098" y="390.15">   Prefix-SID, else an Adj-SID (B15), clean-up (B16),</tspan><tspan x="1098" y="411.4">   end with PrefixSID(D) (B17).</tspan><tspan x="1098" y="432.65">•  E is not on the path, so it never ends a segment and</tspan><tspan x="1098" y="453.9">   no Adj-SID names one of its links. (b) for E also</tspan><tspan x="1098" y="475.15">   rules out the link S–E.</tspan></text>
