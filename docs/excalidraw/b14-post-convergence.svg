<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1201" width="1700" height="1201">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1201" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B14 · Post-convergence path: where S will send after the failure</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4.1 of docs/02-algorithms.md  ·  RFC 9855 §3 (SPT_new(S, S–E)), §2.1  ·  code: src/engine/tilfa.ts, paths.ts (lowest-id tie-break)</tspan></text>
<rect x="0" y="110" width="600" height="612" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 5: SP1 → L1, link SP1–L1 removed</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="551.2">Leaf-spine, every link 10.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="581.2">Red dashed: the failed link SP1–L1, removed both ways.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="611.2">Green: the post-convergence path SP1 → L2 → SP2 → L1 (30),</tspan><tspan x="18" y="631.2">picked by the lowest router id.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="661.2">Orange: two more paths of the same cost, via L3 and via L4.</tspan><tspan x="18" y="681.2">They lose the tie.</tspan></text>
<rect x="620" y="110" width="1020" height="612" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: SPF from S without S–E, ties to the lowest router ids</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="180.25">post-convergence path  =  shortest path S → D  in the graph without S–E (both ways)</tspan><tspan x="638" y="199">tie  →  compare the paths router by router from S; the lowest id at the first difference wins</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="230.15">•  It is the cheapest path that avoids the failure, and the one S will use once the network has</tspan><tspan x="638" y="251.4">   reconverged. So traffic moves once, not twice (RFC 9855 §3).</tspan><tspan x="638" y="272.65">•  TI-LFA then forces the packet along it with segments (B15). The repair costs exactly the</tspan><tspan x="638" y="293.9">   post-convergence cost.</tspan><tspan x="638" y="315.15">•  The tie-break is ours: the RFC only asks for the post-convergence path. A fixed rule gives the same</tspan><tspan x="638" y="336.4">   answer every run (project rule 1), and the drawings, Explain and the simulation (A9) all use it.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="370.05">Example 5, the tie (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="400.25">Path                    Cost   Router by router      Result</tspan><tspan x="638" y="419">----------------------  -----  --------------------  -------------------</tspan><tspan x="638" y="437.75">SP1 → L2 → SP2 → L1     30     SP1, L2, …            chosen: L2 &lt; L3 &lt; L4</tspan><tspan x="638" y="456.5">SP1 → L3 → SP2 → L1     30     SP1, L3, …            loses at hop 2</tspan><tspan x="638" y="475.25">SP1 → L4 → SP2 → L1     30     SP1, L4, …            loses at hop 2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="505.2">Segments for the chosen path: [PrefixSID(SP2), PrefixSID(L1)] = 16002, 16011, out via L2.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="538.05">Other examples</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="568.25">Example         S → D       Removed       Post-convergence path            Cost</tspan><tspan x="638" y="587">--------------  ----------  ------------  -------------------------------  ----</tspan><tspan x="638" y="605.75">2  ring         S → E       link S–E      S → A → B → C → E                4</tspan><tspan x="638" y="624.5">3  ring, B–C    S → E       link S–E      S → A → B → C → E                13</tspan><tspan x="638" y="643.25">4  ISP core     PE1 → P3    link PE1–P1   PE1 → P2 → P4 → PE2 → P3         40</tspan><tspan x="638" y="662">8  link mode    S → D       link S–E      S → N → B → E → D                8</tspan><tspan x="638" y="680.75">8  node mode    S → D       router E      S → N → B → C → D                11</tspan><tspan x="638" y="699.5">10 LAN, levels  R4 → R5     link R4–R5    none: R5 can’t be reached        –</tspan></text>
<ellipse cx="168" cy="236" rx="34" ry="34" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="243.8">SP1</tspan></text>
<ellipse cx="438" cy="236" rx="34" ry="34" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="243.8">SP2</tspan></text>
<ellipse cx="68" cy="456" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="68.5" y="463.8">L1</tspan></text>
<ellipse cx="218" cy="456" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="218.5" y="463.8">L2</tspan></text>
<ellipse cx="378" cy="456" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="378.5" y="463.8">L3</tspan></text>
<ellipse cx="528" cy="456" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="528.5" y="463.8">L4</tspan></text>
<polyline points="152,271 83,424" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<polyline points="176,273 210,421" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="243,431 411,263" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="405,255 99,437" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="194,263 353,429" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<polyline points="387,421 428,272" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<polyline points="200,256 497,437" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<polyline points="514,423 452,271" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="168" y="187.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="438" y="187.2">every path via SP2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="68.5" y="513.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="218.5" y="513.2">lowest id</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="453" y="513.2">tied, not chosen</tspan></text>
<rect x="0" y="742" width="533" height="208" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="780.9">Node mode: remove the router</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="814.15">With protection: node (A6, B19) the SPF runs without</tspan><tspan x="18" y="835.4">router E and all its links (RFC 9855 §2.1,</tspan><tspan x="18" y="856.65">SPT_new(S, E)).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="887.2">Example 8: link mode goes S → N → B → E → D (8),</tspan><tspan x="18" y="907.2">through E. Node mode goes S → N → B → C → D (11).</tspan></text>
<rect x="553" y="742" width="533" height="208" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="780.9">When there is none</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="814.15">If D can’t be reached without S–E, the link is a</tspan><tspan x="571" y="835.4">bridge for D: the network is split and nothing can</tspan><tspan x="571" y="856.65">protect it.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="887.2">Example 10: R5 hangs off R4 alone. R4 → R5 and R5 →</tspan><tspan x="571" y="907.2">every other router are &quot;partitioned&quot; in the unprotected</tspan><tspan x="571" y="927.2">list (A8).</tspan></text>
<rect x="1107" y="742" width="533" height="208" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="780.9">The best backup there is</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="814.15">It is the cheapest: no path without S–E costs less.</tspan><tspan x="1125" y="835.4">LFA and Remote LFA may take a longer detour (A9</tspan><tspan x="1125" y="856.65">marks those &quot;longer&quot;). With one link down, a TI-LFA</tspan><tspan x="1125" y="877.9">repair is always the same path as S’s final one</tspan><tspan x="1125" y="899.15">(link mode).</tspan></text>
<rect x="0" y="970" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1008.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1042.15">TI-LFA’s backup is the path S will use anyway once the network has reconverged: SPF with the failed link (or router) removed. When paths tie, the lowest router ids win,</tspan><tspan x="18" y="1063.4">so in Example 5 SP1 goes via L2, not L3 or L4. If no such path exists, the network is split and D can’t be protected.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1116.2">Sources: docs/02-algorithms.md §4.1, §4.4, §6, §8  ·  docs/learn/07-ti-lfa.md (Step 1)  ·  examples/05-leaf-spine.yaml, 02-ring5.yaml, 03-ring5-highmetric.yaml, 04-isp-core.yaml,</tspan><tspan x="0" y="1136.2">08-node-protection.yaml, 10-lan-levels.yaml</tspan></text>
</svg>
