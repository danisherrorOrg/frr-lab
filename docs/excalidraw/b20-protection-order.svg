<rect x="-30" y="-30" width="1700" height="1438" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B20 · Protection order: credit each pair to the simplest method</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§5 of docs/02-algorithms.md  ·  RFC 5286, RFC 7490, RFC 9855  ·  DECISIONS.md D19, D31  ·  code: src/engine/rows.ts (protectedBy), coverage.ts</tspan></text>
<rect x="0" y="110" width="600" height="488" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 4, source PE1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="491.2">Router colour = the method each destination is credited to:</tspan><tspan x="18" y="511.2">teal ECMP, green LFA, orange Remote LFA. The diagonal P1–P4</tspan><tspan x="18" y="531.2">costs 20 from P1 and 40 back.</tspan></text>
<rect x="620" y="110" width="1020" height="488" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: try the methods in order, stop at the first that works</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="344.25">Dest  Via  ECMP  LFA   Remote LFA      TI-LFA labels   Credited to</tspan><tspan x="638" y="363">----  ---  ----  ----  --------------  --------------  -----------</tspan><tspan x="638" y="381.75">PE2   P1   yes   P2    not run         16004 16012     ECMP</tspan><tspan x="638" y="400.5">PE2   P2   yes   P1    not run         16003 16012     ECMP</tspan><tspan x="638" y="419.25">P4    P2   no    P1    not run         16004           LFA</tspan><tspan x="638" y="438">P1    P1   no    none  PQ PE2 via P2   24000 16001     Remote LFA</tspan><tspan x="638" y="456.75">P2    P2   no    none  PQ P4 via P1    24000 16002     Remote LFA</tspan><tspan x="638" y="475.5">P3    P1   no    none  PQ PE2 via P2   16004 16003     Remote LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="505.2">Every row also has a TI-LFA repair, and the ECMP rows also have an LFA. Each row still counts once, under the</tspan><tspan x="638" y="525.2">first method that works. &quot;Not run&quot;: Remote LFA is only tried when there is no LFA (B13).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="555.2">Example 3 adds the fourth step: from S, all 4 destinations have no LFA and no PQ node, so all 4 go to TI-LFA</tspan><tspan x="638" y="575.2">(S → C: 16004, 24005, 16005).</tspan></text>
<ellipse cx="58" cy="316" rx="34" ry="34" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="58.5" y="323.8">PE1</tspan></text>
<ellipse cx="208" cy="216" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="223.8">P1</tspan></text>
<ellipse cx="208" cy="416" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="423.8">P2</tspan></text>
<ellipse cx="408" cy="216" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="223.8">P3</tspan></text>
<ellipse cx="408" cy="416" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="423.8">P4</tspan></text>
<ellipse cx="548" cy="316" rx="34" ry="34" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="548.5" y="323.8">PE2</tspan></text>
<polyline points="90,295 178,236" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="118.5" y="250">10</tspan></text>
<polyline points="90,337 178,396" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="118.5" y="395">10</tspan></text>
<polyline points="208,252 208,380" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="229.5" y="283">30</tspan></text>
<polyline points="244,216 372,216" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="200">10</tspan></text>
<polyline points="244,416 372,416" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="445">10</tspan></text>
<polyline points="408,252 408,380" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="386.5" y="283">30</tspan></text>
<polyline points="233,241 382,390" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="280.5" y="349.2">20 / 40</tspan></text>
<polyline points="437,237 517,294" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="493.5" y="251">10</tspan></text>
<polyline points="437,395 517,338" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="493.5" y="394">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="58" y="373.2">source</tspan></text>
<rect x="638" y="166" width="168" height="120" rx="16" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="650" y="193.1">1. ECMP</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="650" y="219.3">Another primary</tspan><tspan x="650" y="236.8">next hop avoids</tspan><tspan x="650" y="254.3">the link (B2)</tspan></text>
<rect x="842" y="166" width="168" height="120" rx="16" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="854" y="193.1">2. LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="854" y="219.3">A best LFA exists</tspan><tspan x="854" y="236.8">(B3–B7)</tspan></text>
<polyline points="810,226 838,226" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="1046" y="166" width="168" height="120" rx="16" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="1058" y="193.1">3. Remote LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1058" y="219.3">No LFA, and a PQ</tspan><tspan x="1058" y="236.8">node exists (B11,</tspan><tspan x="1058" y="254.3">B13)</tspan></text>
<polyline points="1014,226 1042,226" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="1250" y="166" width="168" height="120" rx="16" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="1262" y="193.1">4. TI-LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1262" y="219.3">A repair exists</tspan><tspan x="1262" y="236.8">and fits the MSD</tspan><tspan x="1262" y="254.3">(B14–B17)</tspan></text>
<polyline points="1218,226 1246,226" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="1454" y="166" width="168" height="120" rx="16" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="1466" y="193.1">5. Unprotected</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1466" y="219.3">Nothing works: a</tspan><tspan x="1466" y="236.8">bridge, or too</tspan><tspan x="1466" y="254.3">deep</tspan></text>
<polyline points="1422,226 1450,226" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="308.25">Each arrow means &quot;no: try the next one&quot;. The first &quot;yes&quot; gets the pair.</tspan></text>
<rect x="0" y="618" width="900" height="368" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="656.9">Every example, every router as source (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="688.25">Example              Pairs  ECMP  LFA  Remote LFA  TI-LFA  None</tspan><tspan x="18" y="707">-------------------  -----  ----  ---  ----------  ------  ----</tspan><tspan x="18" y="725.75"> 1  square              12     0    8           4       0     0</tspan><tspan x="18" y="744.5"> 2  ring                20     0   10          10       0     0</tspan><tspan x="18" y="763.25"> 3  ring, B–C = 10      20     0    8           0      12     0</tspan><tspan x="18" y="782"> 4  ISP core            35    10   17           8       0     0</tspan><tspan x="18" y="800.75"> 5  leaf-spine          48    32    0          16       0     0</tspan><tspan x="18" y="819.5"> 6  link-protecting     22     4   14           4       0     0</tspan><tspan x="18" y="838.25"> 7  parallel            16     8    7           1       0     0</tspan><tspan x="18" y="857"> 8  node protection     33     6   18           9       0     0</tspan><tspan x="18" y="875.75"> 9  SRLG                32     4   16          12       0     0</tspan><tspan x="18" y="894.5">10  LAN + levels        23     4   14           0       0     5</tspan><tspan x="18" y="913.25">11  Flex-Algo           24     8   10           5       1     0</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="943.2">Each row adds up to its pairs. The coverage numbers (A8) are running totals of these columns:</tspan><tspan x="18" y="963.2">LFA coverage = (ECMP + LFA) / pairs, so Example 4 has 27 / 35.</tspan></text>
<rect x="920" y="618" width="720" height="368" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="938" y="656.9">Why simplest first</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="938" y="690.15">•  ECMP: nothing to add. The router already has a second path and just</tspan><tspan x="938" y="711.4">   stops using the failed one.</tspan><tspan x="938" y="732.65">•  LFA: one more next hop in the table. No tunnel, no labels.</tspan><tspan x="938" y="753.9">•  Remote LFA: a tunnel to the PQ node.</tspan><tspan x="938" y="775.15">•  TI-LFA: a label stack built from the post-convergence path.</tspan><tspan x="938" y="796.4"> </tspan><tspan x="938" y="817.65">Crediting each pair once to the simplest working method shows how much</tspan><tspan x="938" y="838.9">protection each extra feature really buys. In Example 4, Remote LFA</tspan><tspan x="938" y="860.15">closes the last 8 of 35 pairs; TI-LFA adds nothing new.</tspan></text>
<rect x="0" y="1006" width="533" height="181" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="1044.9">Too deep counts as nothing</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1078.15">A TI-LFA repair with more labels than S’s Max SID</tspan><tspan x="18" y="1099.4">depth is not installed, so it protects nothing and</tspan><tspan x="18" y="1120.65">the pair falls through to &quot;unprotected&quot; (A15, D44).</tspan></text>
<rect x="553" y="1006" width="533" height="181" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="1044.9">&quot;None&quot; means partitioned</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1078.15">Example 10: R5 has one link, to R4. Its 4 pairs from</tspan><tspan x="571" y="1099.4">R5 and the pair R4 → R5 all use that link, and no</tspan><tspan x="571" y="1120.65">method can go round it: 5 pairs, nothing protects</tspan><tspan x="571" y="1141.9">them.</tspan></text>
<rect x="1107" y="1006" width="533" height="181" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1044.9">Where you see it</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1078.15">•  Results table: the Status column.</tspan><tspan x="1125" y="1099.4">•  Coverage numbers and the unprotected list (A8).</tspan><tspan x="1125" y="1120.65">•  CSV export: the protected_by column.</tspan><tspan x="1125" y="1141.9">•  Compare view (A11) shows all methods side by</tspan><tspan x="1125" y="1163.15">   side.</tspan></text>
<rect x="0" y="1207" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1245.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1279.15">Many pairs are protected by more than one method. LFA Lab credits each one once, to the simplest that works: ECMP, then LFA, then Remote LFA, then TI-LFA. From PE1 in</tspan><tspan x="18" y="1300.4">Example 4: 2 ECMP, 1 LFA, 3 Remote LFA, though every row also has a TI-LFA repair.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1353.2">Sources: docs/02-algorithms.md §5, §14  ·  docs/learn/08-comparison.md  ·  DECISIONS.md D19, D31, D44  ·  examples/04-isp-core.yaml, 03-ring5-highmetric.yaml, 10-lan-levels.yaml (and</tspan><tspan x="0" y="1373.2">all of examples/ for the totals)</tspan></text>
</svg>
