<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1265" width="1700" height="1265">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1265" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B6 · Excluded neighbors: never an LFA over a max-metric link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§2 of docs/02-algorithms.md  ·  RFC 5286 §3.5 (MUST NOT), RFC 7490 §5.4  ·  DECISIONS.md D16, D17  ·  code: src/engine/lfa.ts (MAX_METRIC, computeLfa → skipped)</tspan></text>
<rect x="0" y="110" width="600" height="634" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 1, with S–N set to 16,777,215</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">The square, but the operator has set link S–N to the maximum</tspan><tspan x="18" y="611.2">metric (both ways): &quot;don’t send traffic here&quot;.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Red dashed: the failed link S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Orange: the max-metric link. N would pass Inequality 1, but it</tspan><tspan x="18" y="691.2">is skipped before any check.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="721.2">Blue: the primary path S → E → D (20).</tspan></text>
<rect x="620" y="110" width="1020" height="634" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: skip N if the link either way has the max metric</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="183.1">skip N   ⇔   c(S,N) = 16,777,215   or   c(N,S) = 16,777,215</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.15">•  16,777,215 (2²⁴ − 1) is the highest IS-IS wide metric. Operators set it to drain a link, e.g. before</tspan><tspan x="638" y="236.4">   maintenance.</tspan><tspan x="638" y="257.65">•  RFC 5286 §3.5: S MUST NOT consider such an N as an alternate, even if it passes every inequality.</tspan><tspan x="638" y="278.9">•  Checked in both directions: either one means the operator doesn’t want traffic on that link.</tspan><tspan x="638" y="300.15">•  The skip happens first, so N is not a candidate at all. Explain says: Via N: skipped, link S–N has</tspan><tspan x="638" y="321.4">   the maximum metric 16777215.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="355.05">Worked checks (from the engine, S → D, link S–E fails)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="384.3">S–N metric           LFA                           Remote LFA                 TI-LFA</tspan><tspan x="638" y="401.8">-------------------  ----------------------------  -------------------------  -------------------------</tspan><tspan x="638" y="419.3">15 (Example 1)       N  (10 &lt; 15 + 20 = 35  ✓)     not needed                 [PrefixSID(D)], cost 25</tspan><tspan x="638" y="436.8">max both ways        none: N skipped               none: no PQ node           [PrefixSID(D)] out via N,</tspan><tspan x="638" y="454.3">                     (would pass: 10 &lt; 30 + 20)    (N: 30 &lt; 10 + 20 = 30 ✗)   cost 16,777,225</tspan><tspan x="638" y="471.8">max N→S only         none: N skipped               PQ N, cost 15              [PrefixSID(D)], cost 25</tspan><tspan x="638" y="489.3">                     (would pass: 10 &lt; 30 + 20)    (N: 15 &lt; 10 + 20 = 30 ✓)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="638" y="519.2">Max both ways: dist(S,N) and dist(N,S) become 30 (round via E and D), so N leaves P-space too. TI-LFA still</tspan><tspan x="638" y="539.2">repairs over S–N, because SPF still uses max-metric links. RFC 5305 §3.7 says it shouldn’t: this is logged as</tspan><tspan x="638" y="559.2">an open item in DECISIONS.md D16.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="589.2">Max N→S only: S still reaches N for 15, so plain P-space holds N and the Remote LFA tunnel goes out over S→N.</tspan><tspan x="638" y="609.2">RFC 7490 §5.4 only bars N as an extended-P-space exit (D17).</tspan></text>
<ellipse cx="138" cy="256" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="138" y="263.8">S</tspan></text>
<ellipse cx="458" cy="256" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="458" y="263.8">E</tspan></text>
<ellipse cx="138" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="138" y="493.8">N</tspan></text>
<ellipse cx="458" cy="486" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="458" y="493.8">D</tspan></text>
<polyline points="174,256 422,256" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="240">10</tspan></text>
<polyline points="458,292 458,450" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="479.5" y="378">10</tspan></text>
<polyline points="138,292 138,450" fill="none" stroke="#e8590c" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="198.5" y="377.1">16,777,215</tspan></text>
<polyline points="174,486 422,486" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="515">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="138" y="207.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="458" y="207.2">primary next hop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="138.5" y="543.2">skipped: max metric</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="458.5" y="543.2">destination</tspan></text>
<rect x="0" y="764" width="533" height="250" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="802.9">Other neighbors skipped first</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="836.15">computeLfa() skips a link out of S before any check</tspan><tspan x="18" y="857.4">for four reasons, each shown in Explain:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="886.3">max-metric  this rule (RFC 5286 §3.5)</tspan><tspan x="18" y="903.8">overload    N has the overload bit</tspan><tspan x="18" y="921.3">            (§3.5, A17)</tspan><tspan x="18" y="938.8">excluded    lfa_exclude: [N] on S</tspan><tspan x="18" y="956.3">            (RFC 7916 §6.2.4.4, A16)</tspan><tspan x="18" y="973.8">same-lan    S–N is on the same LAN as</tspan><tspan x="18" y="991.3">            S–E (§3.6, A21)</tspan></text>
<rect x="553" y="764" width="533" height="250" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="802.9">Without it</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="836.15">The operator drains S–N to work on it, a link fails,</tspan><tspan x="571" y="857.4">and the LFA puts traffic straight onto S–N anyway.</tspan><tspan x="571" y="878.65">The repair lands on the one link that was meant to</tspan><tspan x="571" y="899.9">be empty.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="930.2">A metric of 16,777,214 is just a very high cost: N is</tspan><tspan x="571" y="950.2">then checked like any other neighbor.</tspan></text>
<rect x="1107" y="764" width="533" height="250" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="802.9">What it doesn’t change</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="836.15">•  ECMP (B2): an excluded neighbor that is a normal</tspan><tspan x="1125" y="857.4">   next hop still counts. That is normal forwarding,</tspan><tspan x="1125" y="878.65">   not an alternate.</tspan><tspan x="1125" y="899.9">•  Remote LFA: only the extended-P-space exits are</tspan><tspan x="1125" y="921.15">   skipped (D17).</tspan><tspan x="1125" y="942.4">•  TI-LFA: the post-convergence path is plain SPF</tspan><tspan x="1125" y="963.65">   without S–E.</tspan></text>
<rect x="0" y="1034" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1072.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1106.15">A link with the maximum metric 16,777,215, in either direction, means &quot;keep traffic off&quot;. So the neighbor behind it is never used as an LFA, even when it passes every</tspan><tspan x="18" y="1127.4">inequality. The same skip happens for an overloaded neighbor, one the LFA policy excludes, and one on the same LAN.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1180.2">Sources: docs/02-algorithms.md §2, §3, §15  ·  docs/learn/04-lfa.md (Some details)  ·  examples/01-square.yaml with S–N = 16777215  ·  tests/engine/lfa.test.ts (max metric)  · </tspan><tspan x="0" y="1200.2">checked with computeForSource()</tspan></text>
</svg>
