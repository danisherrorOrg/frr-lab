<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#e8590c"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1272" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A23 · Microloops: while the routers update one by one</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§22 of docs/02-algorithms.md  ·  RFC 5715 §1, RFC 8333 (local convergence delay)  ·  code: src/engine/microloop.ts</tspan></text>
<rect x="0" y="110" width="600" height="664" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 2, S–E fails, traffic to E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">All metrics 1. Red dashed: the failed link S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="651.2">Blue: old next hops (normal tables). Green: new next hops (SPF</tspan><tspan x="18" y="671.2">without S–E).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="701.2">Orange: the loop A → S → A, if S updates before A.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="731.2">B and C keep their next hops (B → C, C → E); only S and A</tspan><tspan x="18" y="751.2">change.</tspan></text>
<rect x="620" y="110" width="1020" height="664" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: mix old and new next hops, look for a cycle</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">After FRR, every router runs SPF and updates its table on its own time. Old next hops = the normal</tspan><tspan x="638" y="203.4">tables; new = the SPF without what is down (both with the lowest-id tie-break).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="235.15">•  Each router R ≠ D is on its old next hop (waiting) or its new one (updated).</tspan><tspan x="638" y="256.4">•  A PLR (its old next hop is over the failure) has only its new one: until it updates, its FRR repair</tspan><tspan x="638" y="277.65">   carries the traffic past the others’ tables.</tspan><tspan x="638" y="298.9">•  Old ones alone never loop, nor new ones alone (both are SPF). So every loop needs some routers</tspan><tspan x="638" y="320.15">   updated and some waiting.</tspan><tspan x="638" y="341.4">•  Found breadth-first from each router whose next hop changes, so loops are short. A loop found twice</tspan><tspan x="638" y="362.65">   is listed once, starting at its lowest id.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="396.05">Example 2, to E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="426.25">Router  Old next hop        New next hop</tspan><tspan x="638" y="445">------  ------------------  --------------------</tspan><tspan x="638" y="463.75">S       E (over S–E: PLR)   A   S-A-B-C-E = 4</tspan><tspan x="638" y="482.5">A       S   A-S-E = 2 &lt; 3   B   A-B-C-E = 3</tspan><tspan x="638" y="501.25">B       C   B-C-E = 2       C</tspan><tspan x="638" y="520">C       E                   E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="638" y="550.2">S updated (→ A), A waiting (→ S):  A → S → A</tspan><tspan x="638" y="570.2">S is a PLR among the updated: plrEarly = yes</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="600.2">UI, failure panel: &quot;To E: A → S → A, if S updates before A&quot;. Example 2 has 6 changed next hops in all.</tspan></text>
<ellipse cx="88" cy="336" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="88" y="343.8">S</tspan></text>
<ellipse cx="288" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="288" y="243.8">E</tspan></text>
<ellipse cx="498" cy="336" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="498" y="343.8">C</tspan></text>
<ellipse cx="408" cy="546" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="408" y="553.8">B</tspan></text>
<ellipse cx="168" cy="546" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="168" y="553.8">A</tspan></text>
<polyline points="120,320 256,252" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="199" y="314">1</tspan></text>
<polyline points="465,321 320,252" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="422,513 484,369" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="204,546 372,546" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<polyline points="101,370 155,513" fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round" marker-end="url(#ah2)" marker-start="url(#ah2)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="288.5" y="189.25">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="488.5" y="289.25">C → E, unchanged</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="512.5" y="581.25">B → C, unchanged</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="288" y="576.25">A new → B</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="58" y="426.25">S new → A</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="58" y="449.25">A old → S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="92" y="289.25">PLR</tspan></text>
<rect x="0" y="794" width="533" height="247" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="832.9">Local convergence delay</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="866.15">RFC 8333: after a link goes down, the PLR stays on</tspan><tspan x="18" y="887.4">its FRR repair for a while, so the others update</tspan><tspan x="18" y="908.65">first. That avoids every loop that needs a PLR to</tspan><tspan x="18" y="929.9">update early (plrEarly).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="958.3">Ex. 2, S–E   to E: A → S → A   PLR S  avoided</tspan><tspan x="18" y="975.8">             to S: C → E → C   PLR E  avoided</tspan><tspan x="18" y="993.3">Ex. 1, S–E   to S: D → E → D   PLR E  avoided</tspan></text>
<rect x="553" y="794" width="533" height="247" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="832.9">A loop away from the PLR</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="866.15">S–E 1, E–D 1, S–A 1, A–D 5. E–D fails, so E is the</tspan><tspan x="571" y="887.4">PLR. To D:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="916.3">A → S → A  S updated, A waiting</tspan><tspan x="571" y="933.8">           (A old: A-S-E-D 3 &lt; 5)</tspan><tspan x="571" y="951.3">           no PLR in it: not avoided</tspan><tspan x="571" y="968.8">E → S → E  E updated early: avoided</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="998.2">The §22 table lists only the first loop; the engine</tspan><tspan x="571" y="1018.2">finds both.</tspan></text>
<rect x="1107" y="794" width="533" height="247" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="832.9">What it doesn’t do</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="866.15">It lists the loops some update order can make; it</tspan><tspan x="1125" y="887.4">doesn’t time the updates or pick an order. Loops</tspan><tspan x="1125" y="908.65">away from a PLR need ordered FIB updates (RFC 6976),</tspan><tspan x="1125" y="929.9">which aren’t modelled.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="960.2">A property test: every loop is a closed cycle of</tspan><tspan x="1125" y="980.2">neighbors that never passes D and has a router that</tspan><tspan x="1125" y="1000.2">updated.</tspan></text>
<rect x="0" y="1061" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1099.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1133.15">A microloop is two or more routers sending traffic back and forth because some have updated their tables and some haven’t. In Example 2, if S updates before A, traffic</tspan><tspan x="18" y="1154.4">to E goes A → S → A. Keeping the PLR on its repair (local delay) avoids it; a loop that doesn’t involve the PLR needs another fix.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1207.2">Sources: docs/02-algorithms.md §22  ·  docs/learn/03-when-a-link-fails.md, 11-advanced-topics.md  ·  examples/02-ring5.yaml, 01-square.yaml  ·  checked with microloops()</tspan></text>
</svg>
