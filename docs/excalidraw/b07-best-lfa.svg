<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1305" width="1700" height="1305">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1305" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B7 · Best LFA: which loop-free neighbor wins</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§2 of docs/02-algorithms.md  ·  RFC 5286 §1, §3.6 (criteria; the order is our policy, DECISIONS.md D7, D16)  ·  code: src/engine/lfa.ts (betterLfa, chooseBestLfa)</tspan></text>
<rect x="0" y="110" width="600" height="710" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">The order: first difference wins</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="707.2">Compare two candidates step by step. The first step where they</tspan><tspan x="18" y="727.2">differ decides; later steps only break ties.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="757.2">Safety first (survives router E, no microloops), then cost,</tspan><tspan x="18" y="777.2">then a fixed id order so every run gives the same answer</tspan><tspan x="18" y="797.2">(project rule 1).</tspan></text>
<rect x="620" y="110" width="1020" height="710" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">Each step decides a real case (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="179.3">Step  Example     PLR → D (primary)  Candidates  (NP = node-prot., DS = downstream)   Best</tspan><tspan x="638" y="196.8">----  ----------  -----------------  ------------------------------------------------  ----</tspan><tspan x="638" y="214.3">1     §15 policy  S → D   (via E)    A: DS, cost 12      B: NP, cost 13                B</tspan><tspan x="638" y="231.8">1     6           N → D   (via E)    S: –, cost 3        M: NP, cost 20                M</tspan><tspan x="638" y="249.3">2     4 ISP core  P4 → PE1 (via P2)  P1: NP DS, cost 50  P3: NP, cost 50               P1</tspan><tspan x="638" y="266.8">3     §15, both   S → D   (via E)    A: cost 12          B: cost 13                    A</tspan><tspan x="638" y="284.3">      ignore</tspan><tspan x="638" y="301.8">3     11          D → S   (via E)    A: NP DS, cost 40   B: NP DS, cost 30             B</tspan><tspan x="638" y="319.3">4     5 leaf-     SP1 → SP2          L2, L3, L4: NP DS, cost 20 each                   L2</tspan><tspan x="638" y="336.8">      spine       (fail L1–SP1)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="369.05">The numbers behind each row</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="398.3">§15   A: 10 + dist(A,D) 2 = 12, but A → E → D: 2 &lt; 1 + 1 ✗ not NP.  B: 2 + 11 = 13, 11 &lt; 12 + 1 ✓ NP</tspan><tspan x="638" y="415.8">6     S: 1 + 2 = 3, S → E → D: 2 &lt; 1 + 1 ✗.  M: 10 + 10 = 20, 10 &lt; 11 + 1 ✓</tspan><tspan x="638" y="433.3">4     P1: c(P4,P1) 40 + 10 = 50, 10 &lt; 20 ✓ DS.  P3: 30 + 20 = 50, 20 &lt; 20 ✗</tspan><tspan x="638" y="450.8">11    A: 30 + 10 = 40.  B: 15 + 15 = 30   (IGP metric, not the Flex-Algo delay)</tspan><tspan x="638" y="468.3">5     each: 10 + 10 = 20, all NP and DS: the lowest id L2 wins</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="498.2">Step 5 needs two equal links to the same neighbor, equal on every other step. None of the examples reaches</tspan><tspan x="638" y="518.2">it; Example 7’s bundle S–E has metrics 10 and 20, so step 3 decides there.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="548.2">Leaf-spine, SP1 → SP2 is also ECMP-protected (B2): the table credits ECMP, the simpler method (B20).</tspan></text>
<rect x="18" y="168" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="300.5" y="190.25">Candidates: loop-free (B3), not skipped (B6),</tspan><tspan x="300.5" y="209">not ruled out by a policy &quot;require&quot; (A16)</tspan></text>
<rect x="18" y="244" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="300" y="276.15">1  node-protecting before link-only (B5)</tspan></text>
<rect x="18" y="320" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="300" y="352.15">2  downstream before not downstream (B4)</tspan></text>
<rect x="18" y="396" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="300.5" y="428.15">3  lowest backup cost  c(S,N) + dist(N,D)</tspan></text>
<rect x="18" y="472" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="300" y="504.15">4  lowest router id</tspan></text>
<rect x="18" y="548" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="300.5" y="580.15">5  lowest link id (parallel links only, A10)</tspan></text>
<rect x="18" y="624" width="564" height="54" rx="13.5" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="300" y="656.15">Best LFA: installed as the backup next hop</tspan></text>
<polyline points="300,224 300,242" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="300,300 300,318" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="300,376 300,394" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="300,452 300,470" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="300,528 300,546" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<polyline points="300,604 300,622" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="0" y="840" width="533" height="214" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="878.9">Why this order</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="912.15">RFC 5286 §1: a router SHOULD pick a node-protecting</tspan><tspan x="18" y="933.4">LFA over a link-only one. §3.6 adds downstream.</tspan><tspan x="18" y="954.65">After that the RFC leaves it to &quot;distance, IP</tspan><tspan x="18" y="975.9">addresses, or any router-local tie-breaker&quot;, so</tspan><tspan x="18" y="997.15">lowest cost then lowest id is our choice (D7, D16).</tspan></text>
<rect x="553" y="840" width="533" height="214" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="878.9">LFA policy changes steps 1 and 2 (A16)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="909.3">§15 example, S → D        Best</tspan><tspan x="571" y="926.8">-----------------------   -----------</tspan><tspan x="571" y="944.3">default                   B</tspan><tspan x="571" y="961.8">node_protecting: ignore   A  (step 2)</tspan><tspan x="571" y="979.3">both ignore               A  (step 3)</tspan><tspan x="571" y="996.8">downstream: require       A</tspan><tspan x="571" y="1014.3">node_protecting: require  B</tspan><tspan x="571" y="1031.8">both require              none → RLFA</tspan></text>
<rect x="1107" y="840" width="533" height="214" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="878.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="912.15">•  SRLG mode (A19): &quot;SRLG-disjoint first&quot; goes in</tspan><tspan x="1125" y="933.4">   front of step 1 (RFC 7916 §6.2.4.1).</tspan><tspan x="1125" y="954.65">•  Only loop-free candidates are ranked: a cheaper</tspan><tspan x="1125" y="975.9">   one that fails B3 is never picked.</tspan><tspan x="1125" y="997.15">•  Router id order is plain text order of the ids</tspan><tspan x="1125" y="1018.4">   (&quot;L2&quot; &lt; &quot;L3&quot;).</tspan></text>
<rect x="0" y="1074" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1112.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1146.15">When several neighbors are loop-free, pick the safest first: one that survives router E failing, then one that is closer to D. Only then the cheapest, and finally the</tspan><tspan x="18" y="1167.4">lowest id, so the answer is always the same. A cheaper backup can lose to a safer one (§15: B at 13 beats A at 12).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1220.2">Sources: docs/02-algorithms.md §2, §15 (worked example)  ·  docs/learn/04-lfa.md (Choosing the best LFA)  ·  examples/04-isp-core.yaml, 05-leaf-spine.yaml, 06-link-protecting.yaml,</tspan><tspan x="0" y="1240.2">07-parallel.yaml, 11-flex-algo.yaml  ·  checked with computeLfa()</tspan></text>
</svg>
