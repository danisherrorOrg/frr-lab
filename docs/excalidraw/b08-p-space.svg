<rect x="-30" y="-30" width="1700" height="1264" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B8 · P-space: where S can send without the failed link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3 of docs/02-algorithms.md  ·  RFC 7490 §5.2.1.1  ·  DECISIONS.md D17  ·  code: src/engine/rlfa.ts (computeRlfa → pSpace)</tspan></text>
<rect x="0" y="110" width="600" height="681" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 4: the ISP core, PE1 protects link</tspan><tspan x="18" y="176.4">PE1–P1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="618.2">Red dashed: the protected link PE1–P1 (S = PE1, E = P1, c =</tspan><tspan x="18" y="638.2">10).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="668.2">Green: P(PE1) = {P2, P4}. PE1’s shortest paths to them start</tspan><tspan x="18" y="688.2">with PE1–P2.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="718.2">Gray: P3 and PE2 tie. PE1’s shortest path to each goes over</tspan><tspan x="18" y="738.2">PE1–P1, so they are out.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="768.2">Diagonal P1–P4: 20 from P1 to P4, 40 back.</tspan></text>
<rect x="620" y="110" width="1020" height="681" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: S’s own shortest path to Y doesn’t start with S–E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="183.1">Y ∈ P(S)   ⇔   dist(S,Y)  &lt;  c(S,E) + dist(E,Y)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.15">•  The right side is the cheapest path from S to Y that starts with the link S–E.</tspan><tspan x="638" y="236.4">•  Strictly cheaper ⇒ no shortest path from S to Y uses S–E. It is B1 with X = S.</tspan><tspan x="638" y="257.65">•  A tie means one of S’s shortest paths to Y is the one over S–E: Y is out.</tspan><tspan x="638" y="278.9">•  After S–E fails, S can still reach every Y in P(S) on its normal table: no tunnel is needed to get</tspan><tspan x="638" y="300.15">   there.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="334.05">Worked checks, Example 4 (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="364.25">Y     dist(PE1,Y)   c(PE1,P1) + dist(P1,Y)   In P(PE1)?</tspan><tspan x="638" y="383">----  -----------   ----------------------   ------------------------------</tspan><tspan x="638" y="401.75">P2    10            10 + 20 = 30             ✓ 10 &lt; 30</tspan><tspan x="638" y="420.5">P3    20            10 + 10 = 20             ✗ tie: PE1 → P1 → P3 is the path</tspan><tspan x="638" y="439.25">P4    20            10 + 20 = 30             ✓ 20 &lt; 30   (P1 → P4 is 20)</tspan><tspan x="638" y="458">PE2   30            10 + 20 = 30             ✗ tie: PE1 → P1 → P3 → PE2 is one</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="638" y="488.2">P(PE1) for link PE1–P1 = {P2, P4}</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="521.05">Other examples</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="551.25">Example        Link   P(S)     Out on a tie</tspan><tspan x="638" y="570">-------------  -----  -------  ------------------------------------</tspan><tspan x="638" y="588.75">2  ring        S–E    {A, B}   C: 2 = 1 + 1</tspan><tspan x="638" y="607.5">3  ring, B–C   S–E    {A, B}   C: 2 = 1 + 1</tspan><tspan x="638" y="626.25">8              S–E    {N}      B: 3 = 2 + 1,  C: 6 = 2 + 4,  D: 4 = 2 + 2</tspan></text>
