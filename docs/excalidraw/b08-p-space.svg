<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="270.8">P1</tspan></text>
<ellipse cx="208" cy="513" rx="30" ry="30" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="520.8">P2</tspan></text>
<ellipse cx="408" cy="263" rx="30" ry="30" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="270.8">P3</tspan></text>
<ellipse cx="408" cy="513" rx="30" ry="30" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="520.8">P4</tspan></text>
<ellipse cx="548" cy="388" rx="30" ry="30" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="548.5" y="395.8">PE2</tspan></text>
<polyline points="84,366 182,285" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="115.5" y="311">10</tspan></text>
<polyline points="84,410 182,491" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="115.5" y="478">10</tspan></text>
<polyline points="242,513 374,513" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="542">10</tspan></text>
<polyline points="208,297 208,479" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="186.5" y="395">30</tspan></text>
<polyline points="242,263 374,263" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="247">10</tspan></text>
<polyline points="408,297 408,479" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="429.5" y="395">30</tspan></text>
<polyline points="229,290 387,487" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="325.5" y="346.15">20 / 40</tspan></text>
<polyline points="433,286 522,366" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="495.5" y="312">10</tspan></text>
<polyline points="433,490 522,410" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="495.5" y="477">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="58.5" y="343.2">S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="218.2">E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="568.2">P ✓</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="568.2">P ✓</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="408" y="218.2">tie: out</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="548" y="343.2">tie: out</tspan></text>
<rect x="0" y="811" width="533" height="202" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="849.9">One P-space per link, not per D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="883.15">The test never mentions D. S works out P-space once</tspan><tspan x="18" y="904.4">for each protected link and uses it for every</tspan><tspan x="18" y="925.65">destination behind E (RFC 7490 §5.2.1.3).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="956.2">In Example 4, PE1 → P1 and PE1 → P3 both lose PE1–P1</tspan><tspan x="18" y="976.2">and share P(PE1) = {P2, P4}.</tspan></text>
<rect x="553" y="811" width="533" height="202" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="849.9">Plain P-space is often too small</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="883.15">Q(P1) = {P3, PE2} (B10). Plain P ∩ Q = {P2, P4} ∩</tspan><tspan x="571" y="904.4">{P3, PE2} = {}: no PQ node.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="936.15">Extended P-space (B9) adds PE2 through neighbor P2,</tspan><tspan x="571" y="957.4">and Remote LFA works. Example 8 is the same: P(S) =</tspan><tspan x="571" y="978.65">{N}, and N is not in Q.</tspan></text>
<rect x="1107" y="811" width="533" height="202" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="849.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="883.15">•  S and E are never listed: S can’t pass the test,</tspan><tspan x="1125" y="904.4">   E is always a tie (D17).</tspan><tspan x="1125" y="925.65">•  Forward distances from S (forward SPF, A1).</tspan><tspan x="1125" y="946.9">   Metrics can differ per direction.</tspan><tspan x="1125" y="968.15">•  Parallel links (A10): c(S,E) is the metric of the</tspan><tspan x="1125" y="989.4">   protected link, not the bundle.</tspan></text>
<rect x="0" y="1033" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1071.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1105.15">P-space is every router S already reaches without the failed link: dist(S,Y) &lt; c(S,E) + dist(E,Y). A tie means the link is on a shortest path, so the router is out. It</tspan><tspan x="18" y="1126.4">is the &quot;S side&quot; of Remote LFA; the &quot;E side&quot; is Q-space (B10), and a router in both is a PQ node (B11).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1179.2">Sources: docs/02-algorithms.md §3, §6  ·  docs/learn/05-remote-lfa.md (P-space)  ·  examples/04-isp-core.yaml, 02-ring5.yaml, 03-ring5-highmetric.yaml, 08-node-protection.yaml  · </tspan><tspan x="0" y="1199.2">checked with computeForSource()</tspan></text>
</svg>
