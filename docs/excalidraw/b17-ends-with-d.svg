<rect x="-30" y="-30" width="1700" height="1269" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B17 · The list ends with PrefixSID(D): the packet’s own label</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4.2, §4.3 of docs/02-algorithms.md  ·  RFC 9855 §7.1  ·  RFC 8660 (SR over MPLS)  ·  code: src/engine/tilfa.ts, labels.ts</tspan></text>
<rect x="0" y="110" width="600" height="686" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 3: S → C, link S–E fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="673.2">Ring, every link 1 except B–C = 10.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="703.2">Green: the post-convergence path S → A → B → C (12). The walk</tspan><tspan x="18" y="723.2">gives PrefixSID(B), then AdjSID(B→C) to force the costly link.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="18" y="753.2">Purple: the walk ends on an Adj-SID, so C’s own Prefix-SID is</tspan><tspan x="18" y="773.2">added under it.</tspan></text>
<rect x="620" y="110" width="1020" height="686" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: D’s label stays at the bottom, the repair goes on top</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="181.2">last segment is PrefixSID(D)   →  nothing to add</tspan><tspan x="638" y="201.2">last segment is AdjSID(X→D)    →  add PrefixSID(D) after it</tspan><tspan x="638" y="221.2">list empty after clean-up      →  the list is just [PrefixSID(D)]</tspan><tspan x="638" y="241.2"> </tspan><tspan x="638" y="261.2">extra labels  =  segments − 1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="292.15">•  Before the failure the packet already carries D’s label (SRGB 16000 + D’s SID index). The repair</tspan><tspan x="638" y="313.4">   list is pushed on top of it (RFC 9855 §7.1), so D’s label is always the last one.</tspan><tspan x="638" y="334.65">•  An Adj-SID only moves the packet over one link. After it, the packet still needs D’s label, or the</tspan><tspan x="638" y="355.9">   far end wouldn’t know where it goes.</tspan><tspan x="638" y="377.15">•  &quot;Extra labels&quot; counts only the repair list: the segments minus D’s own label.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="411.05">All three endings in the examples (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="440.3">Example        Row        Walk (after clean-up)       Added   Labels (top first)       Extra</tspan><tspan x="638" y="457.8">-------------  ---------  --------------------------  ------  -----------------------  -----</tspan><tspan x="638" y="475.3">2  ring        S → E      [P(B), P(E)]                –       16004, 16002             1</tspan><tspan x="638" y="492.8">5  leaf-spine  SP1 → L1   [P(SP2), P(L1)]             –       16002, 16011             1</tspan><tspan x="638" y="510.3">3  ring, B–C   S → C      [P(B), Adj(B→C)]            P(C)    16004, 24005, 16005      2</tspan><tspan x="638" y="527.8">4  ISP core    PE1 → P1   [Adj(P2→P1)]                P(P1)   24000, 16001             1</tspan><tspan x="638" y="545.3">4  ISP core    PE2 → P3   [Adj(P4→P3)]                P(P3)   24002, 16003             1</tspan><tspan x="638" y="562.8">7  parallel    S → E      [ ]                         P(E)    16002                    0</tspan><tspan x="638" y="580.3">1  square      S → D      [P(D)]                      –       16004                    0</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="610.2">P = PrefixSID, Adj = AdjSID. Labels are shown top first, before penultimate-hop popping (§4.3).</tspan></text>
<ellipse cx="148" cy="216" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="148" y="223.8">S</tspan></text>
<ellipse cx="448" cy="216" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="448" y="223.8">E</tspan></text>
<ellipse cx="518" cy="396" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518" y="403.8">C</tspan></text>
<ellipse cx="298" cy="426" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="433.8">B</tspan></text>
<ellipse cx="78" cy="396" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="78" y="403.8">A</tspan></text>
<polyline points="184,216 412,216" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298" y="200">1</tspan></text>
<polyline points="461,250 505,363" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="502" y="305">1</tspan></text>
<polyline points="135,250 91,363" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="132" y="320">1</tspan></text>
<polyline points="114,401 263,421" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="191" y="395">1</tspan></text>
<polyline points="334,421 483,401" fill="none" stroke="#7048e8" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="404.5" y="394">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="148" y="175.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518.5" y="451.2">destination</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="308" y="311.25">PrefixSID(B), then AdjSID(B→C)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="485.2">Label stack S pushes (top first):</tspan></text>
<rect x="18" y="500" width="300" height="40" rx="0" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="168" y="525.2">16004   PrefixSID(B)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="332" y="523.25">repair list</tspan></text>
<rect x="18" y="546" width="300" height="40" rx="0" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="571.2">24005   AdjSID(B→C)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="332" y="569.25">repair list</tspan></text>
<rect x="18" y="592" width="300" height="40" rx="0" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="168" y="617.2">16005   PrefixSID(C)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="332" y="615.25">destination’s own label (added)</tspan></text>
<rect x="0" y="816" width="533" height="202" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="854.9">It counts towards MSD (A15)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="888.15">S must push the whole stack, D’s label included.</tspan><tspan x="18" y="909.4">Example 3, S → E is 16004, 24005, 16002: 3 labels.</tspan><tspan x="18" y="930.65">With msd: 2 the repair is &quot;too deep&quot; and counts as</tspan><tspan x="18" y="951.9">unprotected.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="982.2">On SRv6 (A25) the same repair is 2 SIDs and fits.</tspan></text>
<rect x="553" y="816" width="533" height="202" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="854.9">Why Example 1 shows 0 extra labels</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="888.15">After the clean-up (B16) only PrefixSID(D) is left:</tspan><tspan x="571" y="909.4">the packet keeps its own label 16004 and is just</tspan><tspan x="571" y="930.65">sent out to N. Nothing extra is pushed: the same as</tspan><tspan x="571" y="951.9">the LFA.</tspan></text>
<rect x="1107" y="816" width="533" height="202" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="854.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="888.15">•  Node mode (B19): the same rule. Example 8 ends</tspan><tspan x="1125" y="909.4">   [P(C), P(D)] = 16005, 16006.</tspan><tspan x="1125" y="930.65">•  With PHP on, the last router before D pops D’s</tspan><tspan x="1125" y="951.9">   label (packet walk, A7). The stack is shown</tspan><tspan x="1125" y="973.15">   before that.</tspan><tspan x="1125" y="994.4">•  Label values: B18.</tspan></text>
<rect x="0" y="1038" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1076.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1110.15">The repair list goes on top of the label the packet already carries, so the list always ends with PrefixSID(D). If the walk ends with an Adj-SID into D, D’s label is</tspan><tspan x="18" y="1131.4">added after it. Only the labels above it count as extra: Example 3, S → C has 3 labels, 2 of them extra.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1184.2">Sources: docs/02-algorithms.md §4.2, §4.3, §6 (Example 3)  ·  docs/learn/07-ti-lfa.md (clean-up rules, Max SID depth)  ·  examples/03-ring5-highmetric.yaml, 02-ring5.yaml,</tspan><tspan x="0" y="1204.2">04-isp-core.yaml, 05-leaf-spine.yaml, 07-parallel.yaml</tspan></text>
</svg>
