<rect x="-30" y="-30" width="1700" height="1208" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B9 · Extended P-space: send out through a neighbor first</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3 of docs/02-algorithms.md  ·  RFC 7490 §5.2.1.2, §5.3, §5.4  ·  DECISIONS.md D5, D17  ·  code: src/engine/rlfa.ts (computeRlfa → extPSpace, exitVia)</tspan></text>
<rect x="0" y="110" width="600" height="619" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 8: link S–E, S’s other neighbor is N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="571.2">Red dashed: the protected link S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="601.2">Green: plain P(S) = {N}. Every other router is a tie (B8).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="631.2">Teal arrows: N’s own shortest paths N → B → C. N doesn’t go</tspan><tspan x="18" y="651.2">back through S, so B and C join: extended P-space = {N, B, C}.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Gray: D. N’s path to D ties with going through S.</tspan></text>
<rect x="620" y="110" width="1020" height="619" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: Y is in P(N) if N’s path to Y doesn’t come back through S</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">Y ∈ P(N)   ⇔   dist(N,Y)  &lt;  dist(N,S) + dist(S,Y)</tspan><tspan x="638" y="203.4"> </tspan><tspan x="638" y="224.65">extended P-space  =  P(S)  ∪  P(N) for every other neighbor N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="256.15">•  S hands the packet to neighbor N (the tunnel goes out through N). N forwards on its normal table, so</tspan><tspan x="638" y="277.4">   the path from N on is N’s shortest path to Y.</tspan><tspan x="638" y="298.65">•  This is Inequality 1 (B3) with Y in place of D: N won’t send it back to S, and so never over S–E.</tspan><tspan x="638" y="319.9">•  S stores the exit neighbor with each extra node: the tunnel must leave through N, because S’s own</tspan><tspan x="638" y="341.15">   path to Y may use S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="375.05">Worked checks, Example 8 (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="405.25">Y    P(S): dist(S,Y) &lt; c(S,E) + dist(E,Y)   P(N): dist(N,Y) &lt; dist(N,S) + dist(S,Y)</tspan><tspan x="638" y="424">---  -----------------------------------   ---------------------------------------</tspan><tspan x="638" y="442.75">N    2 &lt; 2 + 4 = 6   ✓                       (N itself)</tspan><tspan x="638" y="461.5">B    3 &lt; 2 + 1 = 3   ✗ tie                   3 &lt; 2 + 3 = 5   ✓  exit via N</tspan><tspan x="638" y="480.25">C    6 &lt; 2 + 4 = 6   ✗ tie                   6 &lt; 2 + 6 = 8   ✓  exit via N</tspan><tspan x="638" y="499">D    4 &lt; 2 + 2 = 4   ✗ tie                   6 &lt; 2 + 4 = 6   ✗</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="532.05">What it changes in each example</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="562.25">Example        Plain P(S)   Extended adds        PQ plain   PQ extended</tspan><tspan x="638" y="581">-------------  -----------  -------------------  ---------  -----------</tspan><tspan x="638" y="599.75">2  ring        {A, B}       C via A (2 &lt; 3)      {B}        {B, C}</tspan><tspan x="638" y="618.5">3  ring, B–C   {A, B}       nothing (3 = 3)      {}         {}</tspan><tspan x="638" y="637.25">4  PE1–P1      {P2, P4}     PE2 via P2 (20&lt;40)   {}         {PE2}</tspan><tspan x="638" y="656">8  S–E         {N}          B, C via N           {}         {B, C}</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="686.2">In Examples 4 and 8, Remote LFA only works with extended P-space. In the ring the choice stays B either way</tspan><tspan x="638" y="706.2">(B11).</tspan></text>
