<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="308" y="243.8">B</tspan></text>
<ellipse cx="528" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="528" y="243.8">C</tspan></text>
<ellipse cx="78" cy="476" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="78" y="483.8">S</tspan></text>
<ellipse cx="308" cy="476" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="308" y="483.8">E</tspan></text>
<ellipse cx="528" cy="476" rx="30" ry="30" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="528" y="483.8">D</tspan></text>
<polyline points="112,476 274,476" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="193" y="505">2</tspan></text>
<polyline points="78,442 78,270" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="94" y="363">2</tspan></text>
<polyline points="112,236 274,236" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="193" y="220">3</tspan></text>
<polyline points="342,236 494,236" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="418" y="220">3</tspan></text>
<polyline points="308,442 308,270" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="324" y="363">1</tspan></text>
<polyline points="342,476 494,476" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="418" y="505">2</tspan></text>
<polyline points="528,270 528,442" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="544" y="363">3</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="78" y="191.2">P(S)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="191.2">via N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="528.5" y="191.2">via N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="78" y="531.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="531.2">E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="528" y="531.2">not in P</tspan></text>
<rect x="0" y="749" width="533" height="208" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="787.9">Which neighbor is the exit</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="821.15">If Y is in the P-space of several neighbors, use the</tspan><tspan x="18" y="842.4">cheapest way in: lowest c(S,N) + dist(N,Y), then</tspan><tspan x="18" y="863.65">lowest router id.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="894.2">Example 8: B via N costs 2 + 3 = 5, C via N costs 2 + 6</tspan><tspan x="18" y="914.2">= 8. Example 4: PE2 via P2 costs 10 + 20 = 30. These</tspan><tspan x="18" y="934.2">costs pick the PQ node (B11).</tspan></text>
<rect x="553" y="749" width="533" height="208" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="787.9">Two formulas in the RFC</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="821.15">RFC 7490 §5.2.1.2 (prose): dist(N,Y) &lt; dist(N,S) +</tspan><tspan x="571" y="842.4">c(S,E) + dist(E,Y). The §5.3 pseudocode uses</tspan><tspan x="571" y="863.65">Inequality 1, as here.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="894.2">D17: once P(S) is added, both give the same set. A node</tspan><tspan x="571" y="914.2">passing only the prose test is a tie in Inequality 1,</tspan><tspan x="571" y="934.2">and then it is already in P(S).</tspan></text>
<rect x="1107" y="749" width="533" height="208" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="787.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="821.15">•  Exits skipped (B6, A17): a neighbor whose link</tspan><tspan x="1125" y="842.4">   has the max metric, or with the overload bit.</tspan><tspan x="1125" y="863.65">•  On by default (D5). The sidebar box &quot;Extended</tspan><tspan x="1125" y="884.9">   P-space (RLFA)&quot; switches to plain P-space.</tspan><tspan x="1125" y="906.15">•  Only used to find PQ nodes. LFA itself never</tspan><tspan x="1125" y="927.4">   tunnels.</tspan></text>
<rect x="0" y="977" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1015.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1049.15">S can tunnel out through any other neighbor N, and N then forwards normally. So every router N reaches without coming back through S is safe too: dist(N,Y) &lt; dist(N,S)</tspan><tspan x="18" y="1070.4">+ dist(S,Y). That bigger set often holds the PQ node that plain P-space misses (Examples 4 and 8).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1123.2">Sources: docs/02-algorithms.md §3, §6  ·  docs/learn/05-remote-lfa.md (Extended P-space)  ·  examples/08-node-protection.yaml, 02-ring5.yaml, 03-ring5-highmetric.yaml,</tspan><tspan x="0" y="1143.2">04-isp-core.yaml  ·  checked with computeForSource()</tspan></text>
</svg>
