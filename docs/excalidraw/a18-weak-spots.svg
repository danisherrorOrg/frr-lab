<polyline points="121,323 254,270" fill="none" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="199" y="328.15">12/12</tspan></text>
<polyline points="322,269 465,323" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="383.5" y="325.15">4/8</tspan></text>
<polyline points="483,369 423,503" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="404" y="419.15">0/0  (10)</tspan></text>
<polyline points="372,536 204,536" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="288.5" y="562.15">4/8</tspan></text>
<polyline points="155,503 102,370" fill="none" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="162" y="427.15">12/12</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="88.5" y="287.15">8/8</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="288.5" y="207.15">3/6</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="498.5" y="287.15">0/0</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="595.15">0/0</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="595.15">3/6</tspan></text>
<rect x="0" y="814" width="533" height="234" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="852.9">Example 6: router E loops</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="885.2">TI-LFA mode, weakest first:</tspan><tspan x="18" y="905.2">router E   2 of 4 flows loop</tspan><tspan x="18" y="925.2">every link 0 unprotected</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="956.15">S and N both use link-protecting TI-LFA through E.</tspan><tspan x="18" y="977.4">With router E down, the repairs bounce between S and</tspan><tspan x="18" y="998.65">N (A9).</tspan></text>
<rect x="553" y="814" width="533" height="234" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="852.9">And the other way round</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="885.2">Example 6, LFA only:</tspan><tspan x="571" y="905.2">link E–D   5 of 8 dropped</tspan><tspan x="571" y="925.2">router E   0 of 4  (N’s LFA M)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="955.2">Example 1, N overloaded, TI-LFA:</tspan><tspan x="571" y="975.2">link E–D   5 of 6 lost</tspan><tspan x="571" y="995.2">           (4 unreachable, 1 dropped)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1025.2">E–D cuts N off from E and S: no path is left.</tspan></text>
<rect x="1107" y="814" width="533" height="234" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="852.9">Not the heat map</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="886.15">The heat map (A13) counts the pairs each router</tspan><tspan x="1125" y="907.4">plans for its own links. Weakest spots fails links</tspan><tspan x="1125" y="928.65">and whole routers, follows every source’s traffic</tspan><tspan x="1125" y="949.9">across the failure and counts what really happens to</tspan><tspan x="1125" y="971.15">it.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1002.2">A test checks each count against simulateAllSources()</tspan><tspan x="1125" y="1022.2">for that one failure.</tspan></text>
<rect x="0" y="1068" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1106.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1140.15">Weakest spots ranks every single link and router failure by how much traffic it loses. In Example 3 with LFA only, losing A–S or S–E drops all 12 flows that use it.</tspan><tspan x="18" y="1161.4">Because it fails routers too, it finds problems the coverage numbers can’t show, like router E in Example 6.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1214.2">Sources: docs/02-algorithms.md §17  ·  docs/learn/10-design-checks.md (Weakest spots)  ·  examples/03, 06, 01  ·  checked with weakSpots()</tspan></text>
</svg>
