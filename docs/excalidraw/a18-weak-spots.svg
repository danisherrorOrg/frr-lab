<rect x="-30" y="-30" width="1700" height="1279" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A18 · Weakest spots: which single failure hurts most?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§17 of docs/02-algorithms.md  ·  each link and router failed on its own; counts from the simulation (A9)  ·  code: src/engine/weak-spots.ts</tspan></text>
<rect x="0" y="110" width="600" height="684" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 3, LFA only: lost flows per failure</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="631.2">All metrics 1, except C–B = 10. 20 flows: 5 sources × 4</tspan><tspan x="18" y="651.2">destinations.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Each link and router: lost / affected flows when it alone</tspan><tspan x="18" y="701.2">fails. Red: every affected flow is lost. Orange: some are.</tspan><tspan x="18" y="721.2">Gray: none.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="751.2">Router counts leave out flows to and from the router itself</tspan><tspan x="18" y="771.2">(no backup can save them).</tspan></text>
<rect x="620" y="110" width="1020" height="684" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: one failure at a time, every router as the source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">A flow = (source W, destination D), D reachable from W. For each link or router X:</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="214.15">•  affected: flows whose normal path (lowest-id ties) crosses X</tspan><tspan x="638" y="235.4">•  then, as in the simulation: repaired, dropped, looped, or unreachable (no path is left at all)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="266.2">unprotected = dropped + looped + unreachable</tspan><tspan x="638" y="286.2">sort: unprotected ↓, affected ↓, links before routers, id</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="319.05">Example 3, LFA only (the same in LFA + Remote LFA: no PQ nodes)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="349.25">Rank  Failure    Affected  Repaired  Dropped  Unprotected</tspan><tspan x="638" y="368">----  ---------  --------  --------  -------  -----------</tspan><tspan x="638" y="386.75">1     link A–S   12        0         12       12 of 12</tspan><tspan x="638" y="405.5">2     link S–E   12        0         12       12 of 12</tspan><tspan x="638" y="424.25">3     router S    8        0          8        8 of 8</tspan><tspan x="638" y="443">4     link B–A    8        4          4        4 of 8</tspan><tspan x="638" y="461.75">5     link E–C    8        4          4        4 of 8</tspan><tspan x="638" y="480.5">6     router A    6        3          3        3 of 6</tspan><tspan x="638" y="499.25">7     router E    6        3          3        3 of 6</tspan><tspan x="638" y="518">8     link C–B    0        –          –        carries nothing</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="548.2">TI-LFA mode: nothing unprotected. Ties are then sorted by affected: A–S 12, S–E 12, B–A 8, E–C 8, router S 8.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="581.05">Speed</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="613.15">Backups are planned once per router; they don’t depend on what fails. With one link down at most one</tspan><tspan x="638" y="634.4">router repairs and nothing loops, so a link’s flows are just looked up. A router failure walks only the</tspan><tspan x="638" y="655.65">flows that pass it. 200 routers / 600 links: about 2 s (13 s with one full simulation per failure).</tspan></text>
<ellipse cx="88" cy="336" rx="32" ry="32" fill="#ffffff" stroke="#e03131" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="88" y="343.8">S</tspan></text>
