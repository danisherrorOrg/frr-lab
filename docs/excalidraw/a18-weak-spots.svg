<ellipse cx="498" cy="336" rx="32" ry="32" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="498" y="343.8">C</tspan></text>
<ellipse cx="408" cy="536" rx="32" ry="32" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="408" y="543.8">B</tspan></text>
