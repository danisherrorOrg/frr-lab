<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1250" width="1700" height="1250">
<defs>
</defs>
<rect x="-30" y="-30" width="1700" height="1250" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B18 · Labels: Prefix-SIDs from the SRGB, Adj-SIDs from 24000</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4.3 of docs/02-algorithms.md  ·  RFC 8402 §3.2 (Prefix-SID), §3.4 (Adj-SID)  ·  RFC 8660 (SR over MPLS)  ·  code: src/engine/labels.ts</tspan></text>
<rect x="0" y="110" width="600" height="667" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 3: every label in the network</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="531.2">Mono numbers next to each router: its Prefix-SID label. Under</tspan><tspan x="18" y="551.2">the B–C link: B’s Adj-SID for B→C (24005) and C’s for C→B</tspan><tspan x="18" y="571.2">(24006), both set in the file.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="599.3">Router  Index  Prefix   Adj-SIDs (auto unless &quot;file&quot;)</tspan><tspan x="18" y="616.8">------  -----  -------  ----------------------------</tspan><tspan x="18" y="634.3">S       1      16001    →A 24000   →E 24001</tspan><tspan x="18" y="651.8">E       2      16002    →C 24000   →S 24001</tspan><tspan x="18" y="669.3">A       3      16003    →B 24000   →S 24001</tspan><tspan x="18" y="686.8">B       4      16004    →A 24000   →C 24005 file</tspan><tspan x="18" y="704.3">C       5      16005    →B 24006 file   →E 24000</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="734.2">S → E repair: PrefixSID(B), AdjSID(B→C), PrefixSID(E) = 16004,</tspan><tspan x="18" y="754.2">24005, 16002 (B17).</tspan></text>
<rect x="620" y="110" width="1020" height="667" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: two kinds of label, two ways to get a number</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="181.2">Prefix-SID label  =  SRGB base + SID index        (one SRGB for all, D9)</tspan><tspan x="638" y="201.2">                    16000     + 4  =  16004      (router B)</tspan><tspan x="638" y="221.2"> </tspan><tspan x="638" y="241.2">Adj-SID label     =  value from the file  (adj_sid_ab / adj_sid_ba)</tspan><tspan x="638" y="261.2">                     else auto: each router counts from 24000,</tspan><tspan x="638" y="281.2">                     neighbors in ID order, then link-ID order,</tspan><tspan x="638" y="301.2">                     skipping labels it already uses</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="332.15">•  A Prefix-SID means &quot;go to router B on the shortest path&quot;. Every router has the same SRGB, so 16004</tspan><tspan x="638" y="353.4">   means B everywhere (RFC 8402 §3.2).</tspan><tspan x="638" y="374.65">•  An Adj-SID means &quot;send it out of this one link&quot;. It is local: only the router that owns the link</tspan><tspan x="638" y="395.9">   reads it (RFC 8402 §3.4).</tspan><tspan x="638" y="417.15">•  Auto Adj-SIDs start at 24000, just above the SRGB range 16000–23999.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="451.05">Auto-numbering on Example 4 (no Adj-SIDs in the file)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="481.25">Router  Neighbors in ID order    Adj-SIDs</tspan><tspan x="638" y="500">------  -----------------------  ------------------------------</tspan><tspan x="638" y="518.75">PE1     P1, P2                   24000, 24001</tspan><tspan x="638" y="537.5">P2      P1, P4, PE1              24000, 24001, 24002</tspan><tspan x="638" y="556.25">P4      P1, P2, P3, PE2          24000, 24001, 24002, 24003</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="586.2">ID order is character order: &quot;P4&quot; comes before &quot;PE1&quot; because 4 sorts before E. Used in repairs: PE1 → P1 is</tspan><tspan x="638" y="606.2">AdjSID(P2→P1), PrefixSID(P1) = 24000, 16001; PE2 → P3 is 24002, 16003.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="639.05">Set in the file (examples/03-ring5-highmetric.yaml)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="669.25">- { a: C, b: B, metric: 10, adj_sid_ab: 24006, adj_sid_ba: 24005 }</tspan><tspan x="638" y="688"> </tspan><tspan x="638" y="706.75">adj_sid_ab is for a→b = C→B  →  24006 (C’s label)</tspan><tspan x="638" y="725.5">adj_sid_ba is for b→a = B→C  →  24005 (B’s label)</tspan></text>
<ellipse cx="148" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="148" y="243.8">S</tspan></text>
<ellipse cx="448" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="448" y="243.8">E</tspan></text>
<ellipse cx="518" cy="406" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="518" y="413.8">C</tspan></text>
<ellipse cx="288" cy="436" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="288" y="443.8">B</tspan></text>
<ellipse cx="68" cy="406" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="68" y="413.8">A</tspan></text>
<polyline points="184,236 412,236" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298" y="220">1</tspan></text>
<polyline points="462,269 505,372" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="502" y="320">1</tspan></text>
<polyline points="133,269 84,374" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="127" y="336">1</tspan></text>
<polyline points="104,411 253,431" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175" y="450">1</tspan></text>
<polyline points="324,431 483,410" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="399.5" y="404">10</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="148" y="191.2">16001</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="448" y="191.2">16002</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="68" y="461.2">16003</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="288" y="491.2">16004</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="518" y="461.2">16005</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="358.5" y="461.25">24005</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="448.5" y="449.25">24006</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="331.25">SRGB base 16000</tspan></text>
<rect x="0" y="797" width="395" height="202" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="18" y="835.9">Adj-SIDs are local</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="869.15">In Example 4, P2→P1 is 24000 and</tspan><tspan x="18" y="890.4">P1→P2 is 24000 too. That is fine:</tspan><tspan x="18" y="911.65">each router only reads its own</tspan><tspan x="18" y="932.9">Adj-SIDs, so the same number means a</tspan><tspan x="18" y="954.15">different link on each router.</tspan></text>
<rect x="415" y="797" width="395" height="202" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="433" y="835.9">Bundles: one per link (A10)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="433" y="869.15">Example 7, router S: S–A 24000, S–E</tspan><tspan x="433" y="890.4">24001, S–E#2 24002. Each link of a</tspan><tspan x="433" y="911.65">bundle is its own adjacency, so an</tspan><tspan x="433" y="932.9">Adj-SID segment names its link (D29).</tspan></text>
<rect x="830" y="797" width="395" height="202" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="848" y="835.9">Skipping used labels</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="848" y="869.15">Engine run on a copy of Example 3</tspan><tspan x="848" y="890.4">with B→C set to 24000 in the file:</tspan><tspan x="848" y="911.65">B’s auto label for B→A moves from</tspan><tspan x="848" y="932.9">24000 to 24001, so B never has two</tspan><tspan x="848" y="954.15">links on one label (D18).</tspan></text>
<rect x="1245" y="797" width="395" height="202" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1263" y="835.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1263" y="869.15">•  One SRGB on every router:</tspan><tspan x="1263" y="890.4">   per-router SRGBs are not modelled</tspan><tspan x="1263" y="911.65">   (D9).</tspan><tspan x="1263" y="932.9">•  Stacks are shown before</tspan><tspan x="1263" y="954.15">   penultimate-hop popping (A7).</tspan><tspan x="1263" y="975.4">•  SRv6 uses SIDs, not labels (A25).</tspan></text>
<rect x="0" y="1019" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1057.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1091.15">A Prefix-SID label is the same on every router: 16000 + the router’s SID index, so B is 16004 everywhere. An Adj-SID is a router’s own name for one of its links: taken</tspan><tspan x="18" y="1112.4">from the file, or numbered from 24000 in neighbor-ID order. That is why Example 3’s repair reads 16004, 24005, 16002.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1165.2">Sources: docs/02-algorithms.md §4.3, §6 (Example 3), §9  ·  docs/learn/06-segment-routing.md  ·  DECISIONS.md D9, D18, D29  ·  examples/03-ring5-highmetric.yaml, 04-isp-core.yaml,</tspan><tspan x="0" y="1185.2">07-parallel.yaml</tspan></text>
</svg>
