<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1529" width="1700" height="1529">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1529" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A5 · TI-LFA: link protection</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§4 of docs/02-algorithms.md  ·  RFC 9855  ·  pick the backup path first, then force the packet along it with labels  ·  code: tilfa.ts, labels.ts</tspan></text>
<rect x="0" y="110" width="600" height="681" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 3: ring with B–C = 10, protect S–E</tspan><tspan x="18" y="176.4">for E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="638.2">No LFA and no PQ node here (A2, A3). TI-LFA still works.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="668.2">Red dashed: the failed link S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="698.2">Green arrows: the post-convergence path S → A → B → C → E (1 +</tspan><tspan x="18" y="718.2">1 + 10 + 1 = 13).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="748.2">Orange 10: B–C is forced with B’s Adj-SID 24005; no shortest</tspan><tspan x="18" y="768.2">path uses it.</tspan></text>
<rect x="620" y="110" width="1020" height="681" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: path → segments → labels</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">Step 1. Post-convergence path (B14)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="216.15">Remove link S–E (both ways), run SPF from S: S → A → B → C → E, cost 13. This is where S sends traffic</tspan><tspan x="638" y="237.4">after the network reconverges, so traffic moves only once.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="271.05">Step 2. Greedy segment walk (B15)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="303.15">Only S has switched. Every other router still uses its old table, and a Prefix-SID follows the old</tspan><tspan x="638" y="324.4">table. So from each point, jump to the furthest router Y on the path where (a) dist(X,Y) equals the</tspan><tspan x="638" y="345.65">path cost and (b) every old path X → Y avoids S–E:  dist(X,Y) &lt; dist(X,S) + c(S,E) + dist(E,Y).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="376.2">From  Try  (a) dist = path cost?  (b) avoids S–E?        Segment</tspan><tspan x="638" y="396.2">----  ---  ---------------------  ---------------------  ---------------</tspan><tspan x="638" y="416.2">S     E    1 ≠ 13  ✗</tspan><tspan x="638" y="436.2">S     C    2 ≠ 12  ✗</tspan><tspan x="638" y="456.2">S     B    2 = 2   ✓              2 &lt; 0 + 1 + 3 = 4  ✓   PrefixSID(B)</tspan><tspan x="638" y="476.2">B     E    3 ≠ 11  ✗</tspan><tspan x="638" y="496.2">B     C    4 ≠ 10  ✗   B’s old path B→A→S→E→C uses S–E</tspan><tspan x="638" y="516.2">                       no Prefix-SID works             →  AdjSID(B→C)</tspan><tspan x="638" y="536.2">C     E    1 = 1   ✓              1 &lt; 2 + 1 + 0 = 3  ✓   PrefixSID(E)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="569.05">Step 3. Labels (B18)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="600.2">PrefixSID(B) = 16000 + 4 = 16004    AdjSID(B→C) = 24005 (from the YAML)    PrefixSID(E) = 16002</tspan><tspan x="638" y="620.2">stack, top first:  16004  24005  16002      sent out to A      extra labels = 3 − 1 = 2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="650.2">Shown before penultimate-hop popping. A7 walks this stack hop by hop.</tspan></text>
<ellipse cx="168" cy="273" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="168" y="280.8">S</tspan></text>
<ellipse cx="468" cy="273" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="468" y="280.8">E</tspan></text>
<ellipse cx="538" cy="483" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="538" y="490.8">C</tspan></text>
<ellipse cx="318" cy="523" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="318" y="530.8">B</tspan></text>
<ellipse cx="98" cy="483" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="98" y="490.8">A</tspan></text>
<polyline points="204,273 432,273" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="318" y="257">1</tspan></text>
<polyline points="157,307 110,449" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="114" y="378">1</tspan></text>
<polyline points="133,489 282,516" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="204" y="532">1</tspan></text>
<polyline points="353,517 502,490" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="432.5" y="533">10</tspan></text>
<polyline points="527,449 480,307" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="522" y="378">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="168" y="220.15">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="468.5" y="220.15">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="98" y="544.15">first hop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="318.5" y="584.15">end of segment 1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="538" y="544.15">end of seg. 2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="318" y="373.15">[PrefixSID(B), AdjSID(B→C),</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="318" y="403.15">PrefixSID(E)]</tspan></text>
<rect x="0" y="811" width="533" height="256" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="849.9">Example 2: one extra label</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="883.15">Ring, all metrics 1. Path S → A → B → C → E (cost</tspan><tspan x="18" y="904.4">4).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="934.25">From S: C? old path S→E→C uses S–E</tspan><tspan x="18" y="953">        B: 2 &lt; 0 + 1 + 2 = 3  ✓</tspan><tspan x="18" y="971.75">From B: E: 2 &lt; 2 + 1 + 0 = 3  ✓</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1003.15">[PrefixSID(B), PrefixSID(E)] = 16004, 16002, out via</tspan><tspan x="18" y="1024.4">A. The same as Remote LFA’s tunnel to B (A3).</tspan></text>
<rect x="553" y="811" width="533" height="256" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="571" y="849.9">Example 1: zero extra labels (B16)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="883.15">Square. Path S → N → D. The walk gives</tspan><tspan x="571" y="904.4">[PrefixSID(N), PrefixSID(D)].</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="936.15">The repair always leaves on the first link anyway,</tspan><tspan x="571" y="957.4">so a first segment that only reaches the first hop N</tspan><tspan x="571" y="978.65">is dropped (RFC 9855 §5.1):</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1009.2">[PrefixSID(D)]   0 extra labels</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1039.2">When the first hop is an LFA, TI-LFA just sends to it.</tspan></text>
<rect x="1107" y="811" width="533" height="256" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="1125" y="849.9">How many labels?</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="881.25">Extra  When</tspan><tspan x="1125" y="900">-----  ------------------------------</tspan><tspan x="1125" y="918.75">0      the first hop is an LFA</tspan><tspan x="1125" y="937.5">1      a PQ node is on the path</tspan><tspan x="1125" y="956.25">2      P and Q are adjacent:</tspan><tspan x="1125" y="975">       Prefix-SID + Adj-SID (Ex. 3)</tspan><tspan x="1125" y="993.75">3+     rare, long detours</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1024.2">Too many for S’s Max SID depth? The repair can’t be</tspan><tspan x="1125" y="1044.2">installed (A15).</tspan></text>
<rect x="0" y="1087" width="533" height="211" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1125.9">The list ends with PrefixSID(D) (B17)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1159.15">That is the packet’s own label: it stays under the</tspan><tspan x="18" y="1180.4">repair labels (RFC 9855 §7.1). If the walk ends on</tspan><tspan x="18" y="1201.65">an Adj-SID into D, PrefixSID(D) is added after it.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1232.2">Extra labels = segments − 1.</tspan></text>
<rect x="553" y="1087" width="533" height="211" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="571" y="1125.9">Ties and labels (B14, B18)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1159.15">Equal post-convergence paths: lowest router ids</tspan><tspan x="571" y="1180.4">along the path win.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1212.15">Prefix-SID = SRGB 16000 + SID index (same SRGB</tspan><tspan x="571" y="1233.4">everywhere). Adj-SIDs from the YAML, or numbered</tspan><tspan x="571" y="1254.65">from 24000 per router in neighbor-id order.</tspan></text>
<rect x="1107" y="1087" width="533" height="211" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1125.9">Why it always works</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1159.15">Each step moves forward (an Adj-SID moves at least</tspan><tspan x="1125" y="1180.4">one hop), so the walk ends. Each Prefix-SID segment</tspan><tspan x="1125" y="1201.65">follows old paths that avoid S–E, so the repair is</tspan><tspan x="1125" y="1222.9">loop-free and costs exactly the post-convergence</tspan><tspan x="1125" y="1244.15">cost.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1275.2">Only fails if D can’t be reached at all without S–E.</tspan></text>
<rect x="0" y="1318" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1356.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1390.15">TI-LFA stops hoping a router’s normal path avoids the failure. It takes the post-convergence path and writes it as a few labels: Prefix-SIDs where old shortest paths</tspan><tspan x="18" y="1411.4">are safe, an Adj-SID where they aren’t. So it protects every destination that can still be reached.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1464.2">Sources: docs/02-algorithms.md §4.1–4.3, §6  ·  docs/learn/07-ti-lfa.md  ·  examples/03-ring5-highmetric.yaml, 02-ring5.yaml, 01-square.yaml</tspan></text>
</svg>
