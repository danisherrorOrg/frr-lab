<rect x="-30" y="-30" width="1700" height="1224" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A24 · Flex-Algo: a second SPF with its own rules</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§23 of docs/02-algorithms.md  ·  RFC 9350 §5–6 (§6.1: repairs stay in the algorithm), RFC 8667 §2.1  ·  code: src/engine/flex-algo.ts</tspan></text>
<rect x="0" y="110" width="600" height="654" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 11, in Flex-Algo 128</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Algorithm 128 = lowest delay, exclude red. Link labels: delay</tspan><tspan x="18" y="611.2">in µs, its metric.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Gray dashed: S–E has affinity red, so algorithm 128 leaves it</tspan><tspan x="18" y="661.2">out.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Blue: S → D in 128, S→A→D (20 µs). Red dashed: the protected</tspan><tspan x="18" y="711.2">link S–A.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="741.2">Green: the repair, LFA B and TI-LFA S→B→D (100 µs).</tspan></text>
<rect x="620" y="110" width="1020" height="654" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: flexTopology(t, algo) is the network the algorithm sees</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="180.25">flex_algo: [{ algo: 128, metric: delay, exclude_any: [red] }]</tspan><tspan x="638" y="199">links: affinity: [red], te_metric, delay (µs)   routers: algos: [128], algo_sids</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="230.15">•  Routers: those that take part (algos, left out = all). Each gets its own Prefix-SID for the</tspan><tspan x="638" y="251.4">   algorithm: algo_sids, else its index + 1000 × the algorithm’s place in the list (128 first: +1000).</tspan><tspan x="638" y="272.65">•  Links: between taking-part routers, passing the colour rules (exclude-any, include-any,</tspan><tspan x="638" y="293.9">   include-all), and having the metric (no TE metric or delay → left out). Their cost is that metric.</tspan><tspan x="638" y="315.15">•  Everything else (SRGB, MSD, LFA policy, protection goal) is the network’s.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="349.05">FRR stays inside the algorithm (RFC 9350 §6.1)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="381.15">So LFA, Remote LFA, TI-LFA, the simulation and coverage run unchanged on flexTopology.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="410.3">              Algorithm 0 (IGP metric)              Algorithm 128 (delay, no red)</tspan><tspan x="638" y="427.8">------------  ------------------------------------  -------------------------------------</tspan><tspan x="638" y="445.3">S → D         S-E-D, 10 + 10 = 20                   S-A-D, 10 + 10 = 20 µs  (S–E gone)</tspan><tspan x="638" y="462.8">protected     S–E                                   S–A</tspan><tspan x="638" y="480.3">LFA B         15 &lt; dist(B,S)+dist(S,D) = 15+20 ✓    50 &lt; dist(B,S)+dist(S,D) = 50+20 ✓</tspan><tspan x="638" y="497.8">              downstream 15 &lt; 20 ✓                  downstream 50 &lt; 20 ✗</tspan><tspan x="638" y="515.3">              node-prot. 15 &lt; 25+10 ✓               node-prot. 50 &lt; dist(B,A)+dist(A,D)</tspan><tspan x="638" y="532.8">                                                               = 60+10 ✓</tspan><tspan x="638" y="550.3">TI-LFA        S-B-D  [PrefixSID(D)] = 16005         S-B-D  [PrefixSID(D) in 128] = 17005</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="580.2">D’s SID index is 5: 16000 + 5 in algorithm 0, 16000 + 1005 in 128.</tspan></text>
<ellipse cx="68" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="68" y="373.8">S</tspan></text>
<ellipse cx="298" cy="216" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="223.8">E</tspan></text>
<ellipse cx="298" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="373.8">A</tspan></text>
<ellipse cx="298" cy="516" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="298" y="523.8">B</tspan></text>
<ellipse cx="528" cy="366" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="528" y="373.8">D</tspan></text>
<polyline points="98,346 268,235" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="161.5" y="262.15">100  red</tspan></text>
<polyline points="328,236 498,347" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="427.5" y="273.15">100</tspan></text>
<polyline points="104,366 262,366" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="183" y="350.15">10</tspan></text>
<polyline points="334,366 492,366" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413" y="350.15">10</tspan></text>
<polyline points="98,386 268,497" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170" y="467.15">50</tspan></text>
<polyline points="328,496 498,385" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="426" y="467.15">50</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="528.5" y="319.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="418" y="521.2">LFA, 17005</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="72" y="319.2">source</tspan></text>
<rect x="0" y="784" width="533" height="209" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="822.9">Why the repair must stay inside</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="856.15">Algorithm 128 exists to keep traffic on low-delay</tspan><tspan x="18" y="877.4">links and off red ones. A repair computed in</tspan><tspan x="18" y="898.65">algorithm 0 could use exactly the link the operator</tspan><tspan x="18" y="919.9">wanted to avoid: S–E is red.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="950.2">RFC 9350 §6.1: repair paths for a Flex-Algo prefix MUST</tspan><tspan x="18" y="970.2">use the same Flex-Algo.</tspan></text>
<rect x="553" y="784" width="533" height="209" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="822.9">In the app</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="856.15">The sidebar’s Algorithm picker makes the algorithm’s</tspan><tspan x="571" y="877.4">network the one on screen. It is read-only, because</tspan><tspan x="571" y="898.65">its metrics aren’t the IGP metrics (moving routers</tspan><tspan x="571" y="919.9">still works).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="950.2">In SRv6 (A25) each algorithm has its own locator (RFC</tspan><tspan x="571" y="970.2">9350 §14).</tspan></text>
<rect x="1107" y="784" width="533" height="209" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="822.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="856.15">•  SID indices are checked unique over all</tspan><tspan x="1125" y="877.4">   algorithms: they share the SRGB.</tspan><tspan x="1125" y="898.65">•  LANs keep only the IGP metric (no TE metric or</tspan><tspan x="1125" y="919.9">   delay on them here).</tspan><tspan x="1125" y="941.15">•  A Flex-Algo on the IGP metric with no rules gives</tspan><tspan x="1125" y="962.4">   algorithm 0’s paths (a property test).</tspan></text>
<rect x="0" y="1013" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1051.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1085.15">A Flex-Algo is another SPF in the same network, with its own metric, its own link rules and its own Prefix-SIDs. Its FRR runs on that same restricted network. In</tspan><tspan x="18" y="1106.4">Example 11, algorithm 128 drops the red link S–E, sends S → D via A, and repairs via B with label 17005.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1159.2">Sources: docs/02-algorithms.md §23  ·  docs/learn/11-advanced-topics.md (Flex-Algo)  ·  examples/11-flex-algo.yaml  ·  checked with flexTopology(), computeForSource()</tspan></text>
</svg>
