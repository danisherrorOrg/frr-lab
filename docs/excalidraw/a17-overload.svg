<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1265" width="1700" height="1265">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1265" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A17 · Overload bit: reach me, but never through me</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§16 of docs/02-algorithms.md  ·  ISO 10589, RFC 5286 §3.5, RFC 7490 §5.4  ·  code: src/engine/spf.ts (viaCost, linkPathCost)</tspan></text>
<rect x="0" y="110" width="600" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 1, N overloaded, S → D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Blue: S’s normal path S→E→D (20).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">Red dashed: the failed link S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="651.2">Gray dashed: N has the overload bit. S–N–D is the only other</tspan><tspan x="18" y="671.2">path, and it passes through N.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="701.2">Result: no LFA, no PQ node, no TI-LFA. D is cut off.</tspan></text>
<rect x="620" y="110" width="1020" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: an overloaded router can be an end of a path, never the middle</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">1. SPF</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="216.15">Dijkstra reaches an overloaded router but doesn’t relax its links, unless it is the root. Reverse SPF</tspan><tspan x="638" y="237.4">does the same. So dist(X,Y) is the cheapest path with no overloaded router inside it.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="271.05">2. &quot;Path through M&quot; counts as ∞ when M is overloaded and in the middle</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="300.3">Check                       Right-hand side              ∞ when</tspan><tspan x="638" y="317.8">--------------------------  ---------------------------  -----------------------------------</tspan><tspan x="638" y="335.3">Avoids link S→E (B1)        dist(X,S)+c(S,E)+dist(E,Y)   S overloaded and X ≠ S, or E overloaded and Y ≠ E</tspan><tspan x="638" y="352.8">LFA loop-free (B3)          dist(N,S)+dist(S,D)          S overloaded</tspan><tspan x="638" y="370.3">LFA node-protecting (B5)    dist(N,E)+dist(E,D)          E overloaded and D ≠ E</tspan><tspan x="638" y="387.8">P-space (B8)                c(S,E)+dist(E,Y)             E overloaded</tspan><tspan x="638" y="405.3">Extended P-space (B9)       dist(N,S)+dist(S,Y)          S overloaded</tspan><tspan x="638" y="422.8">Q-space (B10)               dist(Y,S)+c(S,E)             S overloaded</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="455.05">3. Never a backup</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="487.15">•  LFA: &quot;S MUST NOT consider using N_i as an alternate&quot; (RFC 5286 §3.5), skipped with reason overload.</tspan><tspan x="638" y="508.4">•  Remote LFA: never a tunnel exit, never a PQ node (RFC 7490 §5.4). It may still be in P or Q.</tspan><tspan x="638" y="529.65">•  TI-LFA: the post-convergence SPF follows the same rule, so it is never inside the repair path.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="563.05">Worked: Example 1, N overloaded, S → D</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="593.25">LFA:     Via N: skipped, N has the overload bit set</tspan><tspan x="638" y="612">P(S) = {N}: 15 &lt; 10+20 = 30 ✓      Q(E) = {D, N}: N 20 &lt; 15+10 = 25 ✓</tspan><tspan x="638" y="630.75">PQ:      N is in both, but overloaded → no PQ node</tspan><tspan x="638" y="649.5">TI-LFA:  the only path left, S-N-D, passes through N → D can’t be reached</tspan></text>
<ellipse cx="128" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="128" y="253.8">S</tspan></text>
<ellipse cx="438" cy="246" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="438" y="253.8">E</tspan></text>
<ellipse cx="128" cy="496" rx="32" ry="32" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="10 7"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="128" y="503.8">N</tspan></text>
<ellipse cx="438" cy="496" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="438" y="503.8">D</tspan></text>
<polyline points="164,246 402,246" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="283.5" y="230">10</tspan></text>
<polyline points="438,282 438,460" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="416.5" y="378">10</tspan></text>
<polyline points="128,282 128,460" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="149.5" y="378">15</tspan></text>
<polyline points="164,496 402,496" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="283.5" y="525">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="132" y="555.2">overload bit: no transit</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="128" y="199.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="553.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="438" y="199.2">primary next hop</tspan></text>
<rect x="0" y="744" width="533" height="290" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="782.9">It can also create an LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="816.15">Kite: N–S 1, S–E 1, E–D 1, N–D 10. S is overloaded;</tspan><tspan x="18" y="837.4">S → D.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="867.25">no bit:  dist(N,D) = 3 (N-S-E-D)</tspan><tspan x="18" y="886">         3 &lt; 1+2         ✗ not loop-free</tspan><tspan x="18" y="904.75">S bit:   dist(N,D) = 10</tspan><tspan x="18" y="923.5">         10 &lt; ∞          ✓ loop-free</tspan><tspan x="18" y="942.25">         10 &lt; 11+1 = 12  ✓ node-protecting</tspan><tspan x="18" y="961">         10 &lt; 2          ✗ not downstream</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="991.2">N never sends traffic back through S. TI-LFA: S-N-D,</tspan><tspan x="18" y="1011.2">[PrefixSID(D)] = 16004.</tspan></text>
<rect x="553" y="744" width="533" height="290" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="571" y="782.9">More worked checks</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="814.25">Ex. 2, B overloaded:</tspan><tspan x="571" y="833">  dist(A,C) = 3 (A-S-E-C), not A-B-C</tspan><tspan x="571" y="851.75">  B still reached: dist(S,B) = 2</tspan><tspan x="571" y="870.5">Ex. 2, C overloaded, S → E:</tspan><tspan x="571" y="889.25">  ext. P = {A, B, C}, Q(E) = {C}</tspan><tspan x="571" y="908">  C overloaded → no PQ node</tspan><tspan x="571" y="926.75">Ex. 4, P1 overloaded (what-if, A14):</tspan><tspan x="571" y="945.5">  pairs 35 → 31, TI-LFA 35 → 21</tspan></text>
<rect x="1107" y="744" width="533" height="290" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="782.9">What stays the same</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="816.15">•  An overloaded router is still a destination, and</tspan><tspan x="1125" y="837.4">   it still forwards its own traffic (it is the root</tspan><tspan x="1125" y="858.65">   of its own SPF).</tspan><tspan x="1125" y="879.9">•  ECMP: unchanged. It is only a primary next hop</tspan><tspan x="1125" y="901.15">   for its own address.</tspan><tspan x="1125" y="922.4">•  Failure simulation (A9): nothing new; every table</tspan><tspan x="1125" y="943.65">   follows the rules above.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="974.2">In YAML: overload: true on the router.</tspan></text>
<rect x="0" y="1054" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1092.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1126.15">A router with the overload bit can be reached but is never passed through, so it is never an LFA, a PQ node or a hop inside a TI-LFA path. Any check that adds up a</tspan><tspan x="18" y="1147.4">&quot;path through&quot; it counts that path as ∞. That can remove backups (Example 1) or create one (the kite).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1200.2">Sources: docs/02-algorithms.md §16  ·  docs/learn/01, 10 (Overload bit)  ·  examples/01-square.yaml, 02-ring5.yaml  ·  checked with computeForSource(), whatIf()</tspan></text>
</svg>
