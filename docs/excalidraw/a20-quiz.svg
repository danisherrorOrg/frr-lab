<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1344" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A20 · Quiz mode: questions with real answers</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§19 of docs/02-algorithms.md  ·  every question is one results-table row; the answer and the &quot;why&quot; come from the engine  ·  code: src/engine/quiz.ts</tspan></text>
<rect x="0" y="110" width="600" height="654" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 2, seed 1, question 5</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="661.2">All metrics 1. Red dashed: the link in the question, S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Green: S’s normal path to A, which doesn’t use S–E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="721.2">The explanation is the row’s own explain step, the same text</tspan><tspan x="18" y="741.2">as the detail panel.</tspan></text>
<rect x="620" y="110" width="1020" height="654" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: pick a row, ask about one field of it</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">makeQuiz(topology, seed, count) runs computeForSource(), picks a row (S, D, protected link S–E) and</tspan><tspan x="638" y="203.4">asks one of 8 kinds of question:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="232.3">Kind          Question                                       Right answer from</tspan><tspan x="638" y="249.8">------------  ---------------------------------------------  ---------------------------------</tspan><tspan x="638" y="267.3">loop-free     Is neighbor N loop-free for D?                 the candidate’s Inequality 1 (B3)</tspan><tspan x="638" y="284.8">best-lfa      Which neighbor does S pick as its LFA?         lfa.best (B7, A16), else &quot;No LFA&quot;</tspan><tspan x="638" y="302.3">method        Simplest method that protects S → D?           protectedBy (B20)</tspan><tspan x="638" y="319.8">p-space       Is Y in S’s P-space?                           rlfa.pSpace (B8)</tspan><tspan x="638" y="337.3">q-space       Is Y in E’s Q-space?                           rlfa.qSpace (B10)</tspan><tspan x="638" y="354.8">pq-node       Which PQ node does Remote LFA tunnel to?       rlfa.best, else &quot;No PQ node&quot;</tspan><tspan x="638" y="372.3">extra-labels  How many labels on top of D’s label?           extraLabels, &quot;3 or more&quot; from 3</tspan><tspan x="638" y="389.8">label-stack   Which stack does TI-LFA send?                  labelStack (B18)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="422.05">Seeded, so the same seed gives the same quiz</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="453.2">Park–Miller (as in D50):  x ← x · 48271 mod 2147483647</tspan><tspan x="638" y="473.2">picks the source, the row, the kind and the order of the choices</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="504.15">•  The kinds take turns. A kind that doesn’t fit the row (no LFA candidates, no TI-LFA path…) gives way</tspan><tspan x="638" y="525.4">   to the next.</tspan><tspan x="638" y="546.65">•  No question is asked twice in one quiz.</tspan><tspan x="638" y="567.9">•  Wrong choices are real alternatives: other neighbors, other methods, the reversed stack, a stack</tspan><tspan x="638" y="589.15">   with a label missing or doubled.</tspan><tspan x="638" y="610.4">•  Uses the network’s own settings (MSD, LFA policy, node or SRLG protection): on Example 8 it asks</tspan><tspan x="638" y="631.65">   about node-protecting PQ nodes.</tspan></text>
<ellipse cx="88" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="88" y="273.8">S</tspan></text>
<ellipse cx="248" cy="202" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="248" y="209.8">E</tspan></text>
<ellipse cx="408" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="408" y="273.8">C</tspan></text>
<ellipse cx="338" cy="396" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="338" y="403.8">B</tspan></text>
<ellipse cx="148" cy="396" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="148" y="403.8">A</tspan></text>
<polyline points="121,253 214,216" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="177" y="263">1</tspan></text>
<polyline points="281,215 374,252" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="319" y="263">1</tspan></text>
<polyline points="391,298 355,365" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="354" y="327">1</tspan></text>
<polyline points="302,396 184,396" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="243" y="425">1</tspan></text>
<polyline points="103,299 133,364" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="137" y="329">1</tspan></text>
<rect x="18" y="456" width="564" height="180" rx="16" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="32" y="481.2">S sends traffic for E to E. The link S–E fails. Can S reach</tspan><tspan x="32" y="501.2">A on its normal path without using S–E (is A in S’s</tspan><tspan x="32" y="521.2">P-space)?</tspan></text>
<rect x="32" y="530" width="120" height="36" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="92" y="553.15">Yes  ✓</tspan></text>
<rect x="168" y="530" width="120" height="36" rx="9" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="228" y="553.15">No</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="32" y="593.3">P-space: A: dist(S,A)=1 &lt; c(S,E)+dist(E,A) = 1+2 = 3 ✓</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="32" y="619.3">RFC 7490 §5.2.1.1</tspan></text>
<rect x="0" y="784" width="1087" height="329" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="822.9">Example 2, seed 1: the 10 questions</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="854.25"> #  Kind          Row (S → D, link)   Right answer</tspan><tspan x="18" y="873">--  ------------  ------------------  ---------------------------------</tspan><tspan x="18" y="891.75"> 1  method        E → C, E–C          Remote LFA</tspan><tspan x="18" y="910.5"> 2  label-stack   E → S, S–E          16004 16001</tspan><tspan x="18" y="929.25"> 3  pq-node       B → C, C–B          S</tspan><tspan x="18" y="948"> 4  q-space       B → S, B–A          Yes (S is in A’s Q-space)</tspan><tspan x="18" y="966.75"> 5  p-space       S → E, S–E          Yes (A is in S’s P-space)</tspan><tspan x="18" y="985.5"> 6  extra-labels  B → C, C–B          1</tspan><tspan x="18" y="1004.25"> 7  best-lfa      A → C, B–A          S</tspan><tspan x="18" y="1023"> 8  loop-free     B → A, B–A          No (C is not loop-free for A)</tspan><tspan x="18" y="1041.75"> 9  method        S → A, A–S          Remote LFA</tspan><tspan x="18" y="1060.5">10  label-stack   A → C, B–A          16002 16005</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1090.2">Seed 2 starts with label-stack A → S, then method C → E. Running seed 1 again gives exactly the list above.</tspan></text>
<rect x="1107" y="784" width="533" height="329" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="822.9">Why it can’t be wrong</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="856.15">The quiz decides nothing. Each answer is a field the</tspan><tspan x="1125" y="877.4">results table already shows, and each &quot;why&quot; is that</tspan><tspan x="1125" y="898.65">row’s explain steps.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="930.15">A property test (random networks, random seeds)</tspan><tspan x="1125" y="951.4">checks every answer against the engine, that the</tspan><tspan x="1125" y="972.65">choices are unique, and that each question has an</tspan><tspan x="1125" y="993.9">explanation.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1024.2">The score reads &quot;right of asked&quot;. The engine stays</tspan><tspan x="1125" y="1044.2">pure: no Math.random.</tspan></text>
<rect x="0" y="1133" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1171.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1205.15">Quiz mode turns the network on screen into practice questions: loop-free checks, P- and Q-space, PQ nodes, labels. The right answer and its explanation come straight</tspan><tspan x="18" y="1226.4">from the engine, and a seed always gives the same quiz.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1279.2">Sources: docs/02-algorithms.md §19  ·  docs/learn/12-using-lfa-lab.md  ·  examples/02-ring5.yaml  ·  checked with makeQuiz()</tspan></text>
</svg>
