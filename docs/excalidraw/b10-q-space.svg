<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#7048e8"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1244" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B10 · Q-space: who reaches E without the failed link</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3 of docs/02-algorithms.md  ·  RFC 7490 §5.2.1.3, §5.3  ·  DECISIONS.md D17  ·  code: src/engine/rlfa.ts (computeRlfa → qSpace), spf.ts (reverse SPF)</tspan></text>
<rect x="0" y="110" width="600" height="654" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 4: the ISP core, link PE1–P1, E = P1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Red dashed: the protected link PE1–P1 (c = 10).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="18" y="621.2">Purple arrows: shortest paths towards E. P3 → P1 and PE2 → P3</tspan><tspan x="18" y="641.2">→ P1 avoid PE1–P1: Q(P1) = {P3, PE2}.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Gray: P2 and P4 tie. Their shortest path to P1 (for P4, one of</tspan><tspan x="18" y="691.2">two) ends PE1 → P1.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="721.2">Diagonal: P1 → P4 is 20, but P4 → P1 is 40. Q-space only looks</tspan><tspan x="18" y="741.2">towards P1.</tspan></text>
<rect x="620" y="110" width="1020" height="654" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: Y’s own shortest path to E doesn’t end with S–E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="183.1">Y ∈ Q(E)   ⇔   dist(Y,E)  &lt;  dist(Y,S) + c(S,E)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.15">•  The right side is Y’s cheapest path to E that ends with the link S–E: Y → … → S, then S → E.</tspan><tspan x="638" y="236.4">•  Strictly cheaper ⇒ no shortest path from Y to E crosses S–E, so a packet dropped at Y reaches E</tspan><tspan x="638" y="257.65">   safely. E then forwards it to D.</tspan><tspan x="638" y="278.9">•  Note the direction: dist(Y,E) is from Y towards E. With per-direction metrics it comes from a</tspan><tspan x="638" y="300.15">   reverse SPF rooted at E (A1, §1.2).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="334.05">Worked checks, Example 4 (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="364.25">Y     dist(Y,P1)   dist(Y,PE1) + c(PE1,P1)   In Q(P1)?</tspan><tspan x="638" y="383">----  ----------   -----------------------   ------------------------------</tspan><tspan x="638" y="401.75">P2    20           10 + 10 = 20              ✗ tie: P2 → PE1 → P1 is the path</tspan><tspan x="638" y="420.5">P3    10           20 + 10 = 30              ✓ 10 &lt; 30</tspan><tspan x="638" y="439.25">P4    30           20 + 10 = 30              ✗ tie: P4 → P2 → PE1 → P1 is one</tspan><tspan x="638" y="458">PE2   20           30 + 10 = 40              ✓ 20 &lt; 40   (PE2 → P3 → P1)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="638" y="488.2">Q(P1) for link PE1–P1 = {P3, PE2}</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="521.05">The wrong direction gives the wrong answer</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="551.25">P4 with dist(P1,P4) = 20 (from E):   20 &lt; 30  ✓   wrong, P4 would join Q</tspan><tspan x="638" y="570">P4 with dist(P4,P1) = 30 (to E):     30 &lt; 30  ✗   right: 40 direct, 30 via P2 or PE2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="603.05">Other examples</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="633.25">Example        Link   Q(E)        Out on a tie</tspan><tspan x="638" y="652">-------------  -----  ----------  ----------------------------</tspan><tspan x="638" y="670.75">2  ring        S–E    {B, C}      A: 2 = 1 + 1</tspan><tspan x="638" y="689.5">3  ring, B–C   S–E    {C}         A: 2 = 1 + 1,  B: 3 = 2 + 1</tspan><tspan x="638" y="708.25">8              S–E    {B, C, D}   N: 4 = 2 + 2</tspan></text>
<ellipse cx="58" cy="361" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="58.5" y="368.8">PE1</tspan></text>
<ellipse cx="208" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="243.8">P1</tspan></text>
<ellipse cx="208" cy="486" rx="30" ry="30" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="493.8">P2</tspan></text>
<ellipse cx="408" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="243.8">P3</tspan></text>
<ellipse cx="408" cy="486" rx="30" ry="30" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="493.8">P4</tspan></text>
<ellipse cx="548" cy="361" rx="30" ry="30" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="548.5" y="368.8">PE2</tspan></text>
<polyline points="84,339 182,258" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="115.5" y="284">10</tspan></text>
<polyline points="84,383 182,464" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="115.5" y="451">10</tspan></text>
<polyline points="242,486 374,486" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="515">10</tspan></text>
<polyline points="208,270 208,452" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="186.5" y="368">30</tspan></text>
<polyline points="374,236 242,236" fill="none" stroke="#7048e8" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="220">10</tspan></text>
<polyline points="408,270 408,452" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="429.5" y="368">30</tspan></text>
<polyline points="229,263 387,460" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="325.5" y="319.15">20 / 40</tspan></text>
<polyline points="523,338 434,258" fill="none" stroke="#7048e8" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="495.5" y="285">10</tspan></text>
<polyline points="433,463 522,383" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="495.5" y="450">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="58.5" y="316.2">S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="208.5" y="191.2">E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="408.5" y="191.2">Q</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="548.5" y="316.2">Q</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="208" y="541.2">tie: out</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="408" y="541.2">tie: out</tspan></text>
<rect x="0" y="784" width="533" height="209" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="822.9">Why aim for E, not D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="856.15">Remote LFA always aims for E. Once the packet is at</tspan><tspan x="18" y="877.4">E, E’s normal path to every D behind it is fine. So</tspan><tspan x="18" y="898.65">one Q-space per link serves every destination (RFC</tspan><tspan x="18" y="919.9">7490 §5.2.1.3).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="950.2">Node protection (B12) can’t aim for E, so it adds a</tspan><tspan x="18" y="970.2">check per D.</tspan></text>
<rect x="553" y="784" width="533" height="209" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="822.9">c(S,E) or dist(S,E)?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="856.15">RFC 7490 writes dist(Y,S) + dist(S,E). We write</tspan><tspan x="571" y="877.4">c(S,E).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="908.2">D17: they are equal whenever S–E is a primary link,</tspan><tspan x="571" y="928.2">since then dist(S,E) = c(S,E). c(S,E) is also exactly</tspan><tspan x="571" y="948.2">the avoid-check of B1.</tspan></text>
<rect x="1107" y="784" width="533" height="209" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="822.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="856.15">•  S and E are never listed (D17).</tspan><tspan x="1125" y="877.4">•  Overload (A17): if S is overloaded, the right</tspan><tspan x="1125" y="898.65">   side is ∞. An overloaded Y stays in Q but is</tspan><tspan x="1125" y="919.9">   never a tunnel end (B11, RFC 7490 §5.4).</tspan><tspan x="1125" y="941.15">•  Parallel links (A10): c(S,E) is the protected</tspan><tspan x="1125" y="962.4">   link’s own metric.</tspan></text>
<rect x="0" y="1013" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1051.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1085.15">Q-space is every router whose own shortest path to E avoids the failed link: dist(Y,E) &lt; dist(Y,S) + c(S,E). It is measured towards E, so per-direction metrics need a</tspan><tspan x="18" y="1106.4">reverse SPF. In Example 4 the wrong direction would wrongly add P4.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1159.2">Sources: docs/02-algorithms.md §1.2, §3, §6  ·  docs/learn/05-remote-lfa.md (Q-space)  ·  examples/04-isp-core.yaml, 02-ring5.yaml, 03-ring5-highmetric.yaml, 08-node-protection.yaml </tspan><tspan x="0" y="1179.2">·  checked with computeForSource()</tspan></text>
</svg>
