<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1524" width="1700" height="1524">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1524" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A8 · Coverage numbers</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§5 of docs/02-algorithms.md  ·  what share of (destination, primary link) pairs each method protects  ·  code: src/engine/coverage.ts, rows.ts</tspan></text>
<rect x="0" y="110" width="600" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 2: S’s four pairs</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="611.2">Every metric is 1. S reaches A and B over S–A, and C and E</tspan><tspan x="18" y="631.2">over S–E: four pairs.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="661.2">Blue arrows: S’s two primary links.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Each tag: the pair’s primary link and the simplest method that</tspan><tspan x="18" y="711.2">protects it.</tspan></text>
<rect x="620" y="110" width="1020" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: count pairs, then shares</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">A pair = (destination D, primary next-hop link S–E)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="216.15">A destination with two ECMP next hops gives two pairs. Routers S can’t reach give none.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="247.2">LFA coverage    = pairs protected by LFA (or ECMP)   / all pairs</tspan><tspan x="638" y="267.2">RLFA coverage   = pairs protected by LFA or Remote LFA / all pairs</tspan><tspan x="638" y="287.2">TI-LFA coverage = pairs protected by TI-LFA            / all pairs</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="320.05">Example 2, source S</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="351.2">D   link  LFA         Remote LFA   TI-LFA              counted as</tspan><tspan x="638" y="371.2">--  ----  ----------  -----------  ------------------  ----------</tspan><tspan x="638" y="391.2">A   S–A   none        PQ C         ✓                   Remote LFA</tspan><tspan x="638" y="411.2">B   S–A   E           (not run)    ✓                   LFA</tspan><tspan x="638" y="431.2">C   S–E   A           (not run)    ✓                   LFA</tspan><tspan x="638" y="451.2">E   S–E   none        PQ B         [16004, 16002]      Remote LFA</tspan><tspan x="638" y="471.2"> </tspan><tspan x="638" y="491.2">S:   LFA 2/4 = 50%     LFA or RLFA 4/4 = 100%     TI-LFA 4/4 = 100%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="524.05">Every router as the source (&quot;all sources&quot;)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="556.15">Run the same count for every router and add them up. The ring is symmetric, so every router has 4 pairs</tspan><tspan x="638" y="577.4">and 2 LFAs:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="608.2">all:  20 pairs    LFA 10/20 = 50%    LFA or RLFA 20/20 = 100%    TI-LFA 20/20 = 100%</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="638.2">Remote LFA only runs when there is no LFA (B13), so &quot;RLFA coverage&quot; always includes the LFA pairs.</tspan></text>
<ellipse cx="168" cy="256" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="168" y="263.8">S</tspan></text>
<ellipse cx="438" cy="256" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="438" y="263.8">E</tspan></text>
<ellipse cx="508" cy="456" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="508" y="463.8">C</tspan></text>
<ellipse cx="308" cy="496" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="308" y="503.8">B</tspan></text>
<ellipse cx="98" cy="456" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="98" y="463.8">A</tspan></text>
<polyline points="204,256 402,256" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="303" y="240">1</tspan></text>
<polyline points="450,290 496,422" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="492" y="356">1</tspan></text>
<polyline points="473,463 344,489" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413" y="505">1</tspan></text>
<polyline points="273,489 134,462" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="207" y="460">1</tspan></text>
<polyline points="156,290 110,422" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="114" y="356">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="168" y="205.2">source S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="189.2">E via S–E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="438.5" y="212.2">Remote LFA (PQ B)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="508.5" y="507.2">C via S–E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="508.5" y="530.2">LFA A</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="547.2">B via S–A</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="570.2">LFA E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="98.5" y="507.2">A via S–A</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="118.5" y="530.2">Remote LFA (PQ C)</tspan></text>
<rect x="0" y="754" width="533" height="352" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="792.9">Example 3: every router as the source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="826.15">Same ring, B–C = 10.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="856.25">source  pairs  LFA  LFA/RLFA  TI-LFA</tspan><tspan x="18" y="875">------  -----  ---  --------  ------</tspan><tspan x="18" y="893.75">A       4      0    0         4</tspan><tspan x="18" y="912.5">B       4      4    4         4</tspan><tspan x="18" y="931.25">C       4      4    4         4</tspan><tspan x="18" y="950">E       4      0    0         4</tspan><tspan x="18" y="968.75">S       4      0    0         4</tspan><tspan x="18" y="987.5">------  -----  ---  --------  ------</tspan><tspan x="18" y="1006.25">all     20     8    8         20</tspan><tspan x="18" y="1025">               40%  40%       100%</tspan></text>
<rect x="553" y="754" width="533" height="352" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="792.9">The unprotected list</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="826.15">Every pair LFA doesn’t protect, with the reason from</tspan><tspan x="571" y="847.4">the strongest method that fails:</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="879.15">•  no-lfa: Remote LFA or TI-LFA saves it</tspan><tspan x="571" y="900.4">•  no-rlfa: only TI-LFA saves it</tspan><tspan x="571" y="921.65">•  too-deep: only TI-LFA, but deeper than S’s Max</tspan><tspan x="571" y="942.9">   SID depth (A15)</tspan><tspan x="571" y="964.15">•  partitioned: nothing; the link is the only way to</tspan><tspan x="571" y="985.4">   D</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1015.25">Ex. 2: 10 pairs, all no-lfa</tspan><tspan x="571" y="1034">Ex. 3: 12 pairs, all no-rlfa</tspan><tspan x="571" y="1052.75">       e.g. S → E over S–E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1083.2">Export the list as CSV from the Coverage report.</tspan></text>
<rect x="1107" y="754" width="533" height="352" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="1125" y="792.9">What &quot;100%&quot; means</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="826.15">TI-LFA 100% = every pair has a repair for one link</tspan><tspan x="1125" y="847.4">failure. It is below 100% only if the network splits</tspan><tspan x="1125" y="868.65">(partitioned) or a stack is too deep.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="900.15">It does not mean every router failure or double</tspan><tspan x="1125" y="921.4">failure is survived (A9).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="952.2">Pairs, not destinations: a pair is one place a repair</tspan><tspan x="1125" y="972.2">is needed.</tspan></text>
<rect x="0" y="1126" width="533" height="167" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="1164.9">ECMP is counted too</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1198.15">ECMP-protected pairs are counted on their own, and</tspan><tspan x="18" y="1219.4">also as LFA: the other next hop is always a</tspan><tspan x="18" y="1240.65">downstream LFA (B2).</tspan></text>
<rect x="553" y="1126" width="533" height="167" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1164.9">Node mode adds a count</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1198.15">With protection: node, also count the pairs with D ≠</tspan><tspan x="571" y="1219.4">E, and of those the ones whose backups avoid router</tspan><tspan x="571" y="1240.65">E.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1270.25">Example 8, from S: 3 pairs, 3 and 3</tspan></text>
<rect x="1107" y="1126" width="533" height="167" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1164.9">One row per pair (rows.ts)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1198.15">computeAllSources() keeps one row per pair with</tspan><tspan x="1125" y="1219.4">protectedBy, the simplest method in the order ECMP →</tspan><tspan x="1125" y="1240.65">LFA → Remote LFA → TI-LFA (B20).</tspan></text>
<rect x="0" y="1313" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1351.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1385.15">Coverage counts (destination, primary link) pairs and asks which method protects each. On the plain ring LFA gets 50% and Remote LFA lifts it to 100%; with one</tspan><tspan x="18" y="1406.4">expensive link LFA and Remote LFA drop to 40%, while TI-LFA stays at 100%.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1459.2">Sources: docs/02-algorithms.md §5  ·  docs/learn/08-comparison.md, 10-design-checks.md  ·  examples/02-ring5.yaml, 03-ring5-highmetric.yaml  ·  numbers checked with computeCoverage()</tspan></text>
</svg>
