<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1256" width="1700" height="1256">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1256" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B3 · Loop-free: N won’t send it back to S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§2 of docs/02-algorithms.md  ·  RFC 5286 §1 (Inequality 1), required by §3.1  ·  code: src/engine/lfa.ts (loopFree, computeLfa)</tspan></text>
<rect x="0" y="110" width="600" height="631" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 2: the ring, link S–E fails, every</tspan><tspan x="18" y="176.4">metric 1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="618.2">Red dashed: the failed link S–E. S’s only other neighbor is A.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="648.2">Red arrows: A’s own shortest path to E is A → S → E (2). It</tspan><tspan x="18" y="668.2">goes back through S: no LFA for E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="698.2">Green arrows: A’s shortest path to C is A → B → C (2). It</tspan><tspan x="18" y="718.2">avoids S: A is an LFA for C.</tspan></text>
<rect x="620" y="110" width="1020" height="631" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: N’s best path must be cheaper than any path through S</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="183.1">loop-free   ⇔   dist(N,D)  &lt;  dist(N,S) + dist(S,D)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.15">•  The right side is N’s cheapest path to D that goes through S: N → … → S, then S’s own path to D.</tspan><tspan x="638" y="236.4">•  If N’s real best path is strictly cheaper, N doesn’t go through S, so traffic S hands to N never</tspan><tspan x="638" y="257.65">   comes back.</tspan><tspan x="638" y="278.9">•  A tie (=) fails: N might pick the path through S (ECMP), so S can’t count on it.</tspan><tspan x="638" y="300.15">•  This is the only check an LFA must pass. B4 and B5 are stronger, optional ones.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="334.05">Worked checks (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="363.3">Example        S → D      N    dist(N,D)  dist(N,S) + dist(S,D)   Result</tspan><tspan x="638" y="380.8">-------------  ---------  ---  ---------  ----------------------  -------------</tspan><tspan x="638" y="398.3">2  ring        S → E      A    2          1 + 1  = 2              2 = 2    ✗</tspan><tspan x="638" y="415.8">2  ring        S → C      A    2          1 + 2  = 3              2 &lt; 3    ✓</tspan><tspan x="638" y="433.3">1  square      S → D      N    10         15 + 20 = 35            10 &lt; 35  ✓</tspan><tspan x="638" y="450.8">4  ISP core    PE1 → P4   P1   20         10 + 20 = 30            20 &lt; 30  ✓</tspan><tspan x="638" y="468.3">4  ISP core    PE1 → P1   P2   20         10 + 10 = 20            20 = 20  ✗</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="498.2">Example 4, PE1 → P4 (primary via P2): P1 reaches P4 over the diagonal P1→P4 = 20. Back the other way it costs</tspan><tspan x="638" y="518.2">40. If it were 40 both ways, dist(P1,P4) would be 30 (P1 → PE1 → P2 → P4) and 30 &lt; 30 fails. The test is per</tspan><tspan x="638" y="538.2">direction.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="568.2">Over the whole ring, LFA protects 50% of the (destination, link) pairs. The rest need Remote LFA (A3) or</tspan><tspan x="638" y="588.2">TI-LFA (A5).</tspan></text>
<ellipse cx="148" cy="263" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="148" y="270.8">S</tspan></text>
<ellipse cx="448" cy="263" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="448" y="270.8">E</tspan></text>
<ellipse cx="518" cy="493" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518" y="500.8">C</tspan></text>
<ellipse cx="298" cy="543" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="550.8">B</tspan></text>
<ellipse cx="78" cy="493" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="78" y="500.8">A</tspan></text>
<polyline points="184,263 412,263" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298" y="247">1</tspan></text>
<polyline points="458,297 507,458" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="502" y="379">1</tspan></text>
<polyline points="483,501 333,535" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="413" y="547">1</tspan></text>
<polyline points="263,535 113,501" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="183" y="547">1</tspan></text>
<polyline points="88,459 137,298" fill="none" stroke="#e03131" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="94" y="379">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="148" y="214.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="448.5" y="214.2">D = E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518.5" y="550.2">D = C</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="74" y="550.2">neighbor N = A</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="308" y="368.25">D = E:  2 &lt; 1 + 1 = 2  ✗</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="308" y="403.25">D = C:  2 &lt; 1 + 2 = 3  ✓</tspan></text>
<rect x="0" y="761" width="533" height="244" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="799.9">Without it: a loop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="833.15">Ring, D = E. If S used A anyway, A looks up E in its</tspan><tspan x="18" y="854.4">normal table: next hop S. S sends to A, A sends to</tspan><tspan x="18" y="875.65">S, …</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="905.25">S → A → S → A → …   (until TTL runs out)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="936.15">The traffic never arrives, and it eats the S–A link</tspan><tspan x="18" y="957.4">while it bounces. So a candidate that fails this</tspan><tspan x="18" y="978.65">check is never used, whatever the policy says (A16).</tspan></text>
<rect x="553" y="761" width="533" height="244" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="799.9">Related rules</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="830.3">B1  same idea, path forced over</tspan><tspan x="571" y="847.8">    the link S→E instead of router S</tspan><tspan x="571" y="865.3">B4  downstream: dist(N,D) &lt; dist(S,D)</tspan><tspan x="571" y="882.8">    implies loop-free</tspan><tspan x="571" y="900.3">B5  node-protecting: avoids router E</tspan><tspan x="571" y="917.8">B7  only loop-free ones are ranked</tspan><tspan x="571" y="935.3">B9  extended P-space: the same test</tspan><tspan x="571" y="952.8">    for every router Y, not only D</tspan></text>
<rect x="1107" y="761" width="533" height="244" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="799.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="833.15">•  Overload bit on S (A17): N can’t pass through S,</tspan><tspan x="1125" y="854.4">   so the right side is ∞ and the check passes.</tspan><tspan x="1125" y="875.65">•  Max metric or excluded neighbor (B6): skipped</tspan><tspan x="1125" y="896.9">   before this check.</tspan><tspan x="1125" y="918.15">•  Parallel links (A10): another link to E itself is</tspan><tspan x="1125" y="939.4">   loop-free, since dist(E,D) &lt; dist(E,S) +</tspan><tspan x="1125" y="960.65">   dist(S,D).</tspan><tspan x="1125" y="981.9">•  Other ECMP next hops are candidates too (B2).</tspan></text>
<rect x="0" y="1025" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1063.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1097.15">A neighbor is a safe backup only if its own shortest path to D is strictly cheaper than any path back through S: dist(N,D) &lt; dist(N,S) + dist(S,D). A tie fails. In a</tspan><tspan x="18" y="1118.4">ring the neighbor on the far side passes for destinations near it (C) and fails for those near S (E).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1171.2">Sources: docs/02-algorithms.md §2, §6  ·  docs/learn/04-lfa.md (Inequality 1, the ring problem)  ·  examples/02-ring5.yaml, 01-square.yaml, 04-isp-core.yaml  ·  checked with</tspan><tspan x="0" y="1191.2">computeLfa()</tspan></text>
</svg>
