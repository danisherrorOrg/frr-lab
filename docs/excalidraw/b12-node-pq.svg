<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="538" y="350.8">D</tspan></text>
<ellipse cx="438" cy="493" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="438" y="500.8">C</tspan></text>
<ellipse cx="248" cy="523" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="248" y="530.8">B</tspan></text>
<ellipse cx="68" cy="453" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="68" y="460.8">A</tspan></text>
<polyline points="162,263 334,263" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="248" y="247">1</tspan></text>
<polyline points="399,277 507,328" fill="none" stroke="#e03131" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="463" y="288">1</tspan></text>
<polyline points="428,460 378,295" fill="none" stroke="#e03131" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="384" y="390">1</tspan></text>
<polyline points="282,518 405,499" fill="none" stroke="#e03131" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="347" y="537">1</tspan></text>
<polyline points="457,465 519,372" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="506" y="437">4</tspan></text>
<polyline points="118,295 78,420" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="117" y="370">1</tspan></text>
<polyline points="100,465 217,510" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="167" y="472">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="128" y="218.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="368" y="218.2">router E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="538.5" y="298.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="248" y="578.2">link PQ: B</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="458.5" y="548.2">PQ: C</tspan></text>
<rect x="0" y="841" width="533" height="189" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="879.9">Stricter than the RFC, on purpose</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="913.15">RFC 8102 §2.2.6.2 states only the first test via N.</tspan><tspan x="18" y="934.4">We also keep the link rule dist(N,Y) &lt; dist(N,S) +</tspan><tspan x="18" y="955.65">dist(S,Y), so the tunnel never comes back through S</tspan><tspan x="18" y="976.9">(D17).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="1007.2">Keeping both is stricter, never looser (§3.1, D51).</tspan></text>
<rect x="553" y="841" width="533" height="189" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="879.9">Fallback and when it runs</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="913.15">•  Only with protection: node, only without an LFA</tspan><tspan x="571" y="934.4">   (B13), only when D ≠ E (dest-is-next-hop).</tspan><tspan x="571" y="955.65">•  No node PQ: use the link PQ of B11 (protects =</tspan><tspan x="571" y="976.9">   link, fallback = none). RFC 8102 gives no rule</tspan><tspan x="571" y="998.15">   here (D51).</tspan></text>
<rect x="1107" y="841" width="533" height="189" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="879.9">Not modelled</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="913.15">RFC 8102 §2.3.3–2.3.4 prefer a PQ node that covers</tspan><tspan x="1125" y="934.4">more ECMP next hops. LFA Lab protects each primary</tspan><tspan x="1125" y="955.65">link on its own, so it uses cost then id.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="986.2">TI-LFA has its own node mode: remove router E entirely</tspan><tspan x="1125" y="1006.2">(B19).</tspan></text>
<rect x="0" y="1050" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1088.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1122.15">To survive router E failing, both halves of the repair must avoid E: the tunnel to the PQ node, and the PQ node’s own path to D. In Example 8 that moves the choice from</tspan><tspan x="18" y="1143.4">B to C. On the §8.1 ring no PQ node passes, so Remote LFA keeps the link-protecting B.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1196.2">Sources: docs/02-algorithms.md §3.1, §8.1 (worked check, ring with D)  ·  docs/learn/05-remote-lfa.md (Node protection)  ·  examples/08-node-protection.yaml, 04-isp-core.yaml with</tspan><tspan x="0" y="1216.2">protection: node  ·  checked with computeForSource()</tspan></text>
</svg>
