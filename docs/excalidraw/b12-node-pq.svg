<rect x="-30" y="-30" width="1700" height="1281" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B12 · Node-protecting PQ: the whole repair avoids router E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3.1 of docs/02-algorithms.md  ·  RFC 8102 §2.2.2, §2.2.6.2, §2.3.2, §2.3.4  ·  RFC 7490 §5.4  ·  DECISIONS.md D51  ·  code: src/engine/rlfa.ts (nodeRlfa)</tspan></text>
<rect x="0" y="110" width="600" height="711" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">The §8.1 ring with D behind E, S → D,</tspan><tspan x="18" y="176.4">protection: node</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="618.2">Ring S–E–C–B–A–S, every link 1, plus E–D 1 and C–D 4. No LFA</tspan><tspan x="18" y="638.2">for D. Link PQ = {B, C}, best B.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="668.2">Red dashed: router E, the one to protect against.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="698.2">Green: the tunnel S → A → B avoids E (check 1 ✓).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="728.2">Red arrows: B’s own path to D is B → C → E → D (3), through E.</tspan><tspan x="18" y="748.2">C’s path C → E → D is too (check 2 ✗).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="778.2">No node-protecting PQ node: Remote LFA falls back to link PQ B</tspan><tspan x="18" y="798.2">(protects = link).</tspan></text>
<rect x="620" y="110" width="1020" height="711" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: three checks for each Y in Q-space</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="180.25">1  the tunnel to Y avoids E (node P-space):</tspan><tspan x="638" y="199">     S’s own path:  dist(S,Y) &lt; dist(S,E) + dist(E,Y)</tspan><tspan x="638" y="217.75">     or via N ≠ E:  dist(N,Y) &lt; dist(N,E) + dist(E,Y)  and  dist(N,Y) &lt; dist(N,S) + dist(S,Y)</tspan><tspan x="638" y="236.5">2  Y’s own path to D avoids E:  dist(Y,D) &lt; dist(Y,E) + dist(E,D)</tspan><tspan x="638" y="255.25">3  Y doesn’t have the overload bit</tspan><tspan x="638" y="274">best = lowest cost from S (cheapest way in of check 1), then lowest router id</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="305.15">•  Link mode only asks that the repair avoid the link S–E. If router E fails, the PQ node’s path to D</tspan><tspan x="638" y="326.4">   may still run through E.</tspan><tspan x="638" y="347.65">•  Check 2 depends on D, so node mode is worked out per (D, link) and only when D ≠ E.</tspan><tspan x="638" y="368.9">•  Ties count as &quot;may use E&quot;, as in B5.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="402.05">Worked checks (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="431.3">Case          Y     1 tunnel avoids E          2 path to D avoids E   Result</tspan><tspan x="638" y="448.8">------------  ----  -------------------------  ---------------------  ----------</tspan><tspan x="638" y="466.3">§8.1 ring     B     own: 2 &lt; 1 + 2 = 3   ✓     3 &lt; 2 + 1 = 3   ✗      ✗</tspan><tspan x="638" y="483.8">  S → D       C     via A: 2 &lt; 2 + 1 = 3 ✓     2 &lt; 1 + 1 = 2   ✗      ✗</tspan><tspan x="638" y="501.3">              D     own: 2 &lt; 1 + 1 = 2   ✗     –                      ✗</tspan><tspan x="638" y="518.8">8  S → D      B     via N: 3 &lt; 4 + 1 = 5 ✓     3 &lt; 1 + 2 = 3   ✗      ✗</tspan><tspan x="638" y="536.3">              C     via N: 6 &lt; 4 + 4 = 8 ✓     3 &lt; 4 + 2 = 6   ✓      ✓ cost 8</tspan><tspan x="638" y="553.8">              D     own 4 &lt; 4 ✗, N 6 &lt; 6 ✗     –                      ✗</tspan><tspan x="638" y="571.3">4  PE1 → P3   PE2   via P2: 20 &lt; 20+20 ✓       10 &lt; 20 + 10 = 30  ✓   ✓ cost 30</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="599.3">Case         Link PQ (B11)   Node PQ   Used               What happens if E fails (A9)</tspan><tspan x="638" y="616.8">-----------  --------------  --------  -----------------  -----------------------------------</tspan><tspan x="638" y="634.3">§8.1 ring    {B, C}, B       {}        B (link fallback)  breaks at C; C’s LFA D saves it, cost 7</tspan><tspan x="638" y="651.8">8            {B, C}, B       {C}       C via N, cost 8    S → N → B → C → D (11) survives</tspan><tspan x="638" y="669.3">4 PE1→P3     {PE2}           {PE2}     PE2 via P2         the same node either way</tspan></text>
