<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#0c8599"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1214" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B13 · Remote LFA only when there is no LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§3 of docs/02-algorithms.md  ·  RFC 7490 Abstract, §1  ·  code: src/engine/index.ts, rlfa.ts (rlfa.needed)</tspan></text>
<rect x="0" y="110" width="600" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 2: link S–E fails, two destinations</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="591.2">Red dashed: the failed link S–E. PQ = {B, C}, best B, for both</tspan><tspan x="18" y="611.2">rows.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Green: D = C has an LFA, A (2 &lt; 1 + 2 = 3). S just sends to A:</tspan><tspan x="18" y="661.2">no tunnel.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Teal: D = E has no LFA (2 = 1 + 1). Only here does S tunnel to</tspan><tspan x="18" y="711.2">PQ node B (label 16004), which forwards B → C → E.</tspan></text>
<rect x="620" y="110" width="1020" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: try LFA first; tunnel only if no neighbor is safe</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="181.2">best LFA exists for (S, D, S–E)   →  use it;  Remote LFA not needed</tspan><tspan x="638" y="201.2">no LFA                            →  tunnel to the best PQ node (B11), if any</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="232.15">•  An LFA is just another next hop: no tunnel, no extra label, nothing the far end has to understand. A</tspan><tspan x="638" y="253.4">   Remote LFA tunnel needs an extra label, and the repair path is often longer.</tspan><tspan x="638" y="274.65">•  RFC 7490 extends LFA: it adds backups &quot;when none can be provided by the basic mechanisms&quot; (RFC</tspan><tspan x="638" y="295.9">   5286).</tspan><tspan x="638" y="317.15">•  P, Q and PQ are still worked out and shown on every row, for teaching. The detail panel says &quot;Remote</tspan><tspan x="638" y="338.4">   LFA not needed&quot;.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="372.05">Example 2, every row from S (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="402.25">D   Link   LFA                          PQ (best)    Remote LFA used?</tspan><tspan x="638" y="421">--  -----  ---------------------------  -----------  -----------------------------</tspan><tspan x="638" y="439.75">C   S–E    A   (2 &lt; 1 + 2 = 3  ✓)       {B, C} (B)   no: LFA A already protects C</tspan><tspan x="638" y="458.5">E   S–E    none (2 = 1 + 1  ✗)          {B, C} (B)   yes: tunnel to B, 16004</tspan><tspan x="638" y="477.25">B   S–A    E   (2 &lt; 1 + 2 = 3  ✓)       {B, C} (C)   no: LFA E already protects B</tspan><tspan x="638" y="496">A   S–A    none (2 = 1 + 1  ✗)          {B, C} (C)   yes: tunnel to C, 16005</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="529.05">How often the PQ node is not used (every router as the source)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="559.25">Example          Remote LFA needed   Not needed (an LFA exists)</tspan><tspan x="638" y="578">---------------  -----------------   --------------------------</tspan><tspan x="638" y="596.75">2  ring          10                  10</tspan><tspan x="638" y="615.5">4  ISP core      8                   27</tspan><tspan x="638" y="634.25">5  leaf-spine    16                  32</tspan><tspan x="638" y="653">8                9                   24</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="683.2">Counted per (source, D, link) row. In every &quot;not needed&quot; row of these examples a PQ node exists anyway: it</tspan><tspan x="638" y="703.2">just isn’t installed.</tspan></text>
<ellipse cx="148" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="148" y="243.8">S</tspan></text>
<ellipse cx="448" cy="236" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="448" y="243.8">E</tspan></text>
<ellipse cx="518" cy="446" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518" y="453.8">C</tspan></text>
<ellipse cx="298" cy="491" rx="32" ry="32" fill="#ffffff" stroke="#0c8599" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="298" y="498.8">B</tspan></text>
<ellipse cx="78" cy="446" rx="32" ry="32" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="78" y="453.8">A</tspan></text>
<polyline points="184,236 412,236" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298" y="220">1</tspan></text>
<polyline points="507,412 460,270" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="464" y="354">1</tspan></text>
<polyline points="333,484 482,453" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="403" y="452">1</tspan></text>
<polyline points="113,453 262,484" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="193" y="452">1</tspan></text>
<polyline points="137,270 90,412" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="132" y="354">1</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="148" y="187.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="448.5" y="187.2">D = E: Remote LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="518" y="503.2">D = C: LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="78.5" y="503.2">LFA for C</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="548.2">PQ node</tspan></text>
<rect x="0" y="754" width="533" height="209" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="792.9">Part of the protection order (B20)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="825.2">ECMP → LFA → Remote LFA → TI-LFA</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="856.15">Each pair is credited to the simplest method that</tspan><tspan x="18" y="877.4">protects it. In the ring from S: 2 pairs LFA, 2</tspan><tspan x="18" y="898.65">pairs Remote LFA. Over all sources: 20 pairs, LFA</tspan><tspan x="18" y="919.9">10, LFA or Remote LFA 20.</tspan></text>
<rect x="553" y="754" width="533" height="209" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="792.9">A link-only LFA still counts</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="826.15">In node mode (A6) an LFA that isn’t node-protecting</tspan><tspan x="571" y="847.4">still stops Remote LFA from running. To make Remote</tspan><tspan x="571" y="868.65">LFA take over, the LFA policy must rule it out:</tspan><tspan x="571" y="889.9">node_protecting: require (A16).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="920.2">§15: with both knobs on require, S → D has no LFA left,</tspan><tspan x="571" y="940.2">so Remote LFA is used.</tspan></text>
<rect x="1107" y="754" width="533" height="209" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="792.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="826.15">•  ECMP-protected pairs (B2) never need Remote LFA</tspan><tspan x="1125" y="847.4">   either.</tspan><tspan x="1125" y="868.65">•  No LFA and no PQ node (Example 3): only TI-LFA</tspan><tspan x="1125" y="889.9">   protects (A5).</tspan><tspan x="1125" y="911.15">•  The simulation (A9) follows the same order: LFA</tspan><tspan x="1125" y="932.4">   if there is one, else the PQ tunnel.</tspan></text>
<rect x="0" y="983" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1021.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1055.15">Remote LFA is a fallback: S only tunnels to a PQ node when no neighbor is a safe LFA for that destination. On the same failed link, the ring’s C uses LFA A while E uses</tspan><tspan x="18" y="1076.4">the tunnel to B. The spaces are always shown, but the tunnel is installed only where it is needed.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1129.2">Sources: docs/02-algorithms.md §3, §5, §15  ·  docs/learn/05-remote-lfa.md  ·  examples/02-ring5.yaml, 04-isp-core.yaml, 05-leaf-spine.yaml, 08-node-protection.yaml  ·  checked with</tspan><tspan x="0" y="1149.2">computeForSource(), computeCoverage()</tspan></text>
</svg>
