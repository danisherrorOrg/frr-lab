<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1148" width="1700" height="1148">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1148" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">C1 · The 7 project rules: how LFA Lab is built</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">CLAUDE.md  ·  DECISIONS.md D1, D2  ·  enforced by eslint.config.js, .github/workflows/ci.yml, tests/</tspan></text>
<rect x="0" y="110" width="1640" height="194" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">One change, start to finish</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="281.2">Through every step, R6: no new dependency without a line in DECISIONS.md.</tspan></text>
<rect x="18" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="30" y="191.2">1. Plan or build?</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="30" y="219.3">A plan request means</tspan><tspan x="30" y="236.8">docs only (R7)</tspan></text>
<rect x="251" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="263" y="191.2">2. Roadmap step</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="263" y="219.3">docs/04-roadmap.md, in</tspan><tspan x="263" y="236.8">order (R4)</tspan></text>
<polyline points="225,211 247,211" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="485" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="497" y="191.2">3. Read the RFC</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="497" y="219.3">The RFC wins; log it</tspan><tspan x="497" y="236.8">in DECISIONS.md (R3)</tspan></text>
<polyline points="459,211 481,211" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="718" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="730" y="191.2">4. Write the test</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="730" y="219.3">Unit + property; §6</tspan><tspan x="730" y="236.8">examples pass (R2)</tspan></text>
<polyline points="692,211 714,211" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="952" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="964" y="191.2">5. Pure engine</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="964" y="219.3">No React, DOM, window</tspan><tspan x="964" y="236.8">or randomness (R1)</tspan></text>
<polyline points="926,211 948,211" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="1185" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1197" y="191.2">6. CI</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1197" y="219.3">lint · typecheck ·</tspan><tspan x="1197" y="236.8">test · build</tspan></text>
<polyline points="1159,211 1181,211" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="1419" y="166" width="203" height="90" rx="16" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="1431" y="191.2">7. Static site</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1431" y="219.3">dist/, offline, no</tspan><tspan x="1431" y="236.8">backend (R5)</tspan></text>
<polyline points="1393,211 1415,211" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="0" y="324" width="395" height="306" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="362.9">1 · The engine is pure</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="396.15">src/engine/ has no React, no DOM, no</tspan><tspan x="18" y="417.4">window, no randomness. Same input →</tspan><tspan x="18" y="438.65">same output.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="469.2">Why: it runs in a Web Worker for the UI</tspan><tspan x="18" y="489.2">and in Node for the tests, and can</tspan><tspan x="18" y="509.2">become an npm package or CLI later (D2).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="537.3">ESLint in src/engine/ blocks:</tspan><tspan x="18" y="554.8"> react, ui/, state/, worker/</tspan><tspan x="18" y="572.3"> browser globals (window…)</tspan><tspan x="18" y="589.8"> Math.random, Date.now,</tspan><tspan x="18" y="607.3"> new Date()</tspan></text>
<rect x="415" y="324" width="395" height="306" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="433" y="362.9">2 · Tests first</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="433" y="396.15">Every algorithm change needs a test.</tspan><tspan x="433" y="417.4">The worked examples in §6 of</tspan><tspan x="433" y="438.65">02-algorithms.md must keep passing.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="433" y="469.2">Why: the numbers are what users learn</tspan><tspan x="433" y="489.2">from. A wrong number teaches the wrong</tspan><tspan x="433" y="509.2">thing.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="433" y="537.3">864 tests in 77 files</tspan><tspan x="433" y="554.8">11 property-test files</tspan><tspan x="433" y="572.3">  (fast-check)</tspan><tspan x="433" y="589.8">11 examples, each with an</tspan><tspan x="433" y="607.3">  .expected.json fixture</tspan></text>
<rect x="830" y="324" width="395" height="306" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="848" y="362.9">3 · The RFC wins</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="848" y="396.15">If code, docs and RFC disagree:</tspan><tspan x="848" y="417.4">follow the RFC, fix 02-algorithms.md,</tspan><tspan x="848" y="438.65">add a DECISIONS.md entry.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="848" y="469.2">Why: LFA Lab teaches the standard, not</tspan><tspan x="848" y="489.2">our guess. Example D18 (RFC 9855): the</tspan><tspan x="848" y="509.2">clean-up also drops AdjSID(S→N) (§5.1).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="848" y="537.3">RFC → code + test</tspan><tspan x="848" y="554.8">    → docs/02-algorithms.md</tspan><tspan x="848" y="572.3">    → DECISIONS.md</tspan><tspan x="848" y="589.8">61 decisions so far (D1–D61)</tspan></text>
<rect x="1245" y="324" width="395" height="306" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="1263" y="362.9">4 · Roadmap order</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1263" y="396.15">Work through docs/04-roadmap.md in</tspan><tspan x="1263" y="417.4">order, and tick each box when it is</tspan><tspan x="1263" y="438.65">done.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1263" y="469.2">Why: each phase builds on the last:</tspan><tspan x="1263" y="489.2">TI-LFA needs SPF and the avoid-check</tspan><tspan x="1263" y="509.2">(B1) to be right first.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="1263" y="537.3">SPF → LFA → Remote LFA</tspan><tspan x="1263" y="554.8"> → TI-LFA → coverage → UI</tspan><tspan x="1263" y="572.3"> → simulation → feedback</tspan><tspan x="1263" y="589.8"> → launch</tspan><tspan x="1263" y="607.3">52 boxes ticked, 0 open</tspan></text>
<rect x="0" y="650" width="395" height="267" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="688.9">5 · No backend</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="722.15">No backend, analytics or network</tspan><tspan x="18" y="743.4">calls. The app must work offline.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="774.2">Why: free hosting, no privacy worries,</tspan><tspan x="18" y="794.2">works in a lab with no internet (D1).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="822.3">static build in dist/</tspan><tspan x="18" y="839.8">service worker: src/offline/</tspan><tspan x="18" y="857.3">share link data in #t=…</tspan><tspan x="18" y="874.8">  (never sent to a server)</tspan><tspan x="18" y="892.3">no fetch() in src/</tspan></text>
<rect x="415" y="650" width="395" height="267" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="433" y="688.9">6 · Keep it simple</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="433" y="722.15">No new dependency without a line in</tspan><tspan x="433" y="743.4">DECISIONS.md.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="433" y="774.2">Why: every package is code to trust,</tspan><tspan x="433" y="794.2">update and ship to the browser.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="433" y="822.3">6 runtime packages:</tspan><tspan x="433" y="839.8"> react, react-dom, cytoscape,</tspan><tspan x="433" y="857.3"> zustand, js-yaml, lz-string</tspan><tspan x="433" y="874.8">each under &quot;Tooling added&quot;</tspan><tspan x="433" y="892.3">these diagrams: Node only</tspan></text>
<rect x="830" y="650" width="395" height="267" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="848" y="688.9">7 · Plan vs build</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="848" y="722.15">A request for a plan or requirements</tspan><tspan x="848" y="743.4">means docs only. No code until asked.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="848" y="774.2">Why: a plan is cheap to review and</tspan><tspan x="848" y="794.2">change. Code written too early is</tspan><tspan x="848" y="814.2">wasted.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="848" y="842.3">plan = docs/01 … 05</tspan><tspan x="848" y="859.8"> requirements, algorithms,</tspan><tspan x="848" y="877.3"> architecture, roadmap,</tspan><tspan x="848" y="894.8"> testing</tspan></text>
<rect x="1245" y="650" width="395" height="267" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1263" y="688.9">Style</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1263" y="722.15">•  Strict TypeScript, small pure</tspan><tspan x="1263" y="743.4">   functions, named exports.</tspan><tspan x="1263" y="764.65">•  Comments say why and cite the RFC,</tspan><tspan x="1263" y="785.9">   e.g. // RFC 7490 §5.2.1.</tspan><tspan x="1263" y="807.15">•  UI text: short, plain English,</tspan><tspan x="1263" y="828.4">   with real numbers.</tspan><tspan x="1263" y="849.65">•  No AI attribution in commits or</tspan><tspan x="1263" y="870.9">   PRs.</tspan></text>
<rect x="0" y="937" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="975.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1009.15">The rules keep the numbers right and the app simple: a pure engine checked by tests, the RFC as the referee, work done in roadmap order, and a static site with no</tspan><tspan x="18" y="1030.4">backend and few dependencies. Most rules are enforced by tools (ESLint, 864 tests, CI on every push), not just by trust.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1083.2">Sources: CLAUDE.md  ·  DECISIONS.md D1, D2, D3, D14, D18  ·  eslint.config.js  ·  .github/workflows/ci.yml  ·  package.json  ·  docs/04-roadmap.md  ·  tests/</tspan></text>
</svg>
