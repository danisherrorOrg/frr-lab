<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1261" width="1700" height="1261">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1261" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B5 · Node-protecting: the backup avoids router E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§2 of docs/02-algorithms.md  ·  RFC 5286 §1 (Inequality 3), §3.2  ·  RFC 7916 §6.2.2  ·  code: src/engine/lfa.ts (nodeProtecting)</tspan></text>
<rect x="0" y="110" width="600" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">The §15 example: S → D, router E fails</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="571.2">S → D goes via E (cost 11). Two loop-free neighbors: A and B.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="601.2">Red dashed: router E fails, with all its links.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="631.2">Red: A’s own path to D is A → E → D. It dies with E. A then</tspan><tspan x="18" y="651.2">repairs too, and its LFA is S: S → A → S loops.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="681.2">Green: B’s path to D is B → D. It never touches E: S → B → D</tspan><tspan x="18" y="701.2">(13) survives.</tspan></text>
<rect x="620" y="110" width="1020" height="614" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: N’s path to D is cheaper than any path through E</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="183.1">node-protecting   ⇔   dist(N,D)  &lt;  dist(N,E) + dist(E,D)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.15">•  The same shape as loop-free (B3), with router E in place of S. The right side is N’s cheapest path</tspan><tspan x="638" y="236.4">   to D through E.</tspan><tspan x="638" y="257.65">•  Strictly cheaper ⇒ N’s path doesn’t touch E, so the backup survives the whole router failing, not</tspan><tspan x="638" y="278.9">   only the link S–E.</tspan><tspan x="638" y="300.15">•  A tie counts as &quot;may use E&quot;: the RFC asks for strictly less.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="334.05">Worked checks (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="363.3">Example      S → D   N    dist(N,D)  dist(N,E) + dist(E,D)   Node-prot.  Downstream</tspan><tspan x="638" y="380.8">-----------  ------  ---  ---------  ----------------------  ----------  ----------</tspan><tspan x="638" y="398.3">§15 policy   S → D   A    2          1 + 1   = 2             ✗ 2 = 2     ✓</tspan><tspan x="638" y="415.8">§15 policy   S → D   B    11         12 + 1  = 13            ✓ 11 &lt; 13   ✗</tspan><tspan x="638" y="433.3">1  square    S → D   N    10         20 + 10 = 30            ✓ 10 &lt; 30   ✓</tspan><tspan x="638" y="450.8">6            S → D   N    2          1 + 1   = 2             ✗ 2 = 2     ✗</tspan><tspan x="638" y="468.3">2  ring      S → C   A    2          2 + 1   = 3             ✓ 2 &lt; 3     ✗</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="501.05">Simulated: fail router E, from S, LFA only (A9)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="530.3">Example / policy                 S’s LFA  Result for D</tspan><tspan x="638" y="547.8">-------------------------------  -------  -----------------------------------</tspan><tspan x="638" y="565.3">§15, default                     B        S → B → D, cost 13: survives</tspan><tspan x="638" y="582.8">§15, node_protecting: ignore     A        broken at A, then loops S → A → S</tspan><tspan x="638" y="600.3">1, default                       N        S → N → D, cost 25: survives</tspan><tspan x="638" y="617.8">6, default                       N        broken at N; N’s own LFA M saves it:</tspan><tspan x="638" y="635.3">                                          S → N → M → D, cost 21</tspan></text>
<ellipse cx="78" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="78" y="243.8">A</tspan></text>
<ellipse cx="298" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="298" y="243.8">E</tspan></text>
<ellipse cx="518" cy="236" rx="30" ry="30" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518" y="243.8">D</tspan></text>
<ellipse cx="298" cy="466" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="298" y="473.8">S</tspan></text>
<ellipse cx="518" cy="466" rx="30" ry="30" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="518" y="473.8">B</tspan></text>
<polyline points="112,236 264,236" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="188" y="220">1</tspan></text>
<polyline points="332,236 484,236" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="408" y="220">1</tspan></text>
<polyline points="298,432 298,270" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="276.5" y="358">10</tspan></text>
<polyline points="274,441 101,260" fill="none" stroke="#e03131" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="168.5" y="376">10</tspan></text>
<polyline points="332,466 484,466" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="408" y="495">2</tspan></text>
<polyline points="518,432 518,270" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="496.5" y="358">11</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="78" y="191.2">not node-prot.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="191.2">failed router</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518.5" y="191.2">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="298" y="521.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="518.5" y="521.2">node-protecting</tspan></text>
<rect x="0" y="744" width="533" height="266" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="782.9">In the best-LFA order (B7)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="816.15">Step 1, before downstream and before cost. In §15, B</tspan><tspan x="18" y="837.4">wins over A although A is downstream and cheaper (12</tspan><tspan x="18" y="858.65">vs 13).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="889.2">Example 6, N → D (primary via E): M (cost 20,</tspan><tspan x="18" y="909.2">node-protecting) beats S (cost 3, link-only). That is</tspan><tspan x="18" y="929.2">why N saves the traffic when E fails.</tspan></text>
<rect x="553" y="744" width="533" height="266" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="782.9">Policy knob (A16, RFC 7916)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="814.25">lfa_policy:</tspan><tspan x="571" y="833">  node_protecting: prefer | require | ignore</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="864.15">•  prefer (default): step 1 of B7.</tspan><tspan x="571" y="885.4">•  require: link-only LFAs are never chosen</tspan><tspan x="571" y="906.65">   (not-node-protecting).</tspan><tspan x="571" y="927.9">•  ignore: step 1 is skipped. In §15, A is then</tspan><tspan x="571" y="949.15">   picked.</tspan></text>
<rect x="1107" y="744" width="533" height="266" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="782.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="816.15">•  D = E: node protection can’t apply (E is the</tspan><tspan x="1125" y="837.4">   destination), so require doesn’t rule anything</tspan><tspan x="1125" y="858.65">   out.</tspan><tspan x="1125" y="879.9">•  A parallel link to E (A10) is never</tspan><tspan x="1125" y="901.15">   node-protecting: it ends at E.</tspan><tspan x="1125" y="922.4">•  Overload bit on E (A17): N can’t pass through E,</tspan><tspan x="1125" y="943.65">   so the right side is ∞.</tspan><tspan x="1125" y="964.9">•  Remote LFA and TI-LFA have their own node mode</tspan><tspan x="1125" y="986.15">   (B12, B19).</tspan></text>
<rect x="0" y="1030" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1068.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1102.15">A link-only LFA protects against the link S–E failing, but its path may run through router E. If the whole router fails, that backup dies too. dist(N,D) &lt; dist(N,E) +</tspan><tspan x="18" y="1123.4">dist(E,D) proves N’s path avoids E, so the backup survives either failure. That is why it is step 1 of the choice.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1176.2">Sources: docs/02-algorithms.md §2, §8.1, §15 (worked example)  ·  docs/learn/04-lfa.md (Inequality 3)  ·  examples/06-link-protecting.yaml, 01-square.yaml, 02-ring5.yaml  ·  checked</tspan><tspan x="0" y="1196.2">with computeLfa(), simulateFailure()</tspan></text>
</svg>
