<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A22 · Multi-level IS-IS: one level at a time</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§21 of docs/02-algorithms.md  ·  ISO 10589 §7.2 (Level-1 areas, Level-2 backbone)  ·  code: src/engine/levels.ts</tspan></text>
<rect x="0" y="110" width="600" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 10: two areas, one backbone</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="611.2">Teal boxes: the areas. R1 and R5 are Level-1 only (dashed);</tspan><tspan x="18" y="631.2">R2, R3, R4 are Level-1-2.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="661.2">Teal links: level 1 only. Purple: level 2 only. Black: both</tspan><tspan x="18" y="681.2">levels (left out = both).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="711.2">Square: LAN1 (R2, R3, R4), metric 10, both levels.</tspan></text>
<rect x="620" y="110" width="1020" height="624" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: levelTopology(t, key) cuts out one level</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">Each level has its own adjacencies, its own SPF and its own FRR, so LFA Lab shows one level at a time.</tspan><tspan x="638" y="203.4">In YAML: a router’s level: 1 | 2 | 1-2 (left out = 1-2) and area; a link’s or LAN’s level: 1 | 2 (left</tspan><tspan x="638" y="224.65">out = both).</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="254.25">Level-2 (key 2):        routers not level: 1;  links between them not level: 1;</tspan><tspan x="638" y="273">                        LANs not level: 1, with their L2-capable members</tspan><tspan x="638" y="291.75">Level-1, area A (1:A):  L1-capable routers of area A;  links between them not level: 2.</tspan><tspan x="638" y="310.5">                        L1 adjacencies form only inside one area: links to another</tspan><tspan x="638" y="329.25">                        area are left out. A LAN keeps its members in A.</tspan><tspan x="638" y="348">Any level:              a LAN left with fewer than 2 members is dropped</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="381.05">Example 10, the three views</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="411.25">View                     Routers      Links                        LAN1</tspan><tspan x="638" y="430">-----------------------  -----------  ---------------------------  ----------------------</tspan><tspan x="638" y="448.75">Level-2                  R2, R3, R4   R2–R3, R3–R4                 R2, R3, R4</tspan><tspan x="638" y="467.5">Level-1, area 49.0001    R1, R2, R3   R1–R2, R1–R3, R2–R3          R2, R3</tspan><tspan x="638" y="486.25">Level-1, area 49.0002    R4, R5       R4–R5                        only R4 → dropped</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="517.15">Picking a view makes it the network on screen: results, failures, coverage, heat map, what-if, weakest</tspan><tspan x="638" y="538.4">spots and quiz all work on it unchanged. &quot;Whole network, as one level&quot; puts every adjacency into one</tspan><tspan x="638" y="559.65">SPF.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="590.2">Level-2, R2 → R4 over LAN1: the same LFA as in A21, R3 over R2–R3 (cost 25).</tspan></text>
<rect x="18" y="196" width="250" height="390" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2" stroke-dasharray="10 7"/>
