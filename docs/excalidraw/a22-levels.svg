<rect x="398" y="196" width="184" height="390" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2" stroke-dasharray="10 7"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="408" y="217.2">area 49.0002</tspan></text>
