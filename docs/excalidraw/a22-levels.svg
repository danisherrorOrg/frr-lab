<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="333" y="428.25">LAN1</tspan></text>
<polyline points="96,368 180,299" fill="none" stroke="#0c8599" stroke-width="3" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0c8599" text-anchor="middle" xml:space="preserve"><tspan x="120.5" y="319">10</tspan></text>
