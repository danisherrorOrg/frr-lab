<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="458" y="346.25">L1-2</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="144" y="261.25">L1-2</tspan></text>
<rect x="0" y="754" width="533" height="223" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="792.9">Editing inside a level</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="826.15">Edits are merged back into the whole network</tspan><tspan x="18" y="847.4">(mergeLevel): routers and links the view showed are</tspan><tspan x="18" y="868.65">replaced or removed, new ones are added, a LAN</tspan><tspan x="18" y="889.9">member’s metric follows.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="920.2">Export and Share always write the whole network.</tspan><tspan x="18" y="940.2">Switching level clears failures and the undo history.</tspan></text>
<rect x="553" y="754" width="533" height="223" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="792.9">Not modelled</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="826.15">•  Routes between levels: an L1 router’s default</tspan><tspan x="571" y="847.4">   route to the nearest L1/L2 router (ATT bit),</tspan><tspan x="571" y="868.65">   route leaking. Other areas’ destinations don’t</tspan><tspan x="571" y="889.9">   appear in a Level-1 view.</tspan><tspan x="571" y="911.15">•  LFA for inter-area prefixes (RFC 5286 §6.2).</tspan><tspan x="571" y="932.4">•  Per-level metrics on one link: import them as two</tspan><tspan x="571" y="953.65">   links, level: 1 and level: 2.</tspan></text>
<rect x="1107" y="754" width="533" height="223" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="792.9">Where the picker shows</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="826.15">The sidebar’s IS-IS level picker appears only when</tspan><tspan x="1125" y="847.4">the network has levels or areas. Example 10 offers:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="877.25">Whole network, as one level</tspan><tspan x="1125" y="896">Level-2                 3 routers</tspan><tspan x="1125" y="914.75">Level-1, area 49.0001   3 routers</tspan><tspan x="1125" y="933.5">Level-1, area 49.0002   2 routers</tspan></text>
<rect x="0" y="997" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1035.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1069.15">IS-IS runs a separate SPF and FRR per level, so LFA Lab cuts out one level (the Level-2 backbone, or one Level-1 area) and runs every tool on it unchanged. A link joins</tspan><tspan x="18" y="1090.4">a level only if both ends belong to it, and a LAN is dropped from a level where fewer than two of its members remain.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1143.2">Sources: docs/02-algorithms.md §21  ·  docs/learn/11-advanced-topics.md (Multi-level IS-IS)  ·  examples/10-lan-levels.yaml  ·  checked with levelViews(), levelTopology()</tspan></text>
</svg>
