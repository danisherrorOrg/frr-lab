<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker>
<marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1286" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">B4 · Downstream: N is closer to D than S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§2 of docs/02-algorithms.md  ·  RFC 5286 §1 (Inequality 2), §3.2  ·  RFC 7916 §6.2.3  ·  code: src/engine/lfa.ts (downstream)</tspan></text>
<rect x="0" y="110" width="600" height="661" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 6: router E fails, both S and N</tspan><tspan x="18" y="176.4">repair</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="598.2">Every link 1, except N–M and M–D (10). S → D and N → D both go</tspan><tspan x="18" y="618.2">via E (cost 2).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="648.2">Red dashed: router E fails, with all its links.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="678.2">Red double arrow: with node_protecting: ignore, S’s LFA is N</tspan><tspan x="18" y="698.2">and N’s LFA is S. Each sends D’s traffic to the other.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="728.2">Green: the default policy. N picks M (node-protecting), so it</tspan><tspan x="18" y="748.2">reaches D on S → N → M → D (21).</tspan></text>
<rect x="620" y="110" width="1020" height="661" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">The rule: N must be strictly closer to D than S is</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="183.1">downstream   ⇔   dist(N,D)  &lt;  dist(S,D)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.15">•  Stronger than loop-free (B3): dist(S,D) ≤ dist(N,S) + dist(S,D), so downstream implies loop-free.</tspan><tspan x="638" y="236.4">•  Why it matters: if N is downstream of S, then S can’t be downstream of N. Two routers that both use</tspan><tspan x="638" y="257.65">   downstream alternates can never hand the traffic back and forth.</tspan><tspan x="638" y="278.9">•  Loop-free alone only promises that N won’t send it back while N uses its normal table. If N is</tspan><tspan x="638" y="300.15">   repairing too (E down for both), N’s backup may be S.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="334.05">Worked checks (from the engine)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="363.3">Example      PLR → D   N    dist(N,D)  dist(PLR,D)  Loop-free  Downstream</tspan><tspan x="638" y="380.8">-----------  --------  ---  ---------  -----------  ---------  -----------</tspan><tspan x="638" y="398.3">6            S → D     N    2          2            ✓ 2 &lt; 3    ✗ 2 = 2</tspan><tspan x="638" y="415.8">6            N → D     S    2          2            ✓ 2 &lt; 3    ✗ 2 = 2</tspan><tspan x="638" y="433.3">6            N → D     M    10         2            ✓ 10 &lt; 12  ✗</tspan><tspan x="638" y="450.8">1  square    S → D     N    10         20           ✓          ✓ 10 &lt; 20</tspan><tspan x="638" y="468.3">§15 policy   S → D     A    2          11           ✓          ✓ 2 &lt; 11</tspan><tspan x="638" y="485.8">§15 policy   S → D     B    11         11           ✓          ✗ 11 = 11</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="518.05">Simulated: fail router E, from S, LFA only (A9)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="547.3">Policy                              S’s LFA  N’s LFA  Result for D</tspan><tspan x="638" y="564.8">----------------------------------  -------  -------  ------------------------</tspan><tspan x="638" y="582.3">default (prefer, prefer)            N        M        S → N → M → D, cost 21</tspan><tspan x="638" y="599.8">node_protecting: ignore             N        S        loops S → N → S</tspan><tspan x="638" y="617.3">downstream: require                 none     none     dropped at S</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="647.2">The loop needs both to fail downstream: dist(S,D) = dist(N,D) = 2. A downstream rule would have rejected</tspan><tspan x="638" y="667.2">both. Here it leaves no LFA, so S drops (or uses Remote LFA / TI-LFA if it runs them).</tspan></text>
<ellipse cx="78" cy="253" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="78" y="260.8">S</tspan></text>
<ellipse cx="298" cy="253" rx="30" ry="30" fill="#ffffff" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="298" y="260.8">E</tspan></text>
<ellipse cx="518" cy="253" rx="30" ry="30" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518" y="260.8">D</tspan></text>
<ellipse cx="188" cy="453" rx="30" ry="30" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="188" y="460.8">N</tspan></text>
<ellipse cx="438" cy="483" rx="30" ry="30" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="438" y="490.8">M</tspan></text>
<polyline points="112,253 264,253" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="188" y="237">1</tspan></text>
<polyline points="332,253 484,253" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="408" y="237">1</tspan></text>
<polyline points="204,423 281,283" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="224" y="349">1</tspan></text>
<polyline points="94,283 171,423" fill="none" stroke="#e03131" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="114" y="370">1</tspan></text>
<polyline points="222,457 404,479" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="315.5" y="451">10</tspan></text>
<polyline points="449,451 507,285" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah1)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="454.5" y="366">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="78" y="208.2">source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="208.2">failed router</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="518.5" y="208.2">destination</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="188.5" y="508.25">dist(N,D) = dist(S,D) = 2</tspan></text>
<rect x="0" y="791" width="533" height="244" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="829.9">In the best-LFA order (B7)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="863.15">Step 2: downstream before not downstream, after</tspan><tspan x="18" y="884.4">node-protecting (step 1) and before cost (step 3).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="915.2">Example 4, P4 → PE1 (primary via P2): P1 and P3 are</tspan><tspan x="18" y="935.2">both node-protecting and both cost 50. P1 is downstream</tspan><tspan x="18" y="955.2">(10 &lt; 20), P3 isn’t (20 = 20), so P1 wins.</tspan></text>
<rect x="553" y="791" width="533" height="244" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="571" y="829.9">Policy knob (A16, RFC 7916)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="861.25">lfa_policy:</tspan><tspan x="571" y="880">  downstream: prefer | require | ignore</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="911.15">•  prefer (default): step 2 of B7.</tspan><tspan x="571" y="932.4">•  require: a non-downstream candidate is shown but</tspan><tspan x="571" y="953.65">   never chosen (not-downstream).</tspan><tspan x="571" y="974.9">•  ignore: step 2 is skipped.</tspan></text>
<rect x="1107" y="791" width="533" height="244" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="829.9">Edge cases</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="863.15">•  Another ECMP next hop (B2) is always downstream:</tspan><tspan x="1125" y="884.4">   it is on a shortest path, so dist(N,D) =</tspan><tspan x="1125" y="905.65">   dist(S,D) − c(S,N).</tspan><tspan x="1125" y="926.9">•  A parallel link to E (A10) is downstream when E</tspan><tspan x="1125" y="948.15">   is closer to D, as it always is on the primary</tspan><tspan x="1125" y="969.4">   path.</tspan><tspan x="1125" y="990.65">•  Downstream says nothing about router E: N may</tspan><tspan x="1125" y="1011.9">   still go through it (B5).</tspan></text>
<rect x="0" y="1055" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1093.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1127.15">A downstream neighbor is strictly closer to D, so traffic only ever moves &quot;downhill&quot; towards D. Two routers repairing at the same time can’t bounce it between them.</tspan><tspan x="18" y="1148.4">Loop-free alone can: in Example 6, S and N are each other’s LFA and loop when router E fails.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1201.2">Sources: docs/02-algorithms.md §2, §8.1, §15  ·  docs/learn/04-lfa.md (Inequality 2)  ·  examples/06-link-protecting.yaml, 01-square.yaml, 04-isp-core.yaml  ·  checked with</tspan><tspan x="0" y="1221.2">computeLfa(), simulateFailure()</tspan></text>
</svg>
