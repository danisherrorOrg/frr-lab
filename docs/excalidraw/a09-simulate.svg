<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1449" width="1700" height="1449">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1449" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A9 · Failure simulation</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§8 of docs/02-algorithms.md  ·  fail links or routers, then follow the traffic hop by hop  ·  code: src/engine/simulate.ts</tspan></text>
<rect x="0" y="110" width="600" height="604" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 6: router E fails, traffic S → D</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="611.2">S’s normal path is S → E → D (cost 2).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="641.2">Red dashed: router E and all its links are down.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="671.2">Green arrows, LFA only: S repairs to N, N repairs again to M.</tspan><tspan x="18" y="691.2">Delivered on S → N → M → D, cost 1 + 10 + 10 = 21.</tspan></text>
<rect x="620" y="110" width="1020" height="604" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">How it works: six steps for every destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="182.15">1. Normal path: follow S’s shortest path (lowest id on ties): S → E → D.</tspan><tspan x="638" y="203.4">2. Affected? It meets a failed link, so yes. The router just before it is the PLR (point of local</tspan><tspan x="638" y="224.65">   repair): S, next hop E.</tspan><tspan x="638" y="245.9">3. Repair: the PLR uses the backup it built for that one link. Every other router keeps its normal</tspan><tspan x="638" y="267.15">   table. Any router whose own link is down repairs too.</tspan><tspan x="638" y="288.4">4. Converge: remove everything that failed, run SPF again: S → N → M → D (21).</tspan><tspan x="638" y="309.65">5. Status, first match wins: unreachable, repaired, dropped, looped.</tspan><tspan x="638" y="330.9">6. Repair = final? Compare at the PLR: same, same-cost or longer.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="364.05">Step 3 for Example 6, in each repair mode</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="394.25">Mode          What the traffic does                                     Status</tspan><tspan x="638" y="413">------------  --------------------------------------------------------  --------</tspan><tspan x="638" y="431.75">LFA only      S → N: S’s LFA, link-protecting only (2 &lt; 1 + 1 fails).   repaired</tspan><tspan x="638" y="450.5">              N’s path is N → E → D: N finds N–E down and uses its own</tspan><tspan x="638" y="469.25">              LFA M, node-protecting (10 &lt; 11 + 1).  Cost 21, = final.</tspan><tspan x="638" y="488">LFA + RLFA    the same: there is an LFA, so Remote LFA doesn’t run.     repaired</tspan><tspan x="638" y="506.75">TI-LFA        S pushes [16005], out via N (path S → N → E → D).         looped</tspan><tspan x="638" y="525.5">              N finds N–E down; its own TI-LFA path is N → S → E → D,</tspan><tspan x="638" y="544.25">              so the packet goes back to S with the same label.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="638" y="574.2">E as a destination is unreachable, as expected: shown on its own line, not as a protection failure. N and M</tspan><tspan x="638" y="594.2">are not affected.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="627.05">The lesson</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="659.15">Each router only plans for its own link (RFC 9855 §1). With a router down, link-protecting TI-LFA can</tspan><tspan x="638" y="680.4">do worse than plain LFA. With protection: node, TI-LFA delivers on S → N → M → D (A6).</tspan></text>
<ellipse cx="88" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="88" y="273.8">S</tspan></text>
<ellipse cx="288" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#e03131" stroke-width="2" stroke-dasharray="10 7"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="288" y="273.8">E</tspan></text>
<ellipse cx="508" cy="266" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="508" y="273.8">D</tspan></text>
<ellipse cx="188" cy="466" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="188" y="473.8">N</tspan></text>
<ellipse cx="438" cy="496" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="438" y="503.8">M</tspan></text>
<polyline points="124,266 252,266" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="188" y="250">1</tspan></text>
<polyline points="324,266 472,266" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="398" y="250">1</tspan></text>
<polyline points="204,434 272,298" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="257" y="382">1</tspan></text>
<polyline points="104,298 172,434" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="119" y="382">1</tspan></text>
<polyline points="224,470 403,491" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="310.5" y="511">10</tspan></text>
<polyline points="448,462 497,301" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="496.5" y="395">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="88.5" y="213.15">PLR 1: LFA N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="288" y="213.15">router E down</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="508.5" y="213.15">destination</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="188.5" y="529.15">PLR 2: LFA M</tspan></text>
<rect x="0" y="734" width="533" height="252" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="772.9">One link: Example 2, fail S–E</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="806.15">Ring, all metrics 1. C and E are affected; S is the</tspan><tspan x="18" y="827.4">PLR for both.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="857.25">TI-LFA:   C  S→A→B→C     3  same</tspan><tspan x="18" y="876">          E  S→A→B→C→E   4  same</tspan><tspan x="18" y="894.75">LFA only: C  LFA A, repaired</tspan><tspan x="18" y="913.5">          E  no LFA → dropped</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="943.2">With one failed link, at most one router repairs and</tspan><tspan x="18" y="963.2">traffic never loops.</tspan></text>
<rect x="553" y="734" width="533" height="252" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="571" y="772.9">Two links: Example 2, S–E and E–C</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="806.15">Traffic to E, TI-LFA. S’s repair S → A → B → C → E</tspan><tspan x="571" y="827.4">meets C–E down at C. C’s own backup for E goes back</tspan><tspan x="571" y="848.65">through B and A to S: the same packet as at the</tspan><tspan x="571" y="869.9">start.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="899.25">S→A→B→C→B→A→S…   looped</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="930.15">E has lost both its links, so its status is</tspan><tspan x="571" y="951.4">unreachable. C survives: S → A → B → C avoids E–C.</tspan></text>
<rect x="1107" y="734" width="533" height="252" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="1125" y="772.9">Two links, a third path</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="806.15">S–E 10, E–D 10, S–A 10, A–D 15, A–B 10, B–D 10. Fail</tspan><tspan x="1125" y="827.4">S–E and A–D, TI-LFA.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="859.15">S’s backup S → A → D meets A–D down at A. A’s own</tspan><tspan x="1125" y="880.4">backup A → B → D avoids both.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="910.25">S→A→B→D   30   repaired, = final</tspan></text>
<rect x="0" y="1006" width="533" height="212" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="18" y="1044.9">A router fails: what each flow is</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1078.15">•  D = E: unreachable, expected</tspan><tspan x="18" y="1099.4">•  not affected: the normal path avoids E</tspan><tspan x="18" y="1120.65">•  survives: the PLR’s planned backup avoids E</tspan><tspan x="18" y="1141.9">•  broken: the planned backup goes through E; the</tspan><tspan x="18" y="1163.15">   panel names the router just before E and why</tspan><tspan x="18" y="1184.4">•  no backup: dropped at the PLR</tspan></text>
<rect x="553" y="1006" width="533" height="212" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1044.9">Hop-by-hop rules (several failures)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1078.15">A router holds one primary and one backup, so it</tspan><tspan x="571" y="1099.4">repairs at most once per visit. Backups are planned</tspan><tspan x="571" y="1120.65">on the full map.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1152.15">Loop = the traffic comes back to a router carrying</tspan><tspan x="571" y="1173.4">the same thing as before. After 255 hops (IP TTL) it</tspan><tspan x="571" y="1194.65">is cut.</tspan></text>
<rect x="1107" y="1006" width="533" height="212" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1044.9">Every router as the source</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1078.15">simulateAllSources() runs it once per router.</tspan><tspan x="1125" y="1099.4">Example 6, router E down, LFA only:</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1129.25">S: 1 affected, repaired, relayed</tspan><tspan x="1125" y="1148">N: D via LFA M, survives</tspan><tspan x="1125" y="1166.75">D: S, N via LFA M, survive</tspan><tspan x="1125" y="1185.5">M: nothing affected</tspan></text>
<rect x="0" y="1238" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1276.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1310.15">FRR plans for one failure. The simulation shows what really happens when more fails: the PLR uses its backup, any router whose own link is down repairs again, and the</tspan><tspan x="18" y="1331.4">traffic ends delivered, dropped or looping. Link-protecting backups can break when a whole router fails.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1384.2">Sources: docs/02-algorithms.md §8–8.2  ·  docs/learn/09-router-and-multiple-failures.md  ·  examples/06-link-protecting.yaml, 02-ring5.yaml  ·  checked with simulateFailure()</tspan></text>
</svg>
