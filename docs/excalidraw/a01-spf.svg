<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1700 1508" width="1700" height="1508">
<defs>
<marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/></marker>
</defs>
<rect x="-30" y="-30" width="1700" height="1508" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="0" y="38">A1 · SPF: shortest paths (Dijkstra)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="75.1">§1 of docs/02-algorithms.md  ·  every backup method (LFA, Remote LFA, TI-LFA) is built from these distances  ·  code: src/engine/spf.ts, paths.ts</tspan></text>
<rect x="0" y="110" width="600" height="607" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="148.9">Example 1: the square</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="18" y="611.2">Blue arrows: S's shortest path to D (cost 20). Its first hop E</tspan><tspan x="18" y="631.2">is S's next hop for D.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="18" y="661.2">Green tags: dist(S, router) once SPF has finished.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="691.2">Black numbers: link metrics (same both ways here).</tspan></text>
<rect x="620" y="110" width="1020" height="607" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="148.9">Dijkstra from S, step by step</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="184.05">Rule: settle the closest router not done yet, then update its neighbors.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="215.2">Step  Settle    Update its neighbors                  Known so far</tspan><tspan x="638" y="235.2">----  --------  ------------------------------------  ------------------</tspan><tspan x="638" y="255.2"> 1    S  (0)    E = 0+10 = 10     N = 0+15 = 15       S 0</tspan><tspan x="638" y="275.2"> 2    E  (10)   D = 10+10 = 20                        S 0, E 10</tspan><tspan x="638" y="295.2"> 3    N  (15)   D via N = 15+10 = 25 &gt; 20, keep 20    S 0, E 10, N 15</tspan><tspan x="638" y="315.2"> 4    D  (20)   nothing new                           S 0, E 10, N 15, D 20</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="348.05">Result</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="380.15">dist(S,E) = 10    dist(S,N) = 15    dist(S,D) = 20.  Shortest path to D: S → E → D, so the next hop for</tspan><tspan x="638" y="401.4">D is E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="435.05">What SPF keeps for every router Y (§1.1)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="467.15">•  dist(R,Y): the cheapest cost from the root R.</tspan><tspan x="638" y="488.4">•  ALL shortest-path predecessors, not just one: needed for ECMP.</tspan><tspan x="638" y="509.65">•  The first-hop set: which neighbors of R are on some shortest path to Y (these are the next hops).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="638" y="543.05">The algorithm in short</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="638" y="574.2">dist[R] = 0, every other dist = ∞</tspan><tspan x="638" y="594.2">while some router is not settled:</tspan><tspan x="638" y="614.2">    X = the unsettled router with the smallest dist      (ties: lowest id)</tspan><tspan x="638" y="634.2">    settle X</tspan><tspan x="638" y="654.2">    for each link X→Y with metric c:</tspan><tspan x="638" y="674.2">        if dist[X] + c &lt;  dist[Y]: dist[Y] = dist[X] + c, preds[Y] = {X}</tspan><tspan x="638" y="694.2">        if dist[X] + c == dist[Y]: add X to preds[Y]         (keeps ECMP)</tspan></text>
<ellipse cx="138" cy="276" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="138" y="283.8">S</tspan></text>
<ellipse cx="458" cy="276" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="458" y="283.8">E</tspan></text>
<ellipse cx="138" cy="476" rx="32" ry="32" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="138" y="483.8">N</tspan></text>
<ellipse cx="458" cy="476" rx="32" ry="32" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7048e8" text-anchor="middle" xml:space="preserve"><tspan x="458" y="483.8">D</tspan></text>
<polyline points="174,276 422,276" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="260">10</tspan></text>
<polyline points="458,312 458,440" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round" marker-end="url(#ah0)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="479.5" y="383">10</tspan></text>
<polyline points="138,312 138,440" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="116.5" y="383">15</tspan></text>
<polyline points="174,476 422,476" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.5" y="505">10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="138" y="220.1">dist 0 (root)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="458.5" y="220.1">dist 10</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="138.5" y="544.1">dist 15</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="458.5" y="544.1">dist 20</tspan></text>
<rect x="0" y="737" width="533" height="320" rx="16" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0c8599" text-anchor="start" xml:space="preserve"><tspan x="18" y="775.9">All-pairs table (§1.3)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="809.15">Run one SPF per router: dist(X,Y) for every pair.</tspan><tspan x="18" y="830.4">Fine for ≤ 200 routers, cached per topology version.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="862.15">from \ to   S    E    N    D</tspan><tspan x="18" y="883.4">S           0   10   15   20</tspan><tspan x="18" y="904.65">E          10    0   20   10</tspan><tspan x="18" y="925.9">N          15   20    0   10</tspan><tspan x="18" y="947.15">D          20   10   10    0</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="18" y="978.2">Read as dist(row, column). dist(N,E) = 20: N→D→E</tspan><tspan x="18" y="998.2">(10+10) beats N→S→E (15+10).</tspan></text>
<rect x="553" y="737" width="533" height="320" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="775.9">ECMP: equal-cost paths (§1.4)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="809.15">If two paths tie, keep BOTH first hops and spread</tspan><tspan x="571" y="830.4">traffic.</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="862.15">Set S–E to 15:</tspan><tspan x="571" y="883.4">S→E→D = 15+10 = 25</tspan><tspan x="571" y="904.65">S→N→D = 15+10 = 25</tspan><tspan x="571" y="925.9">⇒ next hops for D: E and N</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="571" y="959.05">ECMP-protected</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="991.15">If one next hop's link fails, another primary next</tspan><tspan x="571" y="1012.4">hop that doesn't use that link keeps carrying the</tspan><tspan x="571" y="1033.65">traffic. Nothing to pre-compute.</tspan></text>
<rect x="1107" y="737" width="533" height="320" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7048e8" text-anchor="start" xml:space="preserve"><tspan x="1125" y="775.9">Reverse SPF (§1.2)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="809.15">Dijkstra on the map with every link turned around</tspan><tspan x="1125" y="830.4">gives dist(Y,R) for all Y: distances TOWARDS R.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="862.15">Metrics may differ per direction, so dist(X,Y) ≠</tspan><tspan x="1125" y="883.4">dist(Y,X) in general.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="915.15">Used by Remote LFA's Q-space, which needs dist(Y,E)</tspan><tspan x="1125" y="936.4">for every Y: a reverse SPF rooted at E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1125" y="967.2">Example 1 is symmetric, so forward and reverse give the</tspan><tspan x="1125" y="987.2">same numbers.</tspan></text>
<rect x="0" y="1077" width="533" height="200" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="18" y="1115.9">Does a path use S→E? (§1.5, B1)</tspan></text>
<text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1148.2">dist(X,Y) &lt; dist(X,S) + c(S,E) + dist(E,Y)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1179.15">Right side = the cheapest path forced over S→E.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1211.15">Strictly less: every shortest path avoids the link. </tspan><tspan x="18" y="1232.4">Equal: an ECMP path may use it, so treat it as &quot;uses</tspan><tspan x="18" y="1253.65">the link&quot; (the safe choice).</tspan></text>
<rect x="553" y="1077" width="533" height="200" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1115.9">Ties: one path to draw</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="571" y="1149.15">When paths tie, the drawings and the failure</tspan><tspan x="571" y="1170.4">simulation take the neighbor with the lowest router</tspan><tspan x="571" y="1191.65">id at each hop (alphabetical).</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="571" y="1222.2">It changes no protection result; it only makes every</tspan><tspan x="571" y="1242.2">drawing the same each time.</tspan></text>
<rect x="1107" y="1077" width="533" height="200" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1115.9">Special links and routers</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1149.15">Overload bit (§16): the router is reached but never</tspan><tspan x="1125" y="1170.4">passed through. Dijkstra doesn't relax its links</tspan><tspan x="1125" y="1191.65">unless it is the root.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1125" y="1223.15">Parallel links (§9): distances use the cheapest link</tspan><tspan x="1125" y="1244.4">of a bundle.</tspan></text>
<rect x="0" y="1297" width="1640" height="117" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f08c00" text-anchor="start" xml:space="preserve"><tspan x="18" y="1335.9">Takeaway</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="18" y="1369.15">SPF gives three things every FRR method reuses: dist(X,Y) for all pairs, the next hops (with ECMP), and distances towards a router (reverse SPF). Every LFA, Remote LFA</tspan><tspan x="18" y="1390.4">and TI-LFA test is just these numbers compared with a strict &quot;&lt;&quot;.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="0" y="1443.2">Sources: docs/02-algorithms.md §1  ·  docs/learn/02-shortest-paths.md  ·  examples/01-square.yaml</tspan></text>
</svg>
