name: Five-node ring, high-metric B-C - TI-LFA needs Adj-SID
srgb_base: 16000
nodes:
  - { id: S, sid: 1, pos: { x: 0, y: 100 } }
  - { id: E, sid: 2, pos: { x: 200, y: 0 } }
  - { id: A, sid: 3, pos: { x: 80, y: 300 } }
  - { id: B, sid: 4, pos: { x: 320, y: 300 } }
  - { id: C, sid: 5, pos: { x: 400, y: 100 } }
links:
  - { a: S, b: E, metric: 1 }
  - { a: E, b: C, metric: 1 }
  - { a: C, b: B, metric: 10, adj_sid_ab: 24006, adj_sid_ba: 24005 }   # a=C, b=B, so B->C is adj_sid_ba
  - { a: B, b: A, metric: 1 }
  - { a: A, b: S, metric: 1 }
