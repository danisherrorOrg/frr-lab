# Example 6 (docs/02-algorithms.md §8, Phase 9.3): link-protecting backups break when a router fails.
# Source S, destination D, primary next hop E. S's only other neighbor N reaches D through E:
# LFA N is loop-free but not node-protecting (dist(N,D)=2, dist(N,E)+dist(E,D)=1+1=2).
# Fail router E: S's LFA goes S→N→E and breaks; N then uses its own LFA M (S→N→M→D).
# TI-LFA link protection (S-N-E-D, [Prefix D] out via N) breaks too, and loops between S and N.
name: Link-protecting LFA - breaks when E fails
srgb_base: 16000
nodes:
  - { id: S, sid: 1, pos: { x: 0, y: 0 } }
  - { id: E, sid: 2, pos: { x: 250, y: 0 } }
  - { id: N, sid: 3, pos: { x: 125, y: 220 } }
  - { id: M, sid: 4, pos: { x: 400, y: 260 } }
  - { id: D, sid: 5, pos: { x: 500, y: 0 } }
links:
  - { a: S, b: E, metric: 1 }
  - { a: E, b: D, metric: 1 }
  - { a: S, b: N, metric: 1 }
  - { a: N, b: E, metric: 1 }
  - { a: N, b: M, metric: 10 }
  - { a: M, b: D, metric: 10 }
